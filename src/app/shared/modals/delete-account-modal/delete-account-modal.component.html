<div class="p-4 max-w-sm bg-white dark:bg-[#18181A] rounded-lg">
  <div class="text-center mb-3">
    <div class="flex items-center justify-center rounded-full bg-red-100 dark:bg-red-900/30 mx-auto mb-2.5" style="width: 32px; height: 32px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-5 text-red-500 dark:text-red-400">
        <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h2 class="text-base font-semibold text-gray-800 dark:text-white">{{ t.deleteAccountTitle }}</h2>
  </div>
  
  <div class="mb-4">
    <div class="text-xs text-gray-700 dark:text-gray-300 mb-2.5 space-y-1.5">
      <p>{{ t.deleteAccountIntro1 }}</p>
      <p>{{ t.deleteAccountIntro2 }}</p>
      <p>{{ t.deleteAccountIntro3 }}</p>
      <p>{{ t.deleteAccountIntro4 }}</p>
    </div>
    <div class="bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg p-2.5">
      <p class="text-xs text-red-700 dark:text-red-400 font-medium mb-1 flex items-center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5 mr-1">
          <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        {{ t.irreversibleAction }}
      </p>
      <ul class="text-xs text-red-600 dark:text-red-400 space-y-1">
        <li>{{ t.irreversiblePoint1 }}</li>
        <li>{{ t.irreversiblePoint2 }}</li>
        <li>{{ t.irreversiblePoint3 }}</li>
      </ul>
    </div>
  </div>

  <div class="flex flex-col space-y-2">
    <button 
      (click)="contactSupport()"
      class="w-full px-3 py-2 text-sm font-semibold text-white bg-blue-900 dark:bg-blue-700 border border-transparent rounded-lg hover:bg-blue-950 dark:hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
    >
      {{ t.contactSupport }}
    </button>
    <button 
      (click)="confirm()"
      class="w-full px-3 py-2 text-sm font-semibold text-gray-700 dark:text-gray-200 bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-gray-500"
    >
      {{ t.deleteMyAccount }}
    </button>
  </div>
</div>
