<div class="p-6 max-w-sm mx-auto bg-white dark:bg-slate-900 rounded-xl shadow-lg border border-gray-100 dark:border-slate-800">
  <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">
    {{ t.deleteAccountTitle }}
  </h2>
  <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">
    {{ t.deleteAccountIntro1 }}
  </p>
  <div class="flex gap-3 justify-end">
    <button
      type="button"
      (click)="cancel()"
      class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-700 transition-colors">
      {{ t.cancel }}
    </button>
    <button
      type="button"
      (click)="confirm()"
      class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 dark:bg-red-600 dark:hover:bg-red-700 rounded-lg transition-colors">
      {{ t.deleteMyAccount }}
    </button>
  </div>
</div>
