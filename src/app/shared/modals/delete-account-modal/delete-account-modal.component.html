<div class="modal-container">
  <!-- Icono centrado superior -->
  <div class="modal-icon-wrapper error">
    <div class="modal-icon-circle error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="modal-icon">
        <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <!-- Contenido -->
  <div class="modal-content">
    <h2 class="modal-title error">{{ t.deleteAccountTitle }}</h2>
    
    <div class="modal-message-wrapper">
      <div class="text-xs text-gray-700 dark:text-gray-300 mb-4 space-y-2 leading-relaxed">
        <p>{{ t.deleteAccountIntro1 }}</p>
        <p>{{ t.deleteAccountIntro2 }}</p>
        <p>{{ t.deleteAccountIntro3 }}</p>
        <p>{{ t.deleteAccountIntro4 }}</p>
      </div>
      
      <div class="modal-details error">
        <p class="text-xs text-red-700 dark:text-red-400 font-semibold mb-2 flex items-center">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 mr-1.5">
            <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          {{ t.irreversibleAction }}
        </p>
        <ul class="text-xs text-red-600 dark:text-red-400 space-y-1.5 list-disc list-inside">
          <li>{{ t.irreversiblePoint1 }}</li>
          <li>{{ t.irreversiblePoint2 }}</li>
          <li>{{ t.irreversiblePoint3 }}</li>
        </ul>
      </div>
    </div>

    <div class="modal-actions modal-actions-column">
      <button 
        (click)="contactSupport()"
        class="modal-button modal-button-primary warning w-full"
      >
        {{ t.contactSupport }}
      </button>
      <button 
        (click)="confirm()"
        class="modal-button modal-button-secondary w-full"
      >
        {{ t.deleteMyAccount }}
      </button>
    </div>
  </div>
</div>
