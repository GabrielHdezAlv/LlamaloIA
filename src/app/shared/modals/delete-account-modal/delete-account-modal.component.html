<div class="p-6 max-w-md">
  <div class="text-center mb-4">
    <div class="flex items-center justify-center rounded-full bg-red-100 mx-auto mb-3" style="width: 40px; height: 40px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6 text-red-500">
        <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h2 class="text-base font-semibold text-gray-800">{{ t.deleteAccountTitle }}</h2>
  </div>
  
  <div class="mb-6">
    <div class="text-sm text-gray-700 mb-3 space-y-2">
      <p>{{ t.deleteAccountIntro1 }}</p>
      <p>{{ t.deleteAccountIntro2 }}</p>
      <p>{{ t.deleteAccountIntro3 }}</p>
      <p>{{ t.deleteAccountIntro4 }}</p>
    </div>
    <div class="bg-red-50 border border-red-200 rounded-lg p-3">
      <p class="text-xs text-red-700 font-medium mb-1 flex items-center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 mr-1">
          <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        {{ t.irreversibleAction }}
      </p>
      <ul class="text-xs text-red-600 space-y-1">
        <li>{{ t.irreversiblePoint1 }}</li>
        <li>{{ t.irreversiblePoint2 }}</li>
        <li>{{ t.irreversiblePoint3 }}</li>
      </ul>
    </div>
  </div>

  <div class="flex flex-col space-y-3">
    <button 
      (click)="contactSupport()"
      class="w-full px-4 py-3 text-sm font-semibold text-white bg-blue-900 border border-transparent rounded-lg hover:bg-blue-950 focus:outline-none focus:ring-2 focus:ring-blue-500"
    >
      {{ t.contactSupport }}
    </button>
    <button 
      (click)="confirm()"
      class="w-full px-4 py-3 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500"
    >
      {{ t.deleteMyAccount }}
    </button>
  </div>
</div>
