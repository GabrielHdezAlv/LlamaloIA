<div class="p-6 max-w-md bg-white dark:bg-[#18181A] rounded-lg">
  <div class="flex items-center mb-4">
    <div class="flex items-center justify-center rounded-full bg-green-100 dark:bg-green-900/30 mr-3" style="width: 40px; height: 40px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6 text-green-600 dark:text-green-400">
        <path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h2 class="text-xl font-semibold text-green-700 dark:text-green-400">{{ data.title || t.successTitleDefault }}</h2>
  </div>
  
  <p class="text-sm text-gray-800 dark:text-gray-200 mb-4 ml-14">{{ data.message }}</p>
  
  <div *ngIf="data.details" class="bg-green-50 dark:bg-green-900/30 text-green-800 dark:text-green-200 text-xs p-3 rounded mb-4 overflow-auto border border-green-200 dark:border-green-800" style="max-height: 200px;">
    {{ data.details }}
  </div>

  <div class="flex justify-end space-x-3">
    <button 
      *ngIf="data.showActionButton"
      (click)="performAction()"
      class="px-4 py-2 text-sm font-medium text-white bg-green-600 dark:bg-green-700 border border-transparent rounded-lg hover:bg-green-700 dark:hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500"
    >
      {{ data.actionButtonText || t.continue }}
    </button>
    <button 
      (click)="close()"
      class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-gray-500"
    >
      {{ t.close }}
    </button>
  </div>
</div>
