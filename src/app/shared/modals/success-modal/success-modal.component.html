<div class="modal-container 3xl:max-w-xl">
  <!-- Icono centrado superior -->
  <div class="modal-icon-wrapper success pt-8 pb-4 3xl:pt-12 3xl:pb-6">
    <div class="modal-icon-circle success w-[72px] h-[72px] 3xl:w-24 3xl:h-24">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="modal-icon w-9 h-9 3xl:w-12 3xl:h-12">
        <path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <!-- Contenido -->
  <div class="modal-content px-6 pb-6 3xl:px-8 3xl:pb-8">
    <h2 class="modal-title success text-center text-xl font-bold mb-3 3xl:text-2xl 3xl:mb-4">{{ data.title || t.successTitleDefault }}</h2>
    
    <p class="modal-message text-center text-sm text-gray-700 dark:text-gray-300 mb-4 leading-relaxed 3xl:text-base 3xl:mb-5">{{ data.message }}</p>
    
    <div *ngIf="data.details" class="modal-details success rounded-xl p-4 mb-4 text-xs overflow-auto max-h-[200px] 3xl:p-5 3xl:mb-5 3xl:text-sm 3xl:max-h-[250px]">
      <p>{{ data.details }}</p>
    </div>

    <div class="modal-actions flex justify-end gap-3 mt-6 3xl:gap-4 3xl:mt-8">
      <button 
        *ngIf="data.showActionButton"
        (click)="performAction()"
        class="modal-button modal-button-primary success px-5 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 min-w-[100px] 3xl:px-6 3xl:py-3 3xl:text-base 3xl:min-w-[120px]"
      >
        {{ data.actionButtonText || t.continue }}
      </button>
      <button 
        (click)="close()"
        class="modal-button modal-button-secondary px-5 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 min-w-[100px] 3xl:px-6 3xl:py-3 3xl:text-base 3xl:min-w-[120px]"
      >
        {{ t.close }}
      </button>
    </div>
  </div>
</div>
