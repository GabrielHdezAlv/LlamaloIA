<div class="modal-container">
  <!-- Icono centrado superior -->
  <div class="modal-icon-wrapper success">
    <div class="modal-icon-circle success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="modal-icon">
        <path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <!-- Contenido -->
  <div class="modal-content">
    <h2 class="modal-title success">{{ data.title || t.successTitleDefault }}</h2>
    
    <p class="modal-message">{{ data.message }}</p>
    
    <div *ngIf="data.details" class="modal-details success">
      <p>{{ data.details }}</p>
    </div>

    <div class="modal-actions">
      <button 
        *ngIf="data.showActionButton"
        (click)="performAction()"
        class="modal-button modal-button-primary success"
      >
        {{ data.actionButtonText || t.continue }}
      </button>
      <button 
        (click)="close()"
        class="modal-button modal-button-secondary"
      >
        {{ t.close }}
      </button>
    </div>
  </div>
</div>
