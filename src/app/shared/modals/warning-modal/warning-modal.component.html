<div class="modal-container 3xl:max-w-2xl">
  <!-- Contenido -->
  <div class="modal-content px-8 py-8 3xl:px-12 3xl:py-12">
    <p class="modal-message text-center text-sm text-gray-700 dark:text-gray-300 mb-8 leading-relaxed 3xl:text-base 3xl:mb-8">{{ data.message }}</p>
    
    <div *ngIf="data.details" class="modal-details warning rounded-xl p-4 mb-4 text-xs overflow-auto max-h-[200px] 3xl:p-5 3xl:mb-5 3xl:text-sm 3xl:max-h-[250px]">
      <p>{{ data.details }}</p>
    </div>

    <div class="modal-actions flex justify-center items-center gap-4 mt-8 3xl:gap-6 3xl:mt-8">
      <button 
        *ngIf="data.showCancelButton !== false"
        (click)="cancel()"
        class="modal-button modal-button-secondary px-6 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 min-w-[120px] 3xl:px-8 3xl:py-3 3xl:text-base 3xl:min-w-[140px]"
      >
        {{ data.cancelText || t.cancel }}
      </button>
      <button 
        (click)="confirm()"
        class="modal-button modal-button-primary warning dark:!bg-[#FFFFFF] dark:!text-[#000000] dark:hover:!bg-gray-100 px-6 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 min-w-[120px] 3xl:px-8 3xl:py-3 3xl:text-base 3xl:min-w-[140px]"
      >
        {{ data.confirmText || t.continue }}
      </button>
    </div>
  </div>
</div>
