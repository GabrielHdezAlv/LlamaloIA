<div class="modal-container">
  <!-- Icono centrado superior -->
  <div class="modal-icon-wrapper warning">
    <div class="modal-icon-circle warning">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="modal-icon">
        <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <!-- Contenido -->
  <div class="modal-content">
    <h2 class="modal-title warning">{{ data.title || t.warningTitleDefault }}</h2>
    
    <p class="modal-message">{{ data.message }}</p>
    
    <div *ngIf="data.details" class="modal-details warning">
      <p>{{ data.details }}</p>
    </div>

    <div class="modal-actions">
      <button 
        *ngIf="data.showCancelButton !== false"
        (click)="cancel()"
        class="modal-button modal-button-secondary"
      >
        {{ data.cancelText || t.cancel }}
      </button>
      <button 
        (click)="confirm()"
        class="modal-button modal-button-primary warning"
      >
        {{ data.confirmText || t.continue }}
      </button>
    </div>
  </div>
</div>
