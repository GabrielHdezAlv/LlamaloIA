<div class="modal-container 3xl:max-w-2xl">
  <div class="modal-content">
    <div class="modal-header-row">
      <div class="status-dot"></div>

      <div class="message-and-actions">
        <p class="modal-message-text">
          {{ data.message }}
        </p>

        <div class="modal-actions">
          <button 
            *ngIf="data.showCancelButton !== false"
            (click)="cancel()"
            class="modal-button modal-button-secondary"
          >
            {{ data.cancelText || t.cancel }}
          </button>
          <button 
            (click)="confirm()"
            class="modal-button modal-button-primary warning"
          >
            {{ data.confirmText || t.continue }}
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="data.details" class="modal-details warning">
      <p>{{ data.details }}</p>
    </div>
  </div>
</div>
