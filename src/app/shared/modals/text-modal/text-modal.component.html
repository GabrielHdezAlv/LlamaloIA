<div
  class="p-4 max-w-[500px] w-full rounded-3xl bg-white dark:bg-[#131313] font-['Inter',sans-serif] transition-all duration-300 overflow-hidden">
  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <div class="flex items-center gap-3">
      <h2 class="m-0 text-base font-bold tracking-tight text-gray-900 dark:text-white">{{ data.title || "Añadir texto
        manual" }}</h2>
    </div>
    <button (click)="onCancel()"
      class="p-2 rounded-lg text-gray-400 hover:bg-gray-100 dark:hover:bg-white/5 hover:text-gray-600 dark:hover:text-white transition-all duration-200"
      aria-label="Cerrar">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
        width="18" height="18">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Content -->
  <div class="flex flex-col gap-3">
    <div class="flex flex-col gap-1.5">
      <label for="name" class="text-xs font-semibold text-gray-600 dark:text-gray-300">Nombre de la fuente</label>
      <div>
        <input id="name" type="text" [(ngModel)]="name" placeholder="Ej. Instrucciones del cliente"
          class="w-full px-3.5 py-2.5 bg-transparent border border-gray-200 dark:border-white/10 rounded-xl text-xs text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-white/[0.05] focus:border-indigo-600 dark:focus:border-indigo-400 focus:ring-4 focus:ring-indigo-600/10 dark:focus:ring-indigo-400/15 transition-all duration-200" />
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <div class="flex justify-between items-end">
        <label for="content" class="text-xs font-semibold text-gray-600 dark:text-gray-300">Contenido del texto</label>
        <span class="text-xs text-gray-400">{{ textContent.length }} caracteres</span>
      </div>
      <div>
        <textarea id="content" [(ngModel)]="textContent"
          placeholder="Escribe o pega aquí la información detallada que quieras añadir a la base de conocimiento..."
          class="w-full px-3.5 py-2.5 bg-transparent border border-gray-200 dark:border-white/10 rounded-xl text-xs text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-white/[0.05] focus:border-indigo-600 dark:focus:border-indigo-400 focus:ring-4 focus:ring-indigo-600/10 dark:focus:ring-indigo-400/15 transition-all duration-200 resize-none leading-5"
          rows="6"></textarea>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="mt-4 flex justify-end gap-3">
    <button (click)="onCancel()"
      class="px-5 py-2.5 rounded-xl text-sm font-semibold text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-white/5 hover:text-gray-900 dark:hover:text-white transition-all duration-200 flex items-center">
      Cancelar
    </button>
    <button (click)="onConfirm()" [disabled]="!textContent.trim()"
      class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-black dark:bg-[#FFFFFF] text-white dark:text-[#000001] shadow-md hover:shadow-lg hover:-translate-y-0.5 hover:bg-gray-800 dark:hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-md transition-all duration-200 flex items-center">
      <span>Añadir documento</span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
        width="16" height="16" class="ml-2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    </button>
  </div>
</div>
