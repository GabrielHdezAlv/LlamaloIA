<div class="header flex flex-col p-4 bg-white rounded-t-lg items-end">
  <span class="title w-full mt-2 text-lg font-semibold text-center">{{
    data.title
  }}</span>
</div>

<div class="p-4 text-center">
  <p class="text-gray-600">{{ data.message }}</p>
  <button
    type="submit"
    (click)="dialogRef.close()"
    class="w-full py-2 mt-8 bg-blue-900 text-white text-sm font-normal rounded-full hover:bg-blue-800 focus:ring-2 focus:ring-blue-500"
  >
    Cerrar ventana
  </button>
</div>
