<div class="modal-container">
  <!-- Icono centrado superior -->
  <div class="modal-icon-wrapper success">
    <div class="modal-icon-circle success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="modal-icon">
        <path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <!-- Contenido -->
  <div class="modal-content">
    <h2 class="modal-title success">{{ title }}</h2>
    
    <p class="modal-message">{{ message }}</p>
    
    <div class="modal-details success">
      <div class="flex items-start">
        <svg class="w-4 h-4 text-blue-500 dark:text-blue-400 mr-2.5 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
        </svg>
        <div class="text-xs">
          <p class="font-semibold text-blue-700 dark:text-blue-200 mb-1">Tu cuenta está segura</p>
          <p class="text-blue-600 dark:text-blue-300">La nueva contraseña ha sido aplicada inmediatamente. Te recomendamos cerrar sesión y volver a iniciar sesión con tu nueva contraseña.</p>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button 
        *ngIf="showContinueButton"
        (click)="continue()"
        class="modal-button modal-button-primary success"
      >
        {{ continueButtonText }}
      </button>
      <button 
        (click)="close()"
        class="modal-button modal-button-secondary"
      >
        {{ t.close || 'Cerrar' }}
      </button>
    </div>
  </div>
</div>
