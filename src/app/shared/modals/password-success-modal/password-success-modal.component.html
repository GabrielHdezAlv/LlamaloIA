<div class="p-6 max-w-md">
  <!-- Header con icono de éxito -->
  <div class="flex items-center mb-4">
    <div class="flex items-center justify-center rounded-full bg-green-100 mr-3" style="width: 48px; height: 48px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6 text-green-600">
        <path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h2 class="text-xl font-semibold text-green-700">{{ title }}</h2>
  </div>
  
  <!-- Mensaje principal -->
  <p class="text-gray-700 mb-6 leading-relaxed">{{ message }}</p>
  
  <!-- Información adicional de seguridad -->
  <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
    <div class="flex items-start">
      <svg class="w-5 h-5 text-blue-500 mr-3 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
      </svg>
      <div class="text-sm text-blue-700">
        <p class="font-medium mb-1">Tu cuenta está segura</p>
        <p class="text-blue-600">La nueva contraseña ha sido aplicada inmediatamente. Te recomendamos cerrar sesión y volver a iniciar sesión con tu nueva contraseña.</p>
      </div>
    </div>
  </div>

  <!-- Botones de acción -->
  <div class="flex justify-end space-x-3">
    <button 
      *ngIf="showContinueButton"
      (click)="continue()"
      class="px-6 py-2 text-sm font-medium text-white bg-green-600 border border-transparent rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 transition-all duration-200"
    >
      {{ continueButtonText }}
    </button>
    <button 
      (click)="close()"
      class="px-6 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all duration-200"
    >
      {{ t.close || 'Cerrar' }}
    </button>
  </div>
</div>
