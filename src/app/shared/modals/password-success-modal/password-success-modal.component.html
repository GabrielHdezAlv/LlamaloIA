<div class="p-4 max-w-sm bg-white dark:bg-[#18181A] rounded-lg" style="border: none !important; outline: none !important;">
  <!-- Header con icono de éxito -->
  <div class="flex items-center mb-3">
    <div class="flex items-center justify-center rounded-full bg-green-100 dark:bg-green-900/30 mr-3" style="width: 32px; height: 32px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5 text-green-600 dark:text-green-400">
        <path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h2 class="text-lg font-semibold text-green-700 dark:text-green-400">{{ title }}</h2>
  </div>
  
  <!-- Mensaje principal -->
  <p class="text-sm text-gray-700 dark:text-gray-200 mb-4 leading-relaxed">{{ message }}</p>
  
  <!-- Información adicional de seguridad -->
  <div class="bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-lg p-3 mb-4">
    <div class="flex items-start">
      <svg class="w-4 h-4 text-blue-500 dark:text-blue-400 mr-2.5 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
      </svg>
      <div class="text-xs text-blue-700 dark:text-blue-200">
        <p class="font-medium mb-1">Tu cuenta está segura</p>
        <p class="text-blue-600 dark:text-blue-300">La nueva contraseña ha sido aplicada inmediatamente. Te recomendamos cerrar sesión y volver a iniciar sesión con tu nueva contraseña.</p>
      </div>
    </div>
  </div>

  <!-- Botones de acción -->
  <div class="flex justify-end space-x-2">
    <button 
      *ngIf="showContinueButton"
      (click)="continue()"
      class="px-3 py-1.5 text-sm font-medium text-white bg-green-600 dark:bg-green-700 border border-transparent rounded-lg hover:bg-green-700 dark:hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500 transition-all duration-200"
    >
      {{ continueButtonText }}
    </button>
    <button 
      (click)="close()"
      class="px-3 py-1.5 text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all duration-200"
    >
      {{ t.close || 'Cerrar' }}
    </button>
  </div>
</div>
