  <div class="modal-content px-4 pb-6 sm:px-6 3xl:px-8 3xl:pb-8">
    <h2
      class="modal-title danger mb-2 px-0.5 text-center text-lg font-bold leading-snug sm:mb-3 sm:text-xl 3xl:text-2xl 3xl:mb-4">
      {{ data.title }}
    </h2>
    <p
      class="modal-message px-0.5 text-center text-sm leading-relaxed text-gray-700 dark:text-gray-300 sm:text-base 3xl:mb-5 break-words">
      {{ data.message }}
    </p>

    <div
      class="modal-actions mt-6 flex w-full flex-col items-stretch justify-center gap-2 sm:mt-8 sm:flex-row sm:items-center sm:justify-center sm:gap-3 3xl:mt-8 3xl:gap-4">
      <button
        type="button"
        (click)="cancel()"
        class="modal-button modal-button-secondary w-full min-h-[44px] px-4 py-2.5 text-sm font-semibold sm:w-auto sm:min-w-[100px] 3xl:px-6 3xl:py-3 3xl:text-base 3xl:min-w-[120px]">
        {{ data.cancelText }}
      </button>
      <button
        type="button"
        (click)="confirm()"
        class="modal-button modal-button-primary danger w-full min-h-[44px] px-4 py-2.5 text-sm font-semibold sm:w-auto sm:min-w-[100px] 3xl:px-6 3xl:py-3 3xl:text-base 3xl:min-w-[120px]">
        {{ data.confirmText }}
      </button>
    </div>
  </div>
</div>
