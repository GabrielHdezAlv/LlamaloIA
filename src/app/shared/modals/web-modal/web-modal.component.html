<div
  class="modal-container relative h-full max-h-[75vh] 3xl:max-h-[82vh] bg-white dark:bg-[#131313] rounded-3xl w-full max-w-[500px] 3xl:max-w-[640px] mx-auto flex flex-col overflow-hidden">
  <div class="overflow-y-auto flex-1 relative z-10" [class.pb-16]="links.length > 0" [class.pb-4]="links.length === 0">
    <!-- Header con título en esquina superior izquierda -->
    <div class="relative p-4 3xl:p-6 flex-shrink-0">
      <button
        class="absolute top-3 3xl:top-4 right-3 3xl:right-4 flex items-center justify-center hover:opacity-70 transition-opacity cursor-pointer border-none p-0 z-10"
        (click)="onClose()" [attr.aria-label]="t.close">
        <mat-icon class="text-gray-600 dark:text-gray-300 text-xl 3xl:text-2xl h-5 w-5 3xl:h-6 3xl:w-6">close</mat-icon>
      </button>

      <h2 class="text-base 3xl:text-lg font-bold text-gray-900 dark:text-white tracking-tight mb-4 3xl:mb-5">
        {{ data.title || 'Web' }}
      </h2>

      <!-- URL Input Field -->
      <div class="mb-3 3xl:mb-4">
        <label class="block text-xs 3xl:text-sm font-semibold text-gray-600 dark:text-gray-300 mb-1.5 3xl:mb-2">
          URL
        </label>
        <div
          class="relative flex items-center border border-gray-200 dark:border-white/10 rounded-xl bg-transparent overflow-hidden">
          <!-- Protocol selector -->
          <div class="relative flex items-center px-2.5 3xl:px-3 py-2.5 3xl:py-3 bg-transparent">
            <span class="text-xs 3xl:text-sm text-gray-900 dark:text-white mr-1">{{
              urlProtocol
              }}</span>
            <select [(ngModel)]="urlProtocol" class="absolute inset-0 w-full opacity-0 cursor-pointer">
              <option value="https://">https://</option>
              <option value="http://">http://</option>
            </select>
            <svg class="w-3 h-3 3xl:w-3.5 3xl:h-3.5 text-gray-500 dark:text-gray-400 pointer-events-none" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
            <div class="ml-2 h-4 w-0.5 bg-gray-300 dark:bg-white/10"></div>
          </div>
          <!-- Domain input -->
          <input type="text" [(ngModel)]="url" placeholder="www.example.com"
            class="flex-1 px-3 3xl:px-4 py-2.5 3xl:py-3 bg-transparent border-0 text-xs 3xl:text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none" />
        </div>
      </div>

      <!-- Botón de confirmación -->
      <button (click)="onConfirm()" [disabled]="!url.trim()"
        class="w-full px-5 3xl:px-6 py-2.5 3xl:py-3.5 bg-black dark:bg-white text-white dark:text-[#000001] text-sm 3xl:text-base font-semibold rounded-xl hover:bg-gray-800 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-600/10 dark:focus:ring-indigo-400/15 disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg hover:-translate-y-0.5 disabled:hover:translate-y-0 disabled:hover:shadow-md">
        {{ isEditMode ? t.saveChanges : t.addWebSourceTitle }}
      </button>
    </div>
  </div>
</div>
