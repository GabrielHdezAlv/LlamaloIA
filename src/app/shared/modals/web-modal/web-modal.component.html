<div
  class="modal-container relative h-full max-h-[75vh] bg-white dark:bg-[#18181A] rounded-2xl w-full max-w-xl mx-auto flex flex-col overflow-hidden"
>
  <div
    class="overflow-y-auto flex-1 relative z-10"
    [class.pb-16]="links.length > 0"
    [class.pb-4]="links.length === 0"
  >
    <!-- Header con título en esquina superior izquierda -->
    <div class="relative p-5 pb-2 flex-shrink-0">
      <button
        class="absolute top-3 right-3 flex items-center justify-center hover:opacity-70 transition-opacity cursor-pointer border-none p-0 z-10"
        (click)="onClose()"
        [attr.aria-label]="t.close"
      >
        <mat-icon class="text-gray-600 dark:text-gray-300 text-xl h-5 w-5"
          >close</mat-icon
        >
      </button>

      <h2
        class="text-base sm:text-lg md:text-xl font-semibold text-blue-950 dark:text-white tracking-[-0.5px] sm:tracking-[-1px] mb-3"
      >
        Web
      </h2>

      <!-- Recuadro Add links -->
      <div
        class="mt-2 border border-gray-300 dark:border-slate-600 rounded-xl bg-white dark:bg-slate-800 overflow-hidden"
      >
        <!-- URL Input Field -->
        <div class="p-4">
          <label
            class="block text-xs font-medium text-gray-600 dark:text-slate-400 mb-1.5"
          >
            URL
          </label>
          <div
            class="relative flex items-center border border-gray-300 dark:border-slate-600 rounded-lg bg-gray-100 dark:bg-slate-700 overflow-hidden"
          >
            <!-- Protocol selector -->
            <div
              class="relative flex items-center px-2.5 py-2 bg-gray-100 dark:bg-slate-700"
            >
              <span class="text-xs text-gray-900 dark:text-slate-200 mr-1">{{
                urlProtocol
              }}</span>
              <select
                [(ngModel)]="urlProtocol"
                class="absolute inset-0 w-full opacity-0 cursor-pointer"
              >
                <option value="https://">https://</option>
                <option value="http://">http://</option>
              </select>
              <svg
                class="w-3 h-3 text-gray-500 dark:text-slate-400 pointer-events-none"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
              <div class="ml-2 h-4 w-0.5 bg-gray-300 dark:bg-slate-500"></div>
            </div>
            <!-- Domain input -->
            <input
              type="text"
              [(ngModel)]="url"
              placeholder="www.example.com"
              class="flex-1 px-3 py-2 bg-transparent border-0 text-sm text-gray-900 dark:text-slate-200 placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none"
            />
          </div>
        </div>

        <!-- Botón de confirmación -->
        <div class="px-4 pb-4">
          <button
            (click)="onConfirm()"
            [disabled]="!url.trim()"
            class="w-full px-4 py-2 bg-[#0a1740] dark:bg-blue-700 text-white text-sm font-medium rounded-lg hover:bg-gray-950 dark:hover:bg-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Añadir fuente web
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
