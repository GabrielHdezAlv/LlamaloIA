<div class="p-6 max-w-md">
  <h2 class="text-xl font-semibold text-red-700 mb-2">{{ data.title || 'Ha ocurrido un error' }}</h2>
  <p class="text-sm text-gray-800 mb-4">{{ data.message }}</p>
  <pre *ngIf="data.details" class="bg-red-50 text-red-800 text-xs p-3 rounded mb-4 overflow-auto" style="max-height: 200px;">
{{ data.details }}
  </pre>
  <div class="flex justify-end">
    <button mat-raised-button color="primary" (click)="close()">Cerrar</button>
  </div>
</div>
