<div class="p-6 max-w-md">
  <div class="flex items-center mb-2">
    <div class="flex items-center justify-center rounded-full bg-red-100 mr-3" style="width: 40px; height: 40px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6 text-red-400">
        <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h2 class="text-xl font-semibold text-red-700">{{ data.title || 'Ha ocurrido un error' }}</h2>
  </div>
  <p class="text-sm text-gray-800 mb-4 ml-14">{{ data.message }}</p>
  <pre *ngIf="data.details" class="bg-red-50 text-red-800 text-xs p-3 rounded mb-4 overflow-auto" style="max-height: 200px;">
{{ data.details }}
  </pre>
  <div class="flex justify-end">
    <button 
      (click)="close()"
      class="mt-2 bg-white-600 border border-black hover:bg-gray-300 text-blue-950 font-semibold py-2 px-6 rounded-lg"
    >
      Cerrar
    </button>
  </div>
</div>
