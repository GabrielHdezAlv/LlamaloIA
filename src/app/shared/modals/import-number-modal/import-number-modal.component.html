<!-- Modal de Importar Número -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[10000] flex items-center justify-center p-4 fade-in-overlay"
  (click)="close()">
  <div
    class="bg-white dark:bg-[#111111] rounded-xl sm:rounded-2xl border-2 border-gray-200 dark:border-gray-800 w-full max-w-2xl flex flex-col fade-in-content relative"
    (click)="$event.stopPropagation()">

    <!-- Botón de cerrar -->
    <button (click)="close()"
      class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors z-30">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>

    <div class="p-6 sm:p-8 flex flex-col items-center">
      <!-- Título principal -->
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-semibold text-center text-blue-950 dark:text-white mb-1">
        Conectar Número de Teléfono
      </h2>
      <p class="text-center font-semibold text-sm sm:text-base text-blue-950 dark:text-slate-300 mb-8 sm:mb-12">
        a través de Twilio
      </p>

      <!-- Formulario -->
      <form [formGroup]="importForm" (ngSubmit)="onSubmit()" class="w-full max-w-xl space-y-5 sm:space-y-6">
        <!-- Número de teléfono -->
        <div class="space-y-2">
          <label class="block text-sm sm:text-base font-semibold text-gray-900 dark:text-slate-100">
            Número de teléfono <span class="text-red-500 ml-1">*</span>
          </label>
          <div class="flex items-center relative">
            <!-- Dropdown personalizado -->
            <div (click)="toggleCountryMenu()"
              class="w-28 sm:w-32 h-11 sm:h-12 bg-white dark:bg-slate-800 border-2 border-r-0 border-gray-200 dark:border-slate-600 rounded-l-lg px-3 flex items-center justify-between gap-2 cursor-pointer hover:bg-gray-50 dark:hover:bg-slate-700 transition-all shadow-sm">
              <div class="flex items-center gap-2">
                <ng-container [ngSwitch]="selectedCountry">
                  <svg *ngSwitchCase="'es'" width="20" height="12" viewBox="0 0 20 12" class="rounded-sm">
                    <rect width="20" height="12" fill="#C60B1E" />
                    <rect y="3" width="20" height="6" fill="#FFC400" />
                  </svg>
                  <svg *ngSwitchCase="'us'" width="20" height="12" viewBox="0 0 20 12" class="rounded-sm">
                    <rect width="20" height="12" fill="#00247D" />
                    <path d="M0 0L20 12M20 0L0 12" stroke="#FFF" stroke-width="2" />
                    <path d="M0 0L20 12M20 0L0 12" stroke="#CF142B" stroke-width="1" />
                    <rect x="8" width="4" height="12" fill="#FFF" />
                    <rect y="4" width="20" height="4" fill="#FFF" />
                  </svg>
                  <svg *ngSwitchCase="'fr'" width="20" height="12" viewBox="0 0 20 12" class="rounded-sm">
                    <rect width="20" height="12" fill="#fff" />
                    <rect width="6.66" height="12" fill="#0055A4" />
                    <rect x="13.33" width="6.67" height="12" fill="#EF4135" />
                  </svg>
                  <svg *ngSwitchCase="'de'" width="20" height="12" viewBox="0 0 20 12" class="rounded-sm">
                    <rect width="20" height="12" fill="#FFCE00" />
                    <rect y="6" width="20" height="6" fill="#DD0000" />
                    <rect y="4" width="20" height="4" fill="#000" />
                  </svg>
                </ng-container>
                <span
                  class="text-xs sm:text-sm font-medium text-gray-800 dark:text-slate-200">{{selectedCountryCode}}</span>
              </div>
              <svg class="w-3 h-3 text-gray-500 dark:text-slate-400 transition-transform"
                [class.rotate-180]="showCountryMenu" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>

            <!-- Menú desplegable -->
            <ul [class.hidden]="!showCountryMenu"
              class="absolute top-full left-0 mt-1.5 w-32 sm:w-36 bg-white dark:bg-slate-800 border-2 border-gray-200 dark:border-slate-600 rounded-lg shadow-xl z-20 overflow-hidden">
              <li (click)="selectCountry('es', '+34')"
                class="flex items-center px-4 py-2 hover:bg-blue-50 dark:hover:bg-blue-900/20 cursor-pointer text-xs sm:text-sm border-b border-gray-100 dark:border-slate-700 transition-colors">
                <svg width="20" height="12" class="mr-2 rounded-sm">
                  <rect width="20" height="12" fill="#C60B1E" />
                  <rect y="3" width="20" height="6" fill="#FFC400" />
                </svg>
                <span class="font-medium text-gray-800 dark:text-slate-200">+34</span>
              </li>
              <li (click)="selectCountry('us', '+1')"
                class="flex items-center px-4 py-2 hover:bg-blue-50 dark:hover:bg-blue-900/20 cursor-pointer text-xs sm:text-sm border-b border-gray-100 dark:border-slate-700 transition-colors">
                <svg width="20" height="12" class="mr-2 rounded-sm">
                  <rect width="20" height="12" fill="#00247D" />
                  <path d="M0 0L20 12M20 0L0 12" stroke="#FFF" stroke-width="2" />
                </svg>
                <span class="font-medium text-gray-800 dark:text-slate-200">+1</span>
              </li>
              <li (click)="selectCountry('fr', '+33')"
                class="flex items-center px-4 py-2 hover:bg-blue-50 dark:hover:bg-blue-900/20 cursor-pointer text-xs sm:text-sm border-b border-gray-100 dark:border-slate-700 transition-colors">
                <svg width="20" height="12" class="mr-2 rounded-sm">
                  <rect width="20" height="12" fill="#0055A4" />
                  <rect x="6.66" width="6.66" height="12" fill="#fff" />
                  <rect x="13.33" width="6.67" height="12" fill="#EF4135" />
                </svg>
                <span class="font-medium text-gray-800 dark:text-slate-200">+33</span>
              </li>
              <li (click)="selectCountry('de', '+49')"
                class="flex items-center px-4 py-2 hover:bg-blue-50 dark:hover:bg-blue-900/20 cursor-pointer text-xs sm:text-sm transition-colors">
                <svg width="20" height="12" class="mr-2 rounded-sm">
                  <rect width="20" height="12" fill="#FFCE00" />
                  <rect y="6" width="20" height="6" fill="#DD0000" />
                  <rect y="4" width="20" height="4" fill="#000" />
                </svg>
                <span class="font-medium text-gray-800 dark:text-slate-200">+49</span>
              </li>
            </ul>

            <input type="tel" formControlName="phoneNumber" placeholder="630 00 00 00"
              class="flex-1 h-11 sm:h-12 px-4 border-2 border-gray-200 dark:border-slate-600 dark:bg-slate-800 rounded-r-lg rounded-l-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm sm:text-base text-gray-900 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-400 transition-all shadow-sm font-medium" />
          </div>
        </div>

        <!-- Etiqueta -->
        <div class="space-y-2">
          <label class="block text-sm sm:text-base font-semibold text-gray-900 dark:text-slate-100">
            Etiqueta <span
              class="text-gray-500 dark:text-slate-400 text-xs sm:text-sm font-normal ml-1">(opcional)</span>
          </label>
          <input type="text" formControlName="label" placeholder="Ej: Oficina Principal, Ventas, etc."
            class="w-full h-11 sm:h-12 px-4 border-2 border-gray-200 dark:border-slate-600 dark:bg-slate-800 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm sm:text-base text-gray-900 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-400 transition-all shadow-sm font-medium" />
        </div>

        <!-- Botón de importar -->
        <div class="pt-6 sm:pt-8 flex justify-center">
          <button type="submit" [disabled]="importForm.invalid"
            class="px-10 sm:px-16 py-3 bg-[#1B2559] dark:bg-blue-700 text-white font-semibold rounded-lg sm:rounded-xl hover:bg-gray-950 dark:hover:bg-blue-600 transition-all duration-200 shadow-lg hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0">
            Importar Número
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
