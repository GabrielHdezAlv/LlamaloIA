<div
  #modalShell
  class="plan-celebration-shell box-border mx-auto flex max-h-plan-celebration 4xl:max-h-plan-celebration-4xl w-full max-w-plan-celebration 4xl:max-w-plan-celebration-4xl flex-col overflow-hidden rounded-3xl 4xl:rounded-[2rem] border border-black/[0.08] bg-white shadow-[0_4px_6px_-1px_rgba(0,0,0,0.06),0_20px_40px_-12px_rgba(0,0,0,0.14)] dark:border-0 dark:bg-[#18181a] dark:shadow-[0_20px_40px_-12px_rgba(0,0,0,0.45)]">
  <div class="flex min-h-0 flex-1 flex-col overflow-y-auto">
    <div
      class="plan-celebration-hero relative min-h-[13.5rem] 4xl:min-h-[17rem] overflow-hidden bg-gradient-to-b from-rose-50/95 via-amber-50/40 to-white px-6 pb-2 pt-8 sm:px-8 4xl:px-12 4xl:pb-4 4xl:pt-12 dark:from-[#18181a] dark:via-[#18181a] dark:to-[#18181a]">
      <div
        class="plan-celebration-confetti-layer pointer-events-none absolute inset-x-0 bottom-0 top-[-28px] z-0">
        <canvas
          #confettiCanvas
          class="block h-full w-full"
          aria-hidden="true"></canvas>
      </div>

      <div class="relative z-[1] flex flex-col items-center text-center">
        <img
          src="assets/logo_azul.webp"
          alt="Llamalo"
          class="h-14 w-auto shrink-0 object-contain sm:h-16 4xl:h-[5.25rem] dark:hidden" />
        <img
          src="assets/logo_blanco.webp"
          alt="Llamalo"
          class="hidden h-14 w-auto shrink-0 object-contain dark:block sm:h-16 4xl:h-[5.25rem]" />

        <h2
          class="mt-5 max-w-[20rem] 4xl:max-w-[28rem] text-[1.35rem] font-bold leading-snug tracking-tight text-[#1a1a1a] dark:text-white sm:text-2xl 4xl:text-4xl 4xl:mt-8">
          {{ celebrationTitle }}
        </h2>

        <p
          class="mt-3 max-w-[22rem] 4xl:max-w-[30rem] text-sm leading-relaxed text-[#666666] dark:text-gray-400 sm:text-[0.9375rem] 4xl:text-xl 4xl:mt-5">
          {{ celebrationMessage }}
        </p>

        <p class="mt-2 max-w-[22rem] 4xl:max-w-[30rem] text-xs leading-relaxed text-gray-500 dark:text-gray-500 sm:text-sm 4xl:text-lg 4xl:mt-3">
          {{ t.planUpgradeCelebrationSubline }}
        </p>
      </div>
    </div>
  </div>

  <div class="shrink-0 bg-white px-6 pb-5 pt-3 dark:bg-[#18181a] sm:px-8 4xl:px-12 4xl:pb-8 4xl:pt-5">
    <button
      type="button"
      (click)="goToDashboard()"
      class="plan-celebration-dashboard-btn w-full shrink-0 rounded-xl 4xl:rounded-2xl bg-[#1B2559] px-4 py-3 4xl:px-6 4xl:py-4 text-sm font-medium text-white shadow-sm transition-colors hover:bg-[rgb(10,23,64)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B2559] focus-visible:ring-offset-2 dark:bg-white dark:text-[#000000] dark:hover:bg-gray-100 dark:focus-visible:ring-white/30 dark:focus-visible:ring-offset-[#18181a] sm:text-base 4xl:text-xl">
      {{ t.planUpgradeCelebrationContinueDashboard }}
    </button>
  </div>
</div>
