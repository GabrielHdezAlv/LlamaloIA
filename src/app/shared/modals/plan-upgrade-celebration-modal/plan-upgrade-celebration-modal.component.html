<div
  #modalShell
  class="plan-celebration-shell box-border mx-auto flex w-full max-w-plan-celebration max-h-plan-celebration flex-col overflow-y-auto rounded-3xl border border-black/[0.08] bg-white px-6 py-8 shadow-[0_4px_6px_-1px_rgba(0,0,0,0.06),0_20px_40px_-12px_rgba(0,0,0,0.14)] dark:border-white/10 dark:bg-[#18181a] dark:shadow-[0_20px_40px_-12px_rgba(0,0,0,0.45)] sm:px-8">
  <div class="flex flex-col items-center text-center">
    <p
      class="text-sm font-semibold tracking-tight text-gray-900 dark:text-white sm:text-base">
      {{ t.planUpgradeCelebrationWelcomeTop }}
    </p>

    <svg
      class="mt-5 h-16 w-16 shrink-0 text-[#1B2559] sm:h-[4.25rem] sm:w-[4.25rem]"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true">
      <path
        d="M12 22C17.5 22 22 17.5 22 12C22 6.5 17.5 2 12 2C6.5 2 2 6.5 2 12C2 17.5 6.5 22 12 22Z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round" />
      <path
        d="M7.75 12L10.58 14.83L16.25 9.17004"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>

    <h2
      class="mt-6 text-2xl font-bold tracking-tight text-gray-900 dark:text-white sm:text-3xl">
      <span class="font-semibold">{{ t.planUpgradeCelebrationPlanWord }}</span>
      <span class="ml-2">{{ planDisplayName }}</span>
    </h2>
  </div>

  <div class="mt-8 w-full min-h-0 flex-1">
    <h3
      class="mb-4 text-center text-sm font-bold leading-snug tracking-tight text-gray-900 dark:text-white">
      {{ benefitsHeading }}
    </h3>
    <ul class="mx-auto w-full space-y-2.5 text-center">
      @for (feature of celebrationFeatures; track feature.text) {
        <li class="text-sm font-medium leading-snug text-gray-700 dark:text-gray-300">
          - {{ feature.text }}
        </li>
      }
    </ul>
  </div>

  <button
    type="button"
    (click)="goToDashboard()"
    class="mt-8 w-full shrink-0 rounded-xl bg-[#1B2559] px-4 py-3 text-sm font-medium text-white shadow-sm transition-colors hover:bg-[#0a1740] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B2559] focus-visible:ring-offset-2 dark:ring-1 dark:ring-white/15 dark:focus-visible:ring-offset-[#18181a] sm:text-base">
    {{ t.planUpgradeCelebrationContinueDashboard }}
  </button>
</div>
