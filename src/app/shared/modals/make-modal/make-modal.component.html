<div class="relative h-full max-h-[75vh] overflow-y-auto bg-white dark:bg-slate-900 rounded-2xl w-full max-w-xl mx-auto flex flex-col">
  <!-- Header -->
  <div class="relative p-6 flex-shrink-0">
    <button
      class="absolute top-4 right-4 h-8 w-8 bg-gray-100 rounded-full flex items-center justify-center hover:bg-gray-200 transition-colors cursor-pointer border-none p-0 z-10"
      (click)="dialogRef.close()"
      [attr.aria-label]="t.close"
    >
      <mat-icon class="text-gray-600 text-xl h-5 w-5">close</mat-icon>
    </button>
    
    <h2 class="text-lg sm:text-xl md:text-2xl font-semibold text-center text-blue-950 dark:text-white mb-2 tracking-[-0.5px] sm:tracking-[-1px]">
      Añadir Acciones especificas
    </h2>
    <p class="text-center text-sm text-black dark:text-slate-200 mb-3 max-w-lg mx-auto tracking-[-0.3px] px-2">
      Define la acción que la IA podrá ejecutar la accion durante la llamada si se pide informacion que la accion tenga, para eso, conecta el webhook de tu modulo de make
    </p>
  </div>

  <!-- Content -->
  <div class="flex-1 px-8 py-4 overflow-y-auto">
    <!-- Form Section -->
    <div class="max-w-lg mx-auto">
      <form class="space-y-5">
        <!-- Nombre de la acción -->
        <div>
          <label for="actionName" class="block text-sm font-medium text-gray-700 dark:text-slate-200 mb-1.5">
            Nombre de la acción*
          </label>
          <input
            type="text"
            id="actionName"
            [(ngModel)]="actionData.name"
            name="actionName"
            class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 dark:bg-[#262626] rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors text-gray-900 dark:text-slate-200 placeholder-gray-400 dark:placeholder-gray-500"
            placeholder="Ingresa el nombre de la acción"
            required
          />
        </div>

        <!-- Descripción de la acción -->
        <div>
          <label for="actionDescription" class="block text-sm font-medium text-gray-700 dark:text-slate-200 mb-1.5">
            Descripción de la acción
          </label>
          <textarea
            id="actionDescription"
            [(ngModel)]="actionData.description"
            name="actionDescription"
            rows="3"
            class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 dark:bg-[#262626] rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors resize-none text-gray-900 dark:text-slate-200 placeholder-gray-400 dark:placeholder-gray-500"
            placeholder="Describe qué hace esta acción"
          ></textarea>
        </div>

        <!-- URL del servidor -->
        <div>
          <label for="serverUrl" class="block text-sm font-medium text-gray-700 dark:text-slate-200 mb-1.5">
            URL del servidor*
          </label>
          <div class="relative">
            <input
              type="url"
              id="serverUrl"
              [(ngModel)]="actionData.serverUrl"
              name="serverUrl"
              class="w-full px-4 py-2.5 pr-11 border border-gray-300 dark:border-gray-600 dark:bg-[#262626] rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors text-gray-900 dark:text-slate-200 placeholder-gray-400 dark:placeholder-gray-500"
              placeholder="https://hook.eu1.make.com/..."
              required
            />
            <div class="absolute inset-y-0 right-0 flex items-center pr-3">
              <img src="assets/make.webp" alt="Make" class="w-5 h-5 object-contain" />
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div class="flex-shrink-0 p-6">
    <div class="flex justify-center">
      <button
        type="button"
        (click)="onContinue()"
        class="px-8 sm:px-14 py-2 bg-[#0a1740] text-sm text-white font-medium font-sans rounded-lg hover:bg-gray-950 focus:bg-gray-950 transition-all duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 shadow-md tracking-[-0.4px] flex items-center gap-2"
        [disabled]="!isFormValid()"
      >
        Continuar
      </button>
    </div>
  </div>
</div>
