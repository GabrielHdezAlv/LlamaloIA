<div class="relative h-full max-h-[90vh] overflow-y-auto bg-white rounded-2xl shadow-xl w-full max-w-7xl mx-auto flex flex-col">
  <!-- Header -->
  <div class="relative p-8 flex-shrink-0">
    <button
      class="absolute top-4 right-4 h-8 w-8 bg-gray-100 rounded-full flex items-center justify-center hover:bg-gray-200 transition-colors cursor-pointer border-none p-0 z-10"
      (click)="dialogRef.close()"
      [attr.aria-label]="t.close"
    >
      <mat-icon class="text-gray-600 text-xl h-5 w-5">close</mat-icon>
    </button>
    
    <h2 class="text-lg sm:text-2xl md:text-3xl lg:text-4xl font-semibold text-center text-blue-950 mb-2 sm:mb-3 md:mb-4 lg:mb-5 tracking-[-1px] sm:tracking-[-2px] md:tracking-[-2.5px] lg:tracking-[-3px]">
      Añadir Acciones especificas
    </h2>
    <p class="text-center text-sm md:text-base text-black mb-3 sm:mb-6 md:mb-8 max-w-4xl mx-auto tracking-[-0.3px] sm:tracking-[-0.5px] md:tracking-[-1px] px-2 sm:px-4">
      Define la acción que la IA podrá ejecutar la accion durante la llamada si se pide informacion que la accion tenga, para eso, conecta el webhook de tu modulo de make
    </p>
  </div>

  <!-- Content -->
  <div class="flex-1 px-12 py-8 overflow-y-auto">
    <!-- Form Section -->
    <div class="max-w-2xl mx-auto">
      <form class="space-y-6">
        <!-- Nombre de la acción -->
        <div>
          <label for="actionName" class="block text-sm font-medium text-gray-700 mb-2">
            Nombre de la accióhn*
          </label>
          <input
            type="text"
            id="actionName"
            [(ngModel)]="actionData.name"
            name="actionName"
            class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
            placeholder="Ingresa el nombre de la acción"
            required
          />
        </div>

        <!-- Descripción de la acción -->
        <div>
          <label for="actionDescription" class="block text-sm font-medium text-gray-700 mb-2">
            Descripción de la acción
          </label>
          <textarea
            id="actionDescription"
            [(ngModel)]="actionData.description"
            name="actionDescription"
            rows="4"
            class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors resize-none"
            placeholder="Describe qué hace esta acción"
          ></textarea>
        </div>

        <!-- URL del servidor -->
        <div>
          <label for="serverUrl" class="block text-sm font-medium text-gray-700 mb-2">
            URL del servidor*
          </label>
          <div class="relative">
            <input
              type="url"
              id="serverUrl"
              [(ngModel)]="actionData.serverUrl"
              name="serverUrl"
              class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
              placeholder="https://hook.eu1.make.com/..."
              required
            />
            <div class="absolute inset-y-0 right-0 flex items-center pr-3">
              <img src="assets/make.png" alt="Make" class="w-6 h-6 object-contain" />
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div class="flex-shrink-0 p-8 border-gray-200">
    <div class="flex justify-center">
      <button
        type="button"
        (click)="onContinue()"
        class="px-8 sm:px-16 md:px-20 py-1.5 sm:py-2 bg-[#0a1740] text-xs sm:text-sm text-white font-medium font-sans rounded-lg sm:rounded-xl hover:bg-gray-950 focus:bg-gray-950 transition-all duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 shadow-md tracking-[-0.4px] flex items-center gap-2"
        [disabled]="!isFormValid()"
      >
        Continuar
      </button>
    </div>
  </div>
</div>
