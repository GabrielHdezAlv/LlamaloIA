<div class="support-widget" [class.open]="isOpen">
    <!-- Widget Content Box -->
    <div class="widget-container" *ngIf="isOpen">
        <div class="widget-content">
            <h2 class="widget-title">Asistente de voz</h2>
            <div class="sphere-wrapper">
                <div class="liquid-sphere-container">
                    <div class="liquid-sphere">
                        <video src="assets/bucle2.mp4" [muted]="true" [loop]="true" [autoplay]="true"
                            [playsInline]="true" class="sphere-video"></video>
                        <div class="wave" [style.transform]="'translateY(' + (100 - (audioLevel * 10)) + '%)'"></div>
                        <div class="wave" [style.transform]="'translateY(' + (100 - (audioLevel * 12)) + '%)'"></div>
                        <div class="wave" [style.transform]="'translateY(' + (100 - (audioLevel * 15)) + '%)'"></div>
                    </div>
                </div>
            </div>

            <div class="controls-wrapper">
                <button class="mic-btn" (click)="toggleMicrophone()" [class.active]="isMicrophoneActive"
                    [title]="isMicrophoneActive ? 'Desactivar micrófono' : 'Activar micrófono'">
                    <svg *ngIf="!isMicrophoneActive" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    <svg *ngIf="isMicrophoneActive" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                        <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <button class="action-btn close-action" (click)="toggle()" title="Cerrar soporte">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Launcher Button -->
    <button class="launcher" (click)="toggle()" [class.active]="isOpen">
        <svg *ngIf="!isOpen" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
            stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <svg *ngIf="isOpen" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
            stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
</div>
