<div class="support-widget" [class.open]="isOpen">
    <!-- Widget Content Box -->
    <div class="widget-container" *ngIf="isOpen">
        <div class="widget-content">
            <div class="widget-header">
                <div class="header-text">
                    <h2 class="widget-title">Xenon</h2>
                    <span class="widget-subtitle">chat de soporte</span>
                </div>
                <div class="settings-container">
                    <button class="settings-btn" (click)="toggleSettings()" title="Ajustes">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                            <path
                                d="M3 8L15 8M15 8C15 9.65686 16.3431 11 18 11C19.6569 11 21 9.65685 21 8C21 6.34315 19.6569 5 18 5C16.3431 5 15 6.34315 15 8ZM9 16L21 16M9 16C9 17.6569 7.65685 19 6 19C4.34315 19 3 17.6569 3 16C3 14.3431 4.34315 13 6 13C7.65685 13 9 14.3431 9 16Z"
                                stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                    <div class="settings-dropdown" *ngIf="isSettingsOpen">
                        <div class="volume-control">
                            <div class="slider-wrapper">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                </svg>
                                <input type="range" min="0" max="100" [value]="volume" (input)="setVolume(vol.value)"
                                    #vol class="volume-slider"
                                    [style.background]="'linear-gradient(90deg, #ffffff 0%, #ffffff ' + volume + '%, rgba(255, 255, 255, 0.2) ' + volume + '%, rgba(255, 255, 255, 0.2) 100%)'">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="sphere-wrapper w-full relative" style="flex: 1; overflow: hidden;">
                <div
                    style="position: absolute; top: 65%; left: 50%; transform: translate(-50%, -45%) scale(1); pointer-events: none;">
                    <app-ai-sphere [audioLevel]="audioLevel"></app-ai-sphere>
                </div>
            </div>

            <div class="controls-wrapper">
                <div class="buttons-row">
                    <button class="action-btn playback-action" (click)="togglePlayback()" [class.active]="isPlaying"
                        [title]="isPlaying ? 'Detener' : 'Reproducir'">
                        <!-- Play Icon (shown when not playing) -->
                        <svg *ngIf="!isPlaying" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                            width="24" height="24">
                            <path
                                d="M21.4086 9.35258C23.5305 10.5065 23.5305 13.4935 21.4086 14.6474L8.59662 21.6145C6.53435 22.736 4 21.2763 4 18.9671L4 5.0329C4 2.72368 6.53435 1.26402 8.59661 2.38548L21.4086 9.35258Z"
                                fill="black"></path>
                        </svg>
                        <!-- Stop Icon (shown when playing) -->
                        <svg *ngIf="isPlaying" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                            width="24" height="24">
                            <path
                                d="M2 12C2 7.28595 2 4.92893 3.46447 3.46447C4.92893 2 7.28595 2 12 2C16.714 2 19.0711 2 20.5355 3.46447C22 4.92893 22 7.28595 22 12C22 16.714 22 19.0711 20.5355 20.5355C19.0711 22 16.714 22 12 22C7.28595 22 4.92893 22 3.46447 20.5355C2 19.0711 2 16.714 2 12Z"
                                fill="red"></path>
                        </svg>
                    </button>
                    <button class="mic-btn" (click)="toggleMicrophone()" [class.active]="isMicrophoneActive"
                        [title]="isMicrophoneActive ? 'Desactivar micrófono' : 'Activar micrófono'">
                        <!-- Inactive/Muted Icon -->
                        <svg *ngIf="!isMicrophoneActive" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24">
                            <path
                                d="M16 10.4V7.00003C16 4.79089 14.2091 3.00003 12 3.00003C11.0406 3.00003 10.1601 3.3378 9.47086 3.90092M4 12V13C4 17.4183 7.58172 21 12 21C14.4653 21 16.6701 19.8849 18.1376 18.1316M3 3L21 21M12 17C9.79086 17 8 15.2092 8 13V8.00003L15.2815 15.288C14.5585 16.323 13.3583 17 12 17Z"
                                stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        <!-- Active/Unmuted Icon -->
                        <svg *ngIf="isMicrophoneActive" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24">
                            <path
                                d="M20 12V13C20 17.4183 16.4183 21 12 21C7.58172 21 4 17.4183 4 13V12M12 17C9.79086 17 8 15.2091 8 13V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V13C16 15.2091 14.2091 17 12 17Z"
                                stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                </div>
                <p class="branding-text">Powered by Llamalo AI</p>
            </div>
        </div>
    </div>

    <!-- Launcher Button -->
    <button class="launcher" (click)="toggle()" [class.active]="isOpen">
        <span class="launcher-tooltip">Asistente de voz</span>
        <div class="launcher-sphere-wrapper">
            <app-ai-sphere [audioLevel]="audioLevel"></app-ai-sphere>
        </div>
        <svg *ngIf="isOpen" class="close-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </button>
</div>
