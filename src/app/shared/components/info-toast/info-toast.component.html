<div 
  class="info-toast"
  [class]="getTypeClass()"
  [class.visible]="isVisible"
  (click)="close()"
>
  <div class="toast-content">
    <!-- Icono -->
    <div *ngIf="showIcon" class="toast-icon">
      <mat-icon 
        *ngIf="type !== 'loading'" 
        [class]="'icon-' + type"
      >
        {{ getIcon() }}
      </mat-icon>
      <mat-icon 
        *ngIf="type === 'loading'" 
        class="icon-loading spinning"
      >
        {{ getIcon() }}
      </mat-icon>
    </div>

    <!-- Mensaje -->
    <div class="toast-message">
      {{ message }}
    </div>

    <!-- Botón de cerrar -->
    <button 
      class="toast-close"
      (click)="close()"
      aria-label="Cerrar notificación"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
