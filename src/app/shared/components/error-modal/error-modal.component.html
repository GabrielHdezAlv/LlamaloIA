<div class="error-modal-container">
  <div class="modal-overlay" (click)="onClose()"></div>
  
  <div class="modal-content {{ getBorderClass() }}">
    <!-- Header -->
    <div class="modal-header">
      <div class="flex items-center gap-3">
        <mat-icon [class]="getTitleClass()" class="text-2xl">{{ getIcon() }}</mat-icon>
        <h2 [class]="getTitleClass()" class="text-xl font-semibold">{{ title }}</h2>
      </div>
      <button 
        mat-icon-button 
        (click)="onClose()" 
        class="close-button"
        aria-label="Cerrar modal"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <p class="text-gray-700 mb-4">{{ message }}</p>
      
      <!-- Details section -->
      <div *ngIf="details" class="details-section">
        <button 
          mat-button 
          (click)="toggleDetails()"
          class="details-toggle"
        >
          <mat-icon>{{ showDetails ? 'expand_less' : 'expand_more' }}</mat-icon>
          {{ showDetails ? 'Ocultar detalles' : 'Ver detalles' }}
        </button>
        
        <div *ngIf="showDetails" class="details-content">
          <pre class="text-sm text-gray-600 bg-gray-100 p-3 rounded border">{{ details }}</pre>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button 
        mat-button 
        (click)="onClose()"
        class="close-btn"
      >
        Entendido
      </button>
    </div>
  </div>
</div>
