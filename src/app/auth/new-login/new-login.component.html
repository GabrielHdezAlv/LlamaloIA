<div class="flex flex-col md:flex-row h-screen bg-gray-50">
    <!-- Left Side - Welcome (first on mobile) -->
    <div class="w-full md:w-1/2 relative flex items-center justify-center order-1 md:order-1" style="background-image: url('../../../assets/fondo_sesion.png'); background-size: cover; background-position: center;">
      <div class="relative text-center z-10 p-6 md:p-10">
        <h1 class="text-xl md:text-2xl font-bold text-gray-800">¡Bienvenido de vuelta!</h1>
        <p class="mt-2 text-gray-600 text-sm md:text-base">
          ¿No tiene una cuenta? 
          <a href="#" class="text-indigo-600 font-semibold hover:underline">Regístrese ahora</a>
        </p>
      </div>
    </div>
  
    <!-- Right Side - Login Form (second on mobile) -->
    <div class="w-full md:w-1/2 flex flex-col items-center justify-center px-4 py-8 order-2 md:order-2">
      <div class="w-full max-w-md space-y-6">
        <!-- Título y subtítulo alineados a la izquierda y más grande -->
        <div class="text-left mb-8">
          <h2 class="text-2xl font-bold text-gray-900">Iniciar sesión</h2>
          <p class="text-gray-600 mt-1 text-sm">Introduzca sus datos de acceso!</p>
        </div>
  
        <form class="space-y-6">
          <!-- Email Input -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
            <input
              type="email"
              id="email"
              placeholder="info@example.com"
              class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200"
            />
          </div>
  
          <!-- Password Input -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
            <div class="relative">
              <input
                type="password"
                id="password"
                placeholder="Contraseña"
                class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200"
              />
              <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                  <path fill-rule="evenodd" d="M.458 10C1.732 6.943 5.523 3 10 3s8.268 3.943 9.542 7c-1.274 3.057-5.064 7-9.542 7S1.732 13.057.458 10zM14 10a2 2 0 11-4 0 2 2 0 014 0z" clip-rule="evenodd" />
                </svg>
              </button>
            </div>
          </div>
  
          <!-- Remember me & Forgot password -->
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input
                type="checkbox"
                id="remember"
                class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded"
              />
              <label for="remember" class="ml-2 block text-sm text-gray-700">Mantener sesión activa</label>
            </div>
            <a href="#" class="text-xs text-indigo-600 hover:underline">¿Has olvidado tu contraseña?</a>
          </div>
  
          <!-- Login Button -->
          <button
            type="submit"
            class="w-full bg-black text-white py-3 px-4 rounded-lg font-medium hover:bg-gray-800 transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          >
            Acceder
          </button>
  
          <!-- Register link -->
          <div class="text-center text-xs text-gray-600">
            ¿Todavía no tienes una cuenta?
            <a href="#" class="text-indigo-600 font-semibold hover:underline">Regístrate</a>
          </div>
  
          <!-- Divider -->
          <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-xs">
              <span class="px-2 bg-gray-50 text-gray-500">O continuar con</span>
            </div>
          </div>
  
          <!-- Google Login Button -->
          <button
            type="button"
            class="w-full flex items-center justify-center gap-3 bg-black text-white py-3 px-4 rounded-lg hover:bg-gray-800 transition duration-200"
          >
            <svg width="30" height="30" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F5"/>
              <path d="M12 23c2.97 0 5.46-.99 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.78 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.24-.73-.38-1.5-.38-2.31 0-.81.14-1.58.38-2.31H2.18V7.07c-1.13.94-1.8 2.38-1.8 3.94 0 1.56.67 2.99 1.8 3.94l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.41 1 12 1 7.78 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            
          </button>
        </form>
      </div>
    </div>
  </div>
