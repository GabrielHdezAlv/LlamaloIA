<div class="flex flex-col md:flex-row h-screen bg-gray-50">
  <div
    class="w-full md:w-1/2 relative flex items-center justify-center order-1 md:order-1 bg-cover bg-center rounded-br-[80px] overflow-hidden"
    style="background-image: url('../../../assets/fondo_sesion.png')"
  >
    <div class="relative text-center z-10 p-6 md:p-12">
      <h1
        class="font-poppins font-bold text-gray-800 text-3xl md:text-5xl leading-tight md:leading-10 welcome-title"
      >
        {{ title }}
      </h1>

      <p
        class="font-poppins text-gray-600 text-base md:text-lg leading-7 mt-4 text-center"
      >
        {{ subtitle }}
        <a
          [routerLink]="linkRoute"
          class="font-bold text-gray-800 hover:underline"
        >
          {{ linkText }}
        </a>
      </p>
    </div>
  </div>

  <!-- Right Side - Login Form -->
  <div
    class="w-full md:w-1/2 flex flex-col items-center justify-center px-6 py-8 md:py-10 order-2 md:order-2"
  >
    <!-- Logo en la esquina superior derecha -->
    <div class="absolute top-14 right-14 z-10">
      <img src="../../../assets/logo.png" alt="Logo" class="h-6 w-auto" />
    </div>

    <div class="w-full max-w-md space-y-8 md:space-y-10">
      <div class="text-left">
        <h2
          class="font-poppins font-semibold text-gray-900 text-3xl md:text-4xl leading-tight login-title"
        >
          {{ formTitle }}
        </h2>
        <p
          class="font-poppins font-normal text-gray-600 text-base md:text-lg mt-2 login-subtitle"
        >
          {{ formSubtitle }}
        </p>
      </div>

      <form class="space-y-6 md:space-y-8" (submit)="submit($event)">
        <!-- Input Nombre completo solo para registro -->
        @if (type === 'register') {
        <div class="relative mt-2">
          <label
            for="fullName"
            class="absolute left-4 top-1 text-xs text-gray-500 input-label"
          >
            Nombre completo
          </label>
          <input
            type="text"
            id="fullName"
            [(ngModel)]="fullName"
            name="fullName"
            placeholder="Juan Carlos"
            class="block w-full px-4 pt-6 pb-2 md:py-4 border border-indigo-400 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 text-sm md:text-base"
          />
        </div>
        }

        <!-- Email Input -->
        <div class="relative mt-2">
          <label
            for="email"
            class="absolute left-4 top-1 text-xs text-gray-500 input-label"
          >
            Correo electrónico
          </label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="info@example.com"
            class="block w-full px-4 pt-6 pb-2 md:py-4 border border-indigo-400 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 text-sm md:text-base"
          />
        </div>

        <!-- Password Input -->
        @if (type !== 'recover') {
        <div>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Contraseña"
              class="mt-2 block w-full px-4 py-3 md:py-4 pr-12 border border-indigo-400 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 text-sm md:text-base"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 transition-colors duration-200"
            >
              @if (showPassword) {
                <!-- Icono de ojo tachado (ocultar) -->
                <svg
                  width="22"
                  height="19"
                  viewBox="0 0 22 19"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M10.83 6L14 9.16V9C14 8.20435 13.6839 7.44129 13.1213 6.87868C12.5587 6.31607 11.7956 6 11 6H10.83ZM6.53 6.8L8.08 8.35C8.03 8.56 8 8.77 8 9C8 9.79565 8.31607 10.5587 8.87868 11.1213C9.44129 11.6839 10.2044 12 11 12C11.22 12 11.44 11.97 11.65 11.92L13.2 13.47C12.53 13.8 11.79 14 11 14C9.67392 14 8.40215 13.4732 7.46447 12.5355C6.52678 11.5979 6 10.3261 6 9C6 8.21 6.2 7.47 6.53 6.8ZM1 1.27L3.28 3.55L3.73 4C2.08 5.3 0.78 7 0 9C1.73 13.39 6 16.5 11 16.5C12.55 16.5 14.03 16.2 15.38 15.66L15.81 16.08L18.73 19L20 17.73L2.27 0M11 4C12.3261 4 13.5979 4.52678 14.5355 5.46447C15.4732 6.40215 16 7.67392 16 9C16 9.64 15.87 10.26 15.64 10.82L18.57 13.75C20.07 12.5 21.27 10.86 22 9C20.27 4.61 16 1.5 11 1.5C9.6 1.5 8.26 1.75 7 2.2L9.17 4.35C9.74 4.13 10.35 4 11 4Z"
                    fill="currentColor"
                  />
                </svg>
              } @else {
                <!-- Icono de ojo abierto (mostrar) -->
                <svg
                  width="22"
                  height="19"
                  viewBox="0 0 22 19"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M11 1.5C6 1.5 1.73 4.61 0 9C1.73 13.39 6 16.5 11 16.5C16 16.5 20.27 13.39 22 9C20.27 4.61 16 1.5 11 1.5ZM11 14C8.24 14 6 11.76 6 9C6 6.24 8.24 4 11 4C13.76 4 16 6.24 16 9C16 11.76 13.76 14 11 14ZM11 6C9.34 6 8 7.34 8 9C8 10.66 9.34 12 11 12C12.66 12 14 10.66 14 9C14 7.34 12.66 6 11 6Z"
                    fill="currentColor"
                  />
                </svg>
              }
            </button>
          </div>
        </div>
        }
        <!-- Remember me & Forgot password -->
        @if (type === 'login') {
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input
              type="checkbox"
              id="remember"
              class="h-5 w-5 text-black focus:ring-black border-black rounded bg-white custom-checkbox"
            />
            <label
              for="remember"
              class="ml-3 block text-sm font-normal text-black font-poppins remember-label"
            >
              Mantener sesión activa
            </label>
          </div>
          <a
            href="recover"
            class="text-xs md:text-sm text-black hover:underline font-medium forgot-password-link"
          >
            ¿Has olvidado tu contraseña?
          </a>
        </div>
        }

        <!-- Login Button -->
        <button
          type="submit"
          class="w-full bg-black text-white py-3 md:py-4 px-6 rounded-lg font-semibold text-base hover:bg-gray-800 transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 login-button"
        >
          {{ buttonText }}
        </button>

        <!-- Register link -->
        <div
          class="text-center text-sm md:text-base text-gray-600 register-text"
        >
          {{ bottomText }}
          <a
            [routerLink]="bottomLinkRoute"
            class="font-semibold text-black hover:underline register-link"
          >
            {{ bottomLinkText }}
          </a>
        </div>

        @if (type !== 'recover') {
        <!-- Divider -->
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t-2 border-indigo-800"></div>
          </div>
          <div class="relative flex justify-center text-xs md:text-base">
            <span class="px-2 bg-gray-50 text-black font-normal divider-text"
              >O continuar con</span
            >
          </div>
        </div>

        <!-- Google Login Button -->
        <button
          type="button"
          class="w-full flex items-center justify-center gap-3 bg-black text-white py-3 md:py-4 px-6 rounded-lg font-semibold text-base hover:bg-gray-800 transition duration-200 google-button"
        >
          <img
            src="../../../assets/google.png"
            alt="Google logo"
            class="h-10 w-10 object-contain"
          />
        </button>
        }
      </form>
    </div>
  </div>
</div>
