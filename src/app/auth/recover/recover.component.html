<div class="container">
  <div class="left">
    <div class="left-text">
      <h1>¿Ha olvidado su contraseña?</h1>
      <p>No te preocupes, ¡la tendrás en segundos!</p>
    </div>
  </div>

  <div class="right">
    <div class="icon-container mb-10">
      <img src="../../../assets/logo.png" class="h-24" alt="Flowbite Logo" />
    </div>
    <h2>Recuperar Contraseña</h2>

    <div class="form-container">
      <form (submit)="recoverPassword($event)">
        <div class="w-full mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            [disabled]="isLoading"
            placeholder="info@example.com"
            class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent disabled:bg-gray-100 disabled:cursor-not-allowed"
          />
        </div>

        <a routerLink="/login" class="forgot-password" [class.disabled]="isLoading">
          Volver al Inicio de Sesión
        </a>

        <button 
          type="submit"
          [disabled]="isLoading"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed"
        >
          <span *ngIf="!isLoading">Enviar Email</span>
          <span *ngIf="isLoading" class="flex items-center justify-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Enviando...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
