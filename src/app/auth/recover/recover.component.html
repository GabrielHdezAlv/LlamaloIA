<div class="container">
  <div class="left">
    <div class="left-text">
      <h1>¿Ha olvidado su contraseña?</h1>
      <p>No te preocupes, ¡la tendrás en segundos!</p>
    </div>
  </div>

  <div class="right">
    <div class="icon-container mb-10">
      <img src="../../../assets/logo.png" class="h-24" alt="Flowbite Logo" />
    </div>
    <h2>Recuperar Contraseña</h2>

    <div class="form-container">
      <form (submit)="recoverPassword($event)">
        <mat-form-field>
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            [disabled]="isLoading"
            placeholder="Ingrese su email"
          />
        </mat-form-field>

        <a routerLink="/login" class="forgot-password" [class.disabled]="isLoading">
          Volver al Inicio de Sesión
        </a>

        <button 
          mat-raised-button 
          color="primary" 
          class="btn-login"
          type="submit"
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">Enviar Email</span>
          <span *ngIf="isLoading">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Enviando...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
