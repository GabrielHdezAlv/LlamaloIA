<div class="verify-email-container">
  <div class="verification-card">
    
    <!-- Input State -->
    <div *ngIf="verificationState === 'input'" class="state-content input-state">
      <div class="header-icon">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 7.00005L10.2 11.65C11.2667 12.45 12.7333 12.45 13.8 11.65L20 7" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 class="state-title">Verifica tu correo</h2>
      <p class="state-message">
        Hemos enviado un código de 6 dígitos a tu bandeja de entrada. Introdúcelo a continuación.
      </p>

      <div class="input-group">
        <input 
          type="text" 
          [(ngModel)]="verificationCode" 
          placeholder="Ej: 123456" 
          maxlength="6"
          class="code-input"
          (keyup.enter)="verifyCode()"
        />
      </div>

      <button class="btn btn-primary verify-btn" (click)="verifyCode()" [disabled]="verificationCode.length < 6">
        Verificar cuenta
      </button>

      <div class="resend-action">
        <p>¿No recibiste el código?</p>
        <button class="btn-link" (click)="resendCode()">Reenviar código</button>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="verificationState === 'loading'" class="state-content loading-state">
      <div class="spinner">
        <div class="spinner-circle"></div>
      </div>
      <h2 class="state-title">{{ message }}</h2>
      <p class="state-message">Por favor, espera un momento.</p>
    </div>

    <!-- Success State -->
    <div *ngIf="verificationState === 'success'" class="state-content success-state">
      <div class="success-icon">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="#10b981" stroke-width="2"/>
          <path d="M9 12l2 2 4-4" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="state-title">¡Email verificado!</h2>
      <p class="state-message">Redirigiendo al login...</p>
      <div class="countdown">
        <div class="countdown-bar"></div>
      </div>
    </div>

    <!-- Error State -->
    <div *ngIf="verificationState === 'error'" class="state-content error-state">
      <div class="error-icon">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="#ef4444" stroke-width="2"/>
          <path d="M15 9l-6 6M9 9l6 6" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="state-title">Error de verificación</h2>
      <p class="state-message">{{ message }}</p>
      <div class="error-actions">
        <button class="btn btn-primary" (click)="navigateToRegister()">
          Ir al registro
        </button>
        <button class="btn btn-secondary" (click)="navigateToLogin()">
          Ir al login
        </button>
      </div>
      <div class="countdown">
        <p class="countdown-text">Intentando de nuevo...</p>
        <div class="countdown-bar"></div>
      </div>
    </div>
  </div>
</div>
