<!-- Sidebar en escritorio -->
<div
  *ngIf="windowWidth >= 1280"
  [class]="'hidden xl:flex xl:flex-col xl:h-full xl:fixed xl:inset-y-0 bg-white border-r border-gray-200 dark:border-neutral-800 transition-all duration-500 ease-in-out ' + (isCollapsed ? 'xl:w-24 sidebar-collapsed' : (windowWidth < 1440 ? 'xl:w-60' : 'xl:w-[21rem] xl:max-w-[88rem]'))"
  (mouseenter)="expandOnHover()"
  (mouseleave)="collapseOnLeave()"
>
  <div class="flex flex-col h-full w-full">
    <!-- Logo principal -->
    <div class="flex items-center justify-center h-16 px-6 mt-6 flex-shrink-0">
      <div class="flex items-center gap-2">
        <img
          src="../../../assets/logo.png"
          alt="Llamalo Logo"
          [ngClass]="{
            'h-8': isCollapsed,
            'h-10 pr-2': !isCollapsed && windowWidth < 1440,
            'h-12 pr-4': !isCollapsed && windowWidth >= 1440
          }"
          class="transition-all duration-500 ease-in-out block dark:hidden"
        />
        <img
          src="../../../assets/logo_blanco.png"
          alt="Llamalo Logo"
          [ngClass]="{
            'h-8': isCollapsed,
            'h-10 pr-2': !isCollapsed && windowWidth < 1440,
            'h-12 pr-4': !isCollapsed && windowWidth >= 1440
          }"
          class="transition-all duration-500 ease-in-out hidden dark:block"
        />
        <div *ngIf="!isCollapsed" [class]="'flex flex-col leading-tight transition-all duration-500 ease-in-out opacity-0 animate-fade-in ' + (windowWidth < 1440 ? 'gap-0.5' : '')">
          <span [class]="'brand-font mt-2 font-bold tracking-[-3px] sidebar-logo-text ' + (windowWidth < 1440 ? 'text-3xl' : 'text-5xl')">Admin</span>
          <span class="brand-font text-[10px] mr-0.5 text-end text-black font-bold -mt-1.5 block tracking-[-0.5px] dark:text-slate-300">Panel</span>
        </div>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
      <a
        routerLink="/admin/home"
        routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        [routerLinkActiveOptions]="{exact: true}"
        [class]="'flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium text-sm ' + (isCollapsed ? 'justify-center' : '') + ' text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'"
        [title]="isCollapsed ? 'Dashboard' : ''"
      >
        <svg width="20" height="20" viewBox="0 0 20 17" fill="currentColor">
          <path d="M8.0001 16V11H12.0001V16C12.0001 16.55 12.4501 17 13.0001 17H16.0001C16.5501 17 17.0001 16.55 17.0001 16V8.99997H18.7001C19.1601 8.99997 19.3801 8.42997 19.0301 8.12997L10.6701 0.599971C10.2901 0.259971 9.7101 0.259971 9.3301 0.599971L0.970098 8.12997C0.630098 8.42997 0.840098 8.99997 1.3001 8.99997H3.0001V16C3.0001 16.55 3.4501 17 4.0001 17H7.0001C7.5501 17 8.0001 16.55 8.0001 16Z" />
        </svg>
        <span *ngIf="!isCollapsed" class="transition-opacity duration-300">Dashboard</span>
      </a>

      <a
        routerLink="/admin/metrics"
        routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        [class]="'flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium text-sm ' + (isCollapsed ? 'justify-center' : '') + ' text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'"
        [title]="isCollapsed ? 'Métricas' : ''"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V5H19V19ZM7 10H9V17H7V10ZM11 7H13V17H11V7ZM15 13H17V17H15V13Z" />
        </svg>
        <span *ngIf="!isCollapsed" class="transition-opacity duration-300">Métricas</span>
      </a>

      <a
        routerLink="/admin/tokens"
        routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        [class]="'flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium text-sm ' + (isCollapsed ? 'justify-center' : '') + ' text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'"
        [title]="isCollapsed ? 'Tokens' : ''"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM12 7C13.4 7 14.8 7.6 15.7 8.7L14.2 10.2C13.6 9.5 12.8 9 12 9C10.3 9 9 10.3 9 12C9 13.7 10.3 15 12 15C12.8 15 13.6 14.5 14.2 13.8L15.7 15.3C14.8 16.4 13.4 17 12 17C9.2 17 7 14.8 7 12C7 9.2 9.2 7 12 7Z"/>
        </svg>
        <span *ngIf="!isCollapsed" class="transition-opacity duration-300">Tokens</span>
      </a>

      <a
        routerLink="/admin/gasto"
        routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        [class]="'flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium text-sm ' + (isCollapsed ? 'justify-center' : '') + ' text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'"
        [title]="isCollapsed ? 'Gasto' : ''"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.8 10.9C9.53 10.31 8.8 9.7 8.8 8.75C8.8 7.66 9.81 6.9 11.5 6.9C13.28 6.9 13.94 7.75 14 9H16.21C16.14 7.28 15.09 5.7 13 5.19V3H10V5.16C8.06 5.58 6.5 6.84 6.5 8.77C6.5 11.08 8.41 12.23 11.2 12.9C13.7 13.5 14.2 14.38 14.2 15.31C14.2 16 13.71 17.1 11.5 17.1C9.44 17.1 8.63 16.18 8.5 15H6.32C6.44 17.22 8.22 18.84 10 19.19V21H13V19.15C14.95 18.73 16.5 17.45 16.5 15.47C16.5 12.96 14.47 11.69 11.8 10.9Z"/>
        </svg>
        <span *ngIf="!isCollapsed" class="transition-opacity duration-300">Gasto</span>
      </a>

      <a
        routerLink="/admin/users"
        routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        [class]="'flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium text-sm ' + (isCollapsed ? 'justify-center' : '') + ' text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'"
        [title]="isCollapsed ? 'Usuarios' : ''"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" />
        </svg>
        <span *ngIf="!isCollapsed" class="transition-opacity duration-300">Usuarios</span>
      </a>

      <a
        routerLink="/admin/analytics"
        routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        [class]="'flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium text-sm ' + (isCollapsed ? 'justify-center' : '') + ' text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'"
        [title]="isCollapsed ? 'Analíticas' : ''"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V5H19V19ZM7 10H9V17H7V10ZM11 7H13V17H11V7ZM15 13H17V17H15V13Z" />
        </svg>
        <span *ngIf="!isCollapsed" class="transition-opacity duration-300">Analíticas</span>
      </a>

      <a
        routerLink="/admin/settings"
        routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        [class]="'flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium text-sm ' + (isCollapsed ? 'justify-center' : '') + ' text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'"
        [title]="isCollapsed ? 'Configuración' : ''"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94C19.18 12.64 19.2 12.33 19.2 12C19.2 11.67 19.18 11.36 19.14 11.06L21.16 9.48C21.34 9.33 21.4 9.08 21.3 8.87L19.3 5.33C19.2 5.12 18.97 5.02 18.75 5.08L16.26 5.84C15.87 5.5 15.43 5.22 14.96 5.02L14.64 2.42C14.61 2.19 14.43 2 14.2 2H9.8C9.57 2 9.39 2.19 9.36 2.42L9.04 5.02C8.57 5.22 8.13 5.5 7.74 5.84L5.25 5.08C5.03 5.02 4.8 5.12 4.7 5.33L2.7 8.87C2.6 9.08 2.66 9.33 2.84 9.48L4.86 11.06C4.82 11.36 4.8 11.67 4.8 12C4.8 12.33 4.82 12.64 4.86 12.94L2.84 14.52C2.66 14.67 2.6 14.92 2.7 15.13L4.7 18.67C4.8 18.88 5.03 18.98 5.25 18.92L7.74 18.16C8.13 18.5 8.57 18.78 9.04 18.98L9.36 21.58C9.39 21.81 9.57 22 9.8 22H14.2C14.43 22 14.61 21.81 14.64 21.58L14.96 18.98C15.43 18.78 15.87 18.5 16.26 18.16L18.75 18.92C18.97 18.98 19.2 18.88 19.3 18.67L21.3 15.13C21.4 14.92 21.34 14.67 21.16 14.52L19.14 12.94ZM12 15.6C10.02 15.6 8.4 13.98 8.4 12C8.4 10.02 10.02 8.4 12 8.4C13.98 8.4 15.6 10.02 15.6 12C15.6 13.98 13.98 15.6 12 15.6Z" />
        </svg>
        <span *ngIf="!isCollapsed" class="transition-opacity duration-300">Configuración</span>
      </a>
    </nav>

    <!-- Botón colapsar -->
    <div class="p-4 border-t border-gray-200 dark:border-neutral-800">
      <button
        (click)="toggleCollapse()"
        class="w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800 transition-colors"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <ng-container *ngIf="!isCollapsed">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 18L15 12L9 6" />
          </ng-container>
          <ng-container *ngIf="isCollapsed">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 18L9 12L15 6" />
          </ng-container>
        </svg>
        <span *ngIf="!isCollapsed" class="text-sm font-medium">Colapsar</span>
      </button>
    </div>
  </div>
</div>
