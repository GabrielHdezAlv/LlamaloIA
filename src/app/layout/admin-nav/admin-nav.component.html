<!-- Sidebar en escritorio -->
<div *ngIf="windowWidth >= 1280"
  [class]="'hidden xl:flex xl:flex-col xl:h-full xl:fixed xl:inset-y-0 bg-white border-r border-gray-200 dark:border-neutral-800 ' + (isCollapsed ? 'xl:w-24 sidebar-collapsed' : (windowWidth < 1440 ? 'xl:w-60' : 'xl:w-[21rem] xl:max-w-[88rem]'))">
  <div class="flex flex-col h-full w-full">
    <!-- Logo principal -->
    <div class="flex items-center justify-center h-16 px-6 mt-6 flex-shrink-0">
      <div class="flex items-center gap-2">
        <img src="../../../assets/logo.webp" alt="Llamalo Logo" [ngClass]="{
            'h-8': isCollapsed,
            'h-10 pr-2': !isCollapsed && windowWidth < 1440,
            'h-12 pr-4': !isCollapsed && windowWidth >= 1440
          }" class="transition-all duration-500 ease-in-out block dark:hidden" />
        <img src="../../../assets/logo_blanco.webp" alt="Llamalo Logo" [ngClass]="{
            'h-8': isCollapsed,
            'h-10 pr-2': !isCollapsed && windowWidth < 1440,
            'h-12 pr-4': !isCollapsed && windowWidth >= 1440
          }" class="transition-all duration-500 ease-in-out hidden dark:block" />
        <div *ngIf="!isCollapsed"
          [class]="'flex flex-col leading-tight transition-all duration-500 ease-in-out opacity-0 animate-fade-in ' + (windowWidth < 1440 ? 'gap-0.5' : '')">
          <span
            [class]="'brand-font mt-2 font-bold tracking-[-3px] sidebar-logo-text ' + (windowWidth < 1440 ? 'text-3xl' : 'text-5xl')">Admin</span>
          <span
            class="brand-font text-[10px] mr-0.5 text-end text-black font-bold -mt-1.5 block tracking-[-0.5px] dark:text-slate-300">Panel</span>
        </div>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
      <a routerLink="/admin/home" routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        [routerLinkActiveOptions]="{exact: true}"
        [class]="'flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium text-sm ' + (isCollapsed ? 'justify-center' : '') + ' text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'"
        [title]="isCollapsed ? 'Dashboard' : ''">
        <svg width="20" height="20" viewBox="0 0 20 17" fill="currentColor">
          <path
            d="M8.0001 16V11H12.0001V16C12.0001 16.55 12.4501 17 13.0001 17H16.0001C16.5501 17 17.0001 16.55 17.0001 16V8.99997H18.7001C19.1601 8.99997 19.3801 8.42997 19.0301 8.12997L10.6701 0.599971C10.2901 0.259971 9.7101 0.259971 9.3301 0.599971L0.970098 8.12997C0.630098 8.42997 0.840098 8.99997 1.3001 8.99997H3.0001V16C3.0001 16.55 3.4501 17 4.0001 17H7.0001C7.5501 17 8.0001 16.55 8.0001 16Z" />
        </svg>
        <span *ngIf="!isCollapsed" class="transition-opacity duration-300">Dashboard</span>
      </a>

      <a routerLink="/admin/tokens" routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        [class]="'flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium text-sm ' + (isCollapsed ? 'justify-center' : '') + ' text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'"
        [title]="isCollapsed ? 'Servicios Externos' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM12 7C13.4 7 14.8 7.6 15.7 8.7L14.2 10.2C13.6 9.5 12.8 9 12 9C10.3 9 9 10.3 9 12C9 13.7 10.3 15 12 15C12.8 15 13.6 14.5 14.2 13.8L15.7 15.3C14.8 16.4 13.4 17 12 17C9.2 17 7 14.8 7 12C7 9.2 9.2 7 12 7Z" />
        </svg>
        <span *ngIf="!isCollapsed" class="transition-opacity duration-300">Servicios Externos</span>
      </a>

      <a routerLink="/admin/redes-sociales"
        routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        [class]="'flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium text-sm ' + (isCollapsed ? 'justify-center' : '') + ' text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'"
        [title]="isCollapsed ? 'Redes Sociales' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z" />
        </svg>
        <span *ngIf="!isCollapsed" class="transition-opacity duration-300">Redes Sociales</span>
      </a>

      <a routerLink="/admin/agents/edit/1"
        routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        [class]="'flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 font-medium text-sm ' + (isCollapsed ? 'justify-center' : '') + ' text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800'"
        [title]="isCollapsed ? 'Editor Agente' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM11 11.41V7H13V11L16 13L15.3 14.2L11 11.41Z" />
        </svg>
        <span *ngIf="!isCollapsed" class="transition-opacity duration-300">Editor Agente</span>
      </a>
    </nav>

    <!-- Botón colapsar -->
    <div class="p-4 border-t border-gray-200 dark:border-neutral-800">
      <button (click)="toggleCollapse()"
        class="w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800 transition-colors">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <ng-container *ngIf="!isCollapsed">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 18L15 12L9 6" />
          </ng-container>
          <ng-container *ngIf="isCollapsed">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 18L9 12L15 6" />
          </ng-container>
        </svg>
        <span *ngIf="!isCollapsed" class="text-sm font-medium">Colapsar</span>
      </button>
    </div>
  </div>
</div>
