<!-- Sidebar en escritorio -->
<div *ngIf="windowWidth >= 1280"
  class="hidden xl:flex xl:flex-col xl:h-full xl:fixed xl:inset-y-0 xl:w-20 bg-white border-r border-gray-200 dark:border-neutral-800 sidebar-collapsed">
  <div class="flex flex-col h-full w-full">
    <!-- Logo principal -->
    <div class="flex items-center justify-center h-16 px-4 mt-6 flex-shrink-0">
      <img src="../../../assets/logo_azul.webp" alt="Llamalo Logo"
        class="h-8 transition-all duration-500 ease-in-out block dark:hidden" />
      <img src="../../../assets/logo_blanco.webp" alt="Llamalo Logo"
        class="h-8 transition-all duration-500 ease-in-out hidden dark:block" />
    </div>

    <!-- Navegación -->
    <nav class="flex-1 px-2 py-6 space-y-2 overflow-y-auto">
      <a routerLink="/admin/agents/edit/1"
        routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        class="flex items-center justify-center gap-3 px-3 py-3 rounded-lg transition-all duration-200 text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800"
        title="Editor Agente">
        <!-- Esfera asistente de voz (icono estático pequeño) -->
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <radialGradient id="aiSphereCenter" cx="50%" cy="30%" r="50%">
              <stop offset="0%" stop-color="#E0F2FE" />
              <stop offset="45%" stop-color="#38BDF8" />
              <stop offset="100%" stop-color="#1D4ED8" />
            </radialGradient>
          </defs>
          <!-- Esfera principal -->
          <circle cx="12" cy="12" r="9" fill="url(#aiSphereCenter)" />
          <!-- Reflejo superior -->
          <ellipse cx="10" cy="9" rx="3" ry="2"
            fill="white" fill-opacity="0.55" />
        </svg>
      </a>

      <a routerLink="/admin/news" routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        class="flex items-center justify-center gap-3 px-3 py-3 rounded-lg transition-all duration-200 text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800"
        title="Gestionar Noticias">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path
            d="M8.35179 20.2418C9.19288 21.311 10.5142 22 12 22C13.4858 22 14.8071 21.311 15.6482 20.2418C13.2264 20.57 10.7736 20.57 8.35179 20.2418Z"
            fill="currentColor" />
          <path
            d="M18.7491 9V9.7041C18.7491 10.5491 18.9903 11.3752 19.4422 12.0782L20.5496 13.8012C21.5612 15.3749 20.789 17.5139 19.0296 18.0116C14.4273 19.3134 9.57274 19.3134 4.97036 18.0116C3.21105 17.5139 2.43882 15.3749 3.45036 13.8012L4.5578 12.0782C5.00972 11.3752 5.25087 10.5491 5.25087 9.7041V9C5.25087 5.13401 8.27256 2 12 2C15.7274 2 18.7491 5.13401 18.7491 9Z"
            fill="currentColor" />
        </svg>
      </a>

      <!-- Nueva Pestaña de Documentación -->
      <a routerLink="/admin/docs" routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        class="flex items-center justify-center gap-3 px-3 py-3 rounded-lg transition-all duration-200 text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800"
        title="Documentación de la Aplicación">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path
            d="M20.5 16V18.5C20.5 20.43 18.93 22 17 22H7C5.07 22 3.5 20.43 3.5 18.5V17.85C3.5 16.28 4.78 15 6.35 15H19.5C20.05 15 20.5 15.45 20.5 16Z"
            fill="currentColor" />
          <path
            d="M15.5 2H8.5C4.5 2 3.5 3 3.5 7V14.58C4.26 13.91 5.26 13.5 6.35 13.5H19.5C20.05 13.5 20.5 13.05 20.5 12.5V7C20.5 3 19.5 2 15.5 2ZM13 10.75H8C7.59 10.75 7.25 10.41 7.25 10C7.25 9.59 7.59 9.25 8 9.25H13C13.41 9.25 13.75 9.59 13.75 10C13.75 10.41 13.41 10.75 13 10.75ZM16 7.25H8C7.59 7.25 7.25 6.91 7.25 6.5C7.25 6.09 7.59 5.75 8 5.75H16C16.41 5.75 16.75 6.09 16.75 6.5C16.75 6.91 16.41 7.25 16 7.25Z"
            fill="currentColor" />
        </svg>
      </a>

      <!-- Pestaña de System Logs -->
      <a routerLink="/admin/system-logs" routerLinkActive="bg-blue-50 text-blue-950 dark:bg-blue-900/20 dark:text-blue-300"
        class="flex items-center justify-center gap-3 px-3 py-3 rounded-lg transition-all duration-200 text-gray-700 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800"
        title="Logs del Sistema">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </a>
    </nav>
  </div>
</div>
