
<!-- Tarjeta de créditos PAYG -->
<ng-template #sidebarOnboardingCard>
  <div
    class="sidebar-onboarding-card mx-auto rounded-lg shadow-lg bg-white border border-gray-200 dark:bg-slate-900 dark:border-slate-700 flex flex-col gap-2 3xl:gap-3 px-2 3xl:px-3 py-2 3xl:py-3 w-[90%] sidebar-onboarding-card-delayed"
  >
    <!-- Header con PAYG badge y Credits -->
    <div class="flex items-start justify-between w-full">
      <!-- Badge PAYG -->
      <span class="px-1.5 3xl:px-2.5 py-0.5 3xl:py-1 bg-gray-200 dark:bg-slate-700 rounded text-[7px] 3xl:text-[10px] font-semibold text-slate-900 dark:text-white uppercase">
        Starter
      </span>
      <!-- Credits -->
      <div class="flex flex-col items-end leading-tight">
        <span class="text-[11px] 3xl:text-sm font-semibold text-slate-900 dark:text-white">10.00</span>
        <span class="text-[7px] 3xl:text-[8px] text-slate-500 dark:text-slate-400 leading-relaxed">Credits</span>
      </div>
    </div>

    <!-- Botón Buy Credits -->
    <button type="button" class="w-full bg-gray-200 dark:bg-slate-800 hover:bg-gray-300 dark:hover:bg-slate-700 rounded-lg px-2 3xl:px-3 py-1.5 3xl:py-2 flex items-center justify-center gap-1 3xl:gap-1.5 transition-colors">
      <svg class="w-3 h-3 3xl:w-4 3xl:h-4 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
      </svg>
      <span class="text-[8px] 3xl:text-[10px] font-medium text-slate-900 dark:text-white leading-relaxed">Buy Credits</span>
    </button>
  </div>
</ng-template>

<!-- Botón para abrir menú en móvil -->
<div *ngIf="windowWidth < 1280" class="fixed top-4 left-4 z-50 hidden">
  <button (click)="openMobileSidebar()" class="p-2 rounded bg-blue-700 text-white shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
    <span class="sr-only">Abrir menú</span>
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
</div>

<!-- Menú móvil (modal) - Estilo desktop -->
<div *ngIf="isOpen && windowWidth < 1280" [class]="'fixed inset-0 z-50 flex mobile-sidebar-container' + (isClosing ? ' leaving' : '')">
  <!-- Fondo oscuro -->
  <div [class]="'fixed inset-0 bg-black/50 mobile-overlay' + (isClosing ? ' leaving' : '')" (click)="closeMenu()"></div>

  <!-- Sidebar móvil con estilo de escritorio -->
  <div [class]="'relative w-72 bg-white shadow-xl flex flex-col h-full mobile-sidebar dark:bg-slate-900 dark:border-slate-800 border-r border-gray-200' + (isClosing ? ' leaving' : '')">
    <div class="flex flex-col h-full w-full">
    <!-- Logo principal -->
    <div class="flex items-center h-12 px-6 mt-4 flex-shrink-0 relative justify-between">
      <div class="flex items-center gap-0 relative justify-between w-full">
        <!-- Logo normal -->
        <div class="relative mt-1 ml-2">
          <img
            src="../../../assets/logo.png"
            alt="Llamalo Logo"
            class="h-7 block dark:hidden relative z-0"
            style="width: auto; object-fit: contain;"
          />
          <!-- Logo blanco en modo oscuro -->
          <img
            src="../../../assets/logo_blanco.png"
            alt="Llamalo Logo"
            class="h-7 hidden dark:block relative z-0"
            style="width: auto; object-fit: contain;"
          />
        </div>
        <!-- Texto Llamalo beta -->
        <div class="flex flex-row items-baseline gap-0.5 leading-tight ml-1.5">
          <span class="brand-font text-2xl mt-1 font-bold  sidebar-logo-text">Llamalo</span>
          <span class="brand-font text-[9px] text-black font-bold  dark:text-slate-300">beta</span>
        </div>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 px-4 py-28 space-y-2 font-semibold text-base overflow-y-auto">
      <a
        [routerLink]="['/dashboard/home']"
        (click)="closeMenu()"
        [class]="'nav-link flex items-center gap-2 px-3 py-2 rounded-lg transition ' + (isRouteActive('/dashboard/home') ? 'nav-link-active text-blue-900' : 'text-gray-400 hover:bg-gray-100 hover:text-blue-900')"
      >
        <span class="nav-icon-wrapper">
          <svg width="18" height="19" viewBox="0 0 20 17" fill="currentColor" xmlns="http://www.w3.org/2000/svg" class="nav-icon">
            <path d="M8.0001 16V11H12.0001V16C12.0001 16.55 12.4501 17 13.0001 17H16.0001C16.5501 17 17.0001 16.55 17.0001 16V8.99997H18.7001C19.1601 8.99997 19.3801 8.42997 19.0301 8.12997L10.6701 0.599971C10.2901 0.259971 9.7101 0.259971 9.3301 0.599971L0.970098 8.12997C0.630098 8.42997 0.840098 8.99997 1.3001 8.99997H3.0001V16C3.0001 16.55 3.4501 17 4.0001 17H7.0001C7.5501 17 8.0001 16.55 8.0001 16Z" />
          </svg>
        </span>
        <span class="nav-text mt-1 block">{{ t.home }}</span>
      </a>

          </svg>
        </span>
        <span class="nav-text">{{ t.agents }}</span>
      </a>

      <a
        [routerLink]="['/dashboard/numbers']"
        (click)="closeMenu()"
        [class]="'nav-link flex items-center gap-2 px-3 py-2 rounded-lg transition ' + (isRouteActive('/dashboard/numbers') ? 'nav-link-active text-blue-900' : 'text-gray-400 hover:bg-gray-100 hover:text-blue-900')"
      >
        <span class="nav-icon-wrapper">
          <svg width="18" height="19" viewBox="0 0 22 23" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" class="nav-icon">

        [routerLink]="['/dashboard/metrics']"
        (click)="closeMenu()"

      </a>
    </nav>

    <!-- Sección inferior -->
    <div class="pb-2 mb-2 w-full flex flex-col mt-auto px-6 gap-1">

      <!-- Tarjeta estilo onboarding -->
      <div class="pb-1">
        <ng-container *ngTemplateOutlet="sidebarOnboardingCard"></ng-container>
      </div>

      <!-- Perfil con dropdown -->
      <div class="relative pt-2 pb-2 w-full flex items-center gap-3">
        <!-- Avatar y texto -->
        <div
          class="flex items-center gap-2 transition-all duration-500 ease-out cursor-pointer flex-1"
          (click)="toggleDropdown()"
        >
          <img
            [src]="getUserProfileImage()"
            class="h-6 w-6 rounded-full border-2 border-blue-900 history-border sidebar-avatar flex-shrink-0"
            alt="Perfil"
          />
        </div>

        <!-- Icono regalo -->
        <div>
          <button (click)="goToGifts()" class="inline-flex items-center justify-center text-gray-400 hover:text-gray-700 focus:outline-none">            
            <svg [class]="'relative top-[4px] ' + (isCollapsed ? 'h-4 w-4' : 'h-5 w-5')" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">

        <div>
          <button (click)="logout()" class="inline-flex items-center justify-center text-gray-400 hover:text-gray-700 focus:outline-none" aria-label="Cerrar sesión">
            <svg [class]="'relative top-[4px] ' + (isCollapsed ? 'h-4 w-4' : 'h-5 w-5')" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">

            </svg>
          </button>
        </div>

        <!-- Dropdown Menu -->
        <div
          *ngIf="showDropdown"
          class="absolute top-full left-0 ml-0 mt-2 w-44 bg-white rounded-lg shadow-xl z-[9999] border border-gray-200 transition-all duration-500 ease-in-out opacity-100 dark:bg-slate-900 dark:border-slate-700"
        >
          <!-- {{ t.settings }} -->
          <button
            (click)="navigateTo('/dashboard/account'); closeMenu()"
            class="w-full flex items-center gap-2 px-2 py-1.5 text-gray-700 hover:bg-gray-100 transition-colors rounded-t-lg dark:text-white dark:hover:bg-slate-800"
          >
            <svg
              class="w-4 h-4 text-gray-700 dark:text-white flex-shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"

<!-- Sidebar en escritorio -->
<div
  *ngIf="windowWidth >= 1280"
  [class]="'hidden xl:flex xl:flex-col xl:h-full xl:fixed xl:inset-y-0 bg-white border-r border-gray-200 dark:border-neutral-800 transition-all duration-500 ease-in-out group ' + (isCollapsed ? 'xl:w-12 3xl:w-16' : 'xl:w-[12rem] 2xl:w-[12rem] 3xl:w-[14rem]')"
>
  <div class="flex flex-col h-full w-full">
    <!-- Logo principal -->
    <div class="flex items-center flex-shrink-0 relative pt-4 h-12 3xl:h-14">
      <!-- Logo normal - posición absoluta fija para evitar movimiento durante transición -->
      <!-- 24px desde izquierda (centro del sidebar cerrado de 48px) con logo centrado -->
      <div class="absolute left-6 3xl:left-8 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center flex-shrink-0">
        <img
          [ngClass]="{
            'h-5 w-5 3xl:h-6 3xl:w-6': true,
            'opacity-100 group-hover:opacity-0': isCollapsed
          }"
          src="../../../assets/logo.png"
          alt="Llamalo Logo"
          class="block dark:hidden relative z-0 transition-opacity duration-300 ease-in-out object-contain"
        />
        <!-- Logo blanco en modo oscuro -->
        <img
          [ngClass]="{
            'h-5 w-5 3xl:h-6 3xl:w-6': true,
            'opacity-100 group-hover:opacity-0': isCollapsed
          }"
          src="../../../assets/logo_blanco.png"
          alt="Llamalo Logo"
          class="hidden dark:block relative z-0 transition-opacity duration-300 ease-in-out object-contain"
        />
      </div>
      <!-- Texto "Llamalo beta" - independiente del logo para no afectar la animación -->
      <div *ngIf="!isCollapsed" class="absolute left-11 3xl:left-14 top-1/2 -translate-y-1/2 flex items-baseline gap-0.5 flex-shrink-0">
        <span class="brand-font text-xl 3xl:text-2xl font-bold  transition-all duration-500 ease-in-out opacity-0 animate-fade-in text-black dark:text-white">Llamalo</span>
        <span class="brand-font text-[9px] 3xl:text-[10px] font-bold  transition-all duration-500 ease-in-out opacity-0 animate-fade-in text-black dark:text-slate-300">beta</span>
      </div>
      <!-- Icono para abrir sidebar (solo cuando está cerrado, aparece en hover) -->
      <button
        *ngIf="isCollapsed"
        (click)="toggleCollapse()"
        class="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 cursor-pointer text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 flex items-center justify-center z-20 transition-opacity duration-300"
        title="Abrir sidebar"
      >
        <svg width="77" height="68" viewBox="0 0 77 68" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 3xl:w-5 3xl:h-5">
          <rect x="3.5" y="3.5" width="70" height="61" rx="14.5" stroke="currentColor" stroke-width="7"/>
          <rect x="16" y="15" width="25" height="38" rx="4" fill="currentColor"/>
        </svg>
      </button>
      <!-- Icono para cerrar sidebar (a la derecha, solo cuando está abierto, siempre visible) -->
      <button
        *ngIf="!isCollapsed"
        (click)="toggleCollapse()"
        class="absolute right-2 3xl:right-3 top-4 3xl:top-5 opacity-100 transition-all duration-500 ease-in-out cursor-pointer text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300"
        title="Cerrar sidebar"
      >
        <svg width="77" height="68" viewBox="0 0 77 68" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 3xl:w-5 3xl:h-5">
          <rect x="3.5" y="3.5" width="70" height="61" rx="14.5" stroke="currentColor" stroke-width="7"/>
          <rect x="16" y="15" width="7" height="38" rx="3.5" fill="currentColor"/>
        </svg>
      </button>
    </div>


    <!-- Navegación -->

    <!-- Sección inferior -->

      <!-- Tarjeta estilo onboarding (solo cuando está expandido) -->
      <div *ngIf="!isCollapsed" class="transition-all duration-500 ease-in-out opacity-0 animate-slide-in-left pb-1" style="animation-delay: 0.3s;">
        <ng-container *ngTemplateOutlet="sidebarOnboardingCard"></ng-container>
      </div>


      <!-- Perfil con dropdown -->
      <div [class]="'relative pt-1 pb-1 w-[90%] mx-auto ' + (isCollapsed ? 'flex flex-col items-center' : 'flex items-center gap-2')">
        <!-- Botón de modo oscuro/claro cuando el sidebar está cerrado -->
        <button
          *ngIf="isCollapsed"
          type="button"

          [attr.aria-checked]="isDarkMode"
          [attr.aria-label]="isDarkMode ? 'Activar modo claro' : 'Activar modo oscuro'"
        >
          <svg
            class="theme-icon w-[14px] h-[14px] 3xl:w-[16px] 3xl:h-[16px]"
            [class.dark]="isDarkMode"
            [class.light]="!isDarkMode"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!-- Luna (creciente) -->
            <path
              class="moon-path"
              d="M21 12.79C20.7559 14.2353 20.075 15.5754 19.0515 16.6448C18.028 17.7142 16.7131 18.4638 15.2828 18.7998C13.8524 19.1357 12.3663 19.0444 10.9866 18.5369C9.60693 18.0294 8.38975 17.1253 7.48894 15.9377C6.58813 14.75 6.04214 13.3252 5.9144 11.8387C5.78666 10.3522 6.0824 8.86118 6.76635 7.54289C7.45029 6.22459 8.49456 5.13592 9.77752 4.40701C11.0605 3.6781 12.5246 3.33847 13.9866 3.4249C13.2244 4.34748 12.8127 5.53271 12.8403 6.74897C12.8678 7.96524 13.333 9.12967 14.1537 10.0267C14.9744 10.9237 16.0983 11.4925 17.3127 11.6343C18.5271 11.7761 19.7559 11.4826 20.79 10.81C20.9519 11.4724 21.0323 12.1537 21.03 12.837"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
            
            <!-- Círculo base (inicialmente invisible, se hace visible cuando la luna se transforma) -->
            <circle
              class="sun-circle"
              cx="12"
              cy="12"
              r="4.5"
              stroke="currentColor"
              stroke-width="1.7"
              fill="none"
              opacity="0"
            />
            
            <!-- Rayos del sol -->
            <g class="sun-rays" opacity="0">
              <!-- Rayos horizontales y verticales -->
              <path
                d="M12 4V2M12 22V20M4 12H2M22 12H20"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />

                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </g>
          </svg>
        </button>

          <div class="h-px bg-gray-200 my-1 dark:bg-slate-700"></div>
          
         <!-- Idiomas -->
         <div class="flex gap-1 px-2 py-1">
           <button
             (click)="selectLanguage(languages[0])"
             [class]="
               selectedLanguage.code === 'es'
                 ? 'bg-blue-900 text-white font-semibold w-1/2'
                 : 'bg-transparent text-gray-500 hover:text-gray-800 w-1/2'
             "
             class="px-2 3xl:px-2.5 py-1 3xl:py-1.5 rounded text-xs 3xl:text-sm transition-colors"
           >
             ES
           </button>
           <button
             (click)="selectLanguage(languages[1])"
             [class]="
               selectedLanguage.code === 'en'
                 ? 'bg-blue-900 text-white font-semibold w-1/2'
                 : 'bg-transparent text-gray-500 hover:text-gray-800 w-1/2'
             "
             class="px-2 3xl:px-2.5 py-1 3xl:py-1.5 rounded text-xs 3xl:text-sm transition-colors"
           >
             ENG
           </button>
         </div>
          
          <!-- {{ t.helpCenter }} -->
          <button
            (click)="navigateTo('/dashboard/help')"
            class="w-full flex items-center gap-2 px-2 3xl:px-2.5 py-1.5 3xl:py-2 text-gray-700 hover:bg-gray-100 transition-colors dark:text-white dark:hover:bg-slate-800"
