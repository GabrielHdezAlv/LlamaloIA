<!-- Tarjeta de créditos PAYG -->
<ng-template #sidebarOnboardingCard>
  <div
    class="sidebar-onboarding-card mx-auto rounded-lg shadow-lg bg-white border border-gray-200 dark:bg-slate-900 dark:border-slate-700 flex flex-col gap-2 3xl:gap-3 px-2 3xl:px-3 py-2 3xl:py-3 w-[90%] sidebar-onboarding-card-delayed">
    <!-- Header con PAYG badge y Credits -->
    <div class="flex items-start justify-between w-full">
      <!-- Badge PAYG -->
      <span
        class="px-1.5 3xl:px-2.5 py-0.5 3xl:py-1 bg-gray-200 dark:bg-slate-700 rounded text-[7px] 3xl:text-[10px] font-semibold text-slate-900 dark:text-white uppercase">
        Starter
      </span>
      <!-- Credits -->
      <div class="flex flex-col items-end leading-tight">
        <span class="text-[11px] 3xl:text-sm font-semibold text-slate-900 dark:text-white">10.00</span>
        <span class="text-[7px] 3xl:text-[8px] text-slate-500 dark:text-slate-400 leading-relaxed">Credits</span>
      </div>
    </div>

    <!-- Botón Buy Credits -->
    <button type="button" (click)="collapseOnNavigate()"
      class="w-full bg-gray-200 dark:bg-slate-800 hover:bg-gray-300 dark:hover:bg-slate-700 rounded-lg px-2 3xl:px-3 py-1.5 3xl:py-2 flex items-center justify-center gap-1 3xl:gap-1.5 transition-colors">
      <svg class="w-3 h-3 3xl:w-4 3xl:h-4 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
      </svg>
      <span class="text-[8px] 3xl:text-[10px] font-medium text-slate-900 dark:text-white leading-relaxed">Buy
        Credits</span>
    </button>
  </div>
</ng-template>

<!-- Botón para abrir menú en móvil -->
<div *ngIf="windowWidth < 1280" class="fixed top-4 left-4 z-50 hidden">
  <button (click)="openMobileSidebar()"
    class="p-2 rounded bg-blue-700 text-white shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
    <span class="sr-only">Abrir menú</span>
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
</div>

<!-- Menú móvil (modal) - Estilo desktop -->
<div *ngIf="isOpen && windowWidth < 1280"
  [class]="'fixed inset-0 z-50 flex mobile-sidebar-container' + (isClosing ? ' leaving' : '')">
  <!-- Fondo oscuro -->
  <div [class]="'fixed inset-0 bg-black/50 mobile-overlay' + (isClosing ? ' leaving' : '')" (click)="closeMenu()"></div>

  <!-- Sidebar móvil con estilo de escritorio -->
  <div
    [class]="'relative w-72 bg-white shadow-xl flex flex-col h-full mobile-sidebar dark:bg-slate-900 dark:border-slate-800 border-r border-gray-200' + (isClosing ? ' leaving' : '')">
    <div class="flex flex-col h-full w-full">
      <!-- Logo principal -->
      <div class="flex items-center h-12 px-6 mt-4 flex-shrink-0 relative justify-between">
        <div class="flex items-center gap-0 relative justify-between w-full">
          <!-- Logo normal -->
          <div class="relative mt-1 ml-2">
            <img src="../../../assets/logo_azul.webp" alt="Llamalo Logo" class="h-7 block dark:hidden relative z-0"
              style="width: auto; object-fit: contain;" />
            <!-- Logo blanco en modo oscuro -->
            <img src="../../../assets/logo_blanco.webp" alt="Llamalo Logo" class="h-7 hidden dark:block relative z-0"
              style="width: auto; object-fit: contain;" />
          </div>
          <!-- Texto Llamalo beta -->
          <div class="flex flex-row items-baseline gap-0.5 leading-tight ml-1.5">
            <span class="text-2xl mt-1 font-bold sidebar-logo-text"
              style="font-family: 'Poppins', sans-serif;">Llamalo</span>
            <span class="text-[9px] text-black font-bold dark:text-slate-300"
              style="font-family: 'Poppins', sans-serif;">beta</span>
          </div>
        </div>
      </div>

              <span class="font-medium text-xs">{{ t.settings }}</span>

            <!-- {{ t.privateCommunity }} -->
            <button (click)="navigateTo('/dashboard/community'); closeMenu()"

            <!-- Separador -->
            <div class="h-px bg-gray-200 my-1 dark:bg-slate-700"></div>

            <!-- Idiomas -->
            <div class="flex gap-1 px-2 py-1">
              <button (click)="selectLanguage(languages[0])" [class]="

              </button>

               selectedLanguage.code === 'en'
                 ? 'bg-blue-900 text-white font-semibold w-1/2'
                 : 'bg-transparent text-gray-500 hover:text-gray-800 w-1/2'
             " class="px-2 3xl:px-2.5 py-1 3xl:py-1.5 rounded-lg text-xs 3xl:text-sm transition-colors">
                ENG
              </button>
            </div>

            <!-- {{ t.helpCenter }} -->
            <button (click)="navigateTo('/dashboard/help'); closeMenu()"

              <span class="ml-2 font-medium text-xs">{{ t.helpCenter }}</span>

            <!-- Cerrar sesión -->
            <button (click)="logout(); closeMenu()"
              class="w-full flex items-center px-2 py-1.5 text-gray-700 hover:bg-red-50 transition-colors rounded-b-lg dark:text-white dark:hover:bg-red-900/30">
              <svg class="w-4 h-4 text-gray-700 dark:text-white" viewBox="0 0 24 24" fill="currentColor"
                xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd"
                  d="M9.70725 2.4087C9 3.03569 9 4.18259 9 6.4764V17.5236C9 19.8174 9 20.9643 9.70725 21.5913C10.4145 22.2183 11.4955 22.0297 13.6576 21.6526L15.9864 21.2465C18.3809 20.8288 19.5781 20.62 20.2891 19.7417C21 18.8635 21 17.5933 21 15.0529V8.94711C21 6.40671 21 5.13652 20.2891 4.25826C19.5781 3.37999 18.3809 3.17118 15.9864 2.75354L13.6576 2.34736C11.4955 1.97026 10.4145 1.78171 9.70725 2.4087ZM12 10.1686C12.4142 10.1686 12.75 10.52 12.75 10.9535V13.0465C12.75 13.48 12.4142 13.8314 12 13.8314C11.5858 13.8314 11.25 13.48 11.25 13.0465V10.9535C11.25 10.52 11.5858 10.1686 12 10.1686Z">

                </path>

      </div>

      <!-- Botón cerrar -->
      <button (click)="closeMenu()"
        class="absolute top-4 right-4 p-2 text-gray-700 hover:text-gray-600 dark:text-gray-400 dark:hover:text-gray-300">

</div>

<!-- Sidebar en escritorio -->
<div *ngIf="windowWidth >= 1280"
  [class]="'hidden xl:flex xl:flex-col xl:h-full xl:fixed xl:inset-y-0 bg-white border-r border-gray-200 dark:border-neutral-800 transition-all duration-500 ease-in-out group ' + (isCollapsed ? 'xl:w-12 3xl:w-16' : 'xl:w-[12rem] 2xl:w-[12rem] 3xl:w-[14rem]')">
  <div class="flex flex-col h-full w-full">
    <!-- Logo principal -->
    <div class="flex items-center flex-shrink-0 relative pt-4 h-12 3xl:h-14">
      <!-- Logo normal - posición absoluta fija para evitar movimiento durante transición -->
      <!-- 24px desde izquierda (centro del sidebar cerrado de 48px) con logo centrado -->
      <div
        class="absolute left-6 3xl:left-8 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center flex-shrink-0">
        <img [ngClass]="{
            'h-[1.4rem] w-[1.4rem] 3xl:h-7 3xl:w-7': true, 
            'opacity-100 group-hover:opacity-0': isCollapsed
          }" src="../../../assets/logo_azul.webp" alt="Llamalo Logo"
          class="block dark:hidden relative z-0 transition-opacity duration-300 ease-in-out object-contain" />
        <!-- Logo blanco en modo oscuro -->
        <img [ngClass]="{
            'h-[1.4rem] w-[1.4rem] 3xl:h-7 3xl:w-7': true,
            'opacity-100 group-hover:opacity-0': isCollapsed
          }" src="../../../assets/logo_blanco.webp" alt="Llamalo Logo"
          class="hidden dark:block relative z-0 transition-opacity duration-300 ease-in-out object-contain" />
      </div>
      <!-- Texto "Llamalo beta" - independiente del logo para no afectar la animación -->
      <div *ngIf="!isCollapsed"
        class="absolute left-11 3xl:left-14 top-1/2 -translate-y-1/2 flex items-baseline gap-0.5 flex-shrink-0">
        <span
          class="text-xl 3xl:text-2xl font-bold transition-all duration-500 ease-in-out opacity-0 animate-fade-in text-black dark:text-white"
          style="font-family: 'Poppins', sans-serif;">Llamalo</span>
        <span
          class="text-[9px] 3xl:text-[10px] font-bold transition-all duration-500 ease-in-out opacity-0 animate-fade-in text-black dark:text-slate-300"
          style="font-family: 'Poppins', sans-serif;">beta</span>
      </div>
      <!-- Icono para abrir sidebar (solo cuando está cerrado, aparece en hover) -->
      <button *ngIf="isCollapsed" (click)="toggleCollapse(); $event.stopPropagation()"
        class="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 cursor-pointer text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 flex items-center justify-center z-20 transition-opacity duration-300"
        title="Abrir sidebar">
        <svg width="77" height="68" viewBox="0 0 77 68" fill="none" xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4 3xl:w-5 3xl:h-5">
          <rect x="3.5" y="3.5" width="70" height="61" rx="14.5" stroke="currentColor" stroke-width="7" />
          <rect x="16" y="15" width="25" height="38" rx="4" fill="currentColor" />
        </svg>
      </button>
      <!-- Icono para cerrar sidebar (a la derecha, solo cuando está abierto, siempre visible) -->
      <button *ngIf="!isCollapsed" (click)="toggleCollapse()"
        class="absolute right-4 3xl:right-5 top-4 3xl:top-5 opacity-100 transition-all duration-500 ease-in-out cursor-pointer text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300"
        title="Cerrar sidebar">
        <svg width="77" height="68" viewBox="0 0 77 68" fill="none" xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4 3xl:w-5 3xl:h-5">
          <rect x="3.5" y="3.5" width="70" height="61" rx="14.5" stroke="currentColor" stroke-width="7" />
          <rect x="16" y="15" width="7" height="38" rx="3.5" fill="currentColor" />
        </svg>
      </button>
    </div>


    <!-- Navegación -->
    <nav
      class="flex-1 font-semibold text-sm overflow-y-auto flex flex-col pt-5 3xl:pt-6 pb-2 3xl:pb-3 space-y-3 3xl:space-y-4 pl-3 3xl:pl-[1.1rem]">
      <a [routerLink]="['/dashboard/home']" (click)="collapseOnNavigate()"
        [class]="'relative flex items-center gap-2 3xl:gap-2.5 rounded-lg transition my-0 w-full py-1 ' + (isRouteActive('/dashboard/home') && !isCollapsed ? 'text-white' : isRouteActive('/dashboard/home') && isCollapsed ? 'text-white' : 'text-gray-400 hover:text-blue-900')">
        <span *ngIf="isRouteActive('/dashboard/home')"
          class="absolute left-0 top-1/2 -translate-y-1/2 rounded-md h-6 3xl:h-7 nav-link-active-bg bg-blue-950 dark:bg-[#1E3A8A]"
          [style.width]="isCollapsed ? '1.5rem' : 'calc(100% - 1rem)'" [style.opacity]="isCollapsed ? '1' : '1'"
          [style.transition]="'width 0.5s ease-in-out, opacity 0.3s ease-in-out'"></span>
        <span
          [class]="'relative z-10 inline-flex items-center justify-center rounded-md flex-shrink-0 ' + (isRouteActive('/dashboard/home') && isCollapsed ? 'p-1 w-6 h-6 3xl:w-7 3xl:h-7 bg-blue-950 dark:bg-[#1E3A8A]' : isRouteActive('/dashboard/home') ? 'p-1 w-6 h-6 3xl:w-7 3xl:h-7' : 'w-6 h-6 3xl:w-7 3xl:h-7 transition-all duration-300 hover:bg-gray-100 dark:hover:bg-slate-800 nav-link-inactive')">
          <svg [class]="'transition-all w-[16px] h-[16px] 3xl:w-[18px] 3xl:h-[18px]'" viewBox="0 0 24 24" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M11.5 11.5L12.5 12H15M3 14.5999V12.1301C3 10.9814 3 10.407 3.14805 9.87807C3.2792 9.40953 3.49473 8.96886 3.78405 8.57768C4.11067 8.13608 4.56404 7.78346 5.47078 7.07822L8.07078 5.056C9.47608 3.96298 10.1787 3.41648 10.9546 3.2064C11.6392 3.02104 12.3608 3.02104 13.0454 3.2064C13.8213 3.41648 14.5239 3.96299 15.9292 5.056L18.5292 7.07822C19.436 7.78346 19.8893 8.13608 20.2159 8.57768C20.5053 8.96886 20.7208 9.40953 20.8519 9.87807C21 10.407 21 10.9814 21 12.1301V14.5999C21 16.8401 21 17.9603 20.564 18.8159C20.1805 19.5685 19.5686 20.1805 18.816 20.564C17.9603 20.9999 16.8402 20.9999 14.6 20.9999H9.4C7.15979 20.9999 6.03969 20.9999 5.18404 20.564C4.43139 20.1805 3.81947 19.5685 3.43597 18.8159C3 17.9603 3 16.8401 3 14.5999Z"
              [attr.stroke]="isRouteActive('/dashboard/home') ? 'white' : 'currentColor'" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round" />
            <ellipse cx="12" cy="9.5" rx="7" ry="5.5"
              [attr.fill]="isRouteActive('/dashboard/home') ? 'white' : 'currentColor'" />
            <path
              d="M15 15.5C15.8284 15.5 16.5 16.1716 16.5 17C16.5 17.8284 15.8284 18.5 15 18.5H9C8.17157 18.5 7.5 17.8284 7.5 17C7.5 16.1716 8.17157 15.5 9 15.5H15Z"
              [attr.stroke]="isRouteActive('/dashboard/home') ? 'white' : 'currentColor'" />
            <path d="M16 9H21V20H16V9Z" [attr.fill]="isRouteActive('/dashboard/home') ? 'white' : 'currentColor'" />
            <path d="M3 9H8L7.5 14.5L8 20H3V9Z"
              [attr.fill]="isRouteActive('/dashboard/home') ? 'white' : 'currentColor'" />
            <rect x="4" y="12" width="17" height="4"
              [attr.fill]="isRouteActive('/dashboard/home') ? 'white' : 'currentColor'" />
            <rect x="6" y="18" width="13" height="3"
              [attr.fill]="isRouteActive('/dashboard/home') ? 'white' : 'currentColor'" />
          </svg>
        </span>
        <span *ngIf="!isCollapsed"
          class="relative z-10 nav-text text-xs 3xl:text-sm transition-all duration-500 ease-in-out opacity-0 animate-fade-in whitespace-nowrap flex-shrink-0">{{
          t.home }}</span>
      </a>

      <a [routerLink]="['/dashboard/agents']" (click)="collapseOnNavigate()"
        [class]="'relative flex items-center gap-2 3xl:gap-2.5 rounded-lg transition my-0 w-full py-1 ' + (isRouteActive('/dashboard/agents') && !isCollapsed ? 'text-white' : isRouteActive('/dashboard/agents') && isCollapsed ? 'text-white' : 'text-gray-400 hover:text-blue-900')">
        <span *ngIf="isRouteActive('/dashboard/agents')"
          class="absolute left-0 top-1/2 -translate-y-1/2 rounded-md h-6 3xl:h-7 nav-link-active-bg bg-blue-950 dark:bg-[#1E3A8A]"
          [style.width]="isCollapsed ? '1.5rem' : 'calc(100% - 1rem)'" [style.opacity]="isCollapsed ? '1' : '1'"
          [style.transition]="'width 0.5s ease-in-out, opacity 0.3s ease-in-out'"></span>
        <span
          [class]="'relative z-10 inline-flex items-center justify-center rounded-md flex-shrink-0 ' + (isRouteActive('/dashboard/agents') && isCollapsed ? 'p-1 w-6 h-6 3xl:w-7 3xl:h-7 bg-blue-950 dark:bg-[#1E3A8A]' : isRouteActive('/dashboard/agents') ? 'p-1 w-6 h-6 3xl:w-7 3xl:h-7' : 'w-6 h-6 3xl:w-7 3xl:h-7 transition-all duration-300 hover:bg-gray-100 dark:hover:bg-slate-800 nav-link-inactive')">
          <svg
            [class]="'transition-all w-[16px] h-[16px] 3xl:w-[18px] 3xl:h-[18px] ' + (isRouteActive('/dashboard/agents') ? '' : '')"
            [style.color]="isRouteActive('/dashboard/agents') ? '#FFFFFF' : ''" viewBox="0 0 24 24" fill="currentColor"
