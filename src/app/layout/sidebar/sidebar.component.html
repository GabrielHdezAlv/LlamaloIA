@if (!isOpen) {
<div class="responsive-nav">
  <!-- Logo -->
  <a href="https://flowbite.com/" class="logo-mobile flex items-center gap-1">
    <img src="../../../assets/logo.png" class="h-10 mr-1" alt="Flowbite Logo" />
    <div class="flex flex-col leading-tight">
      <span class="llamalo-text">Llamalo</span>
      <span class="beta text-blue-950 text-right font-bold -mt-1">BETA</span>
    </div>
  </a>

  <!-- Acciones del menú de navegación-->
  <div class="mobile-actions">
    <!-- Selector de idioma -->
    <div class="relative flex items-center">
      <button
        type="button"
        (click)="toggleLanguageMenu()"
        class="flex items-center justify-center w-14 h-10 rounded-full border border-gray-300 shadow-sm bg-white mr-2"
      >
        <svg
          class="w-3 h-3 mr-1 text-gray-700"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path d="M19 9l-7 7-7-7" />
        </svg>
        <img
          [src]="selectedLanguage.flag"
          alt="{{ selectedLanguage.name }}"
          class="w-6 h-6 rounded-full"
        />
      </button>

      <!-- Menú desplegable -->
      <div
        *ngIf="showLanguageMenu"
        class="absolute right-0 mt-40 w-36 bg-white border border-gray-200 rounded shadow-lg z-50"
      >
        <div
          *ngFor="let lang of languages"
          (click)="selectLanguage(lang)"
          class="flex items-center gap-2 p-2 cursor-pointer"
        >
          <img
            [src]="lang.flag"
            alt="{{ lang.name }}"
            class="w-5 h-5 rounded-full"
          />
          <span class="text-sm">{{ lang.name }}</span>
        </div>
      </div>
    </div>

    <!-- Icono de usuario -->
    <div class="relative flex items-center">
      <button
        type="button"
        class="flex items-center justify-center w-10 h-10 rounded-full border border-gray-300 shadow-sm bg-white hover:bg-gray-100"
      >
        <img
          src="assets/profile_img.jpg"
          class="h-6 rounded-full"
          alt="Flowbite Logo"
        />
      </button>
    </div>

    <!-- Botón menú hamburguesa -->
    <button
      (click)="toggleSidebar()"
      type="button"
      class="inline-flex items-center p-2 ms-3 text-sm text-gray-500 rounded-lg sm:hidden"
    >
      <svg
        class="w-6 h-6"
        aria-hidden="true"
        fill="currentColor"
        viewBox="0 0 20 20"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          clip-rule="evenodd"
          fill-rule="evenodd"
          d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"
        ></path>
      </svg>
    </button>
  </div>
</div>
}

<!-- Fondo oscuro cuando el sidebar está abierto -->
<div *ngIf="isOpen" class="overlay"></div>

            <svg

              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6.429 9.75 2.25 12l4.179 2.25m0-4.5 5.571 3 5.571-3m-11.142 0L2.25 7.5 12 2.25l9.75 5.25-4.179 2.25m0 0L21.75 12l-4.179 2.25m0 0 4.179 2.25L12 21.75 2.25 16.5l4.179-2.25m11.142 0-5.571 3-5.571-3"
              />
            </svg>

            <span>Mis Agentes</span>
          </a>
        </li> -->
        <li>
          <a [routerLink]="['agents']" class="text-gray-500 group">
            <svg

              viewBox="0 0 24 24"

              stroke="currentColor"
            >
              <path

                stroke-linejoin="round"

      </ul>
    </div>

    <div class="more-info" (click)="navigateToProfile()">
      <div
        id="dropdown-cta"
        class="feedback-container bg-gradient-to-b from-blue-900 to-blue-950"
        role="alert"
      >
        <div>
          <span>Feedback</span>
        </div>
        <p>

            />

  </div>
</aside>
