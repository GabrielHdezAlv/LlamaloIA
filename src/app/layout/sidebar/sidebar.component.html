<button (click)="toggleSidebar()" type="button"
    class="inline-flex items-center p-2 mt-2 ms-3 text-sm text-gray-500 rounded-lg sm:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600">
    <span class="sr-only">Open sidebar</span>
    <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <path clip-rule="evenodd" fill-rule="evenodd"
            d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z">
        </path>
    </svg>
</button>

<!-- Fondo oscuro cuando el sidebar está abierto -->
<div *ngIf="isOpen" class="overlay"></div>

<aside id="cta-button-sidebar" [class.-translate-x-full]="!isOpen" [class.translate-x-0]="isOpen"
    class="fixed top-0 left-0 z-40 w-72 h-screen transition-transform -translate-x-full sm:translate-x-0"
    aria-label="Sidebar">
    <div class="h-full flex flex-col justify-between py-4 overflow-y-auto bg-gray-50 dark:bg-white">
        <div>
            <a href="https://flowbite.com/" class="flex items-center ps-2.5 mb-5 border-b-2 h-28 sm:h-28">
                <img src="../../../assets/logo.png" class="h-20 sm:h-28" alt="Flowbite Logo" />
                <span
                    class="self-center text-4xl font-bold whitespace-nowrap text-blue-950 absolute right-16">Llamalo</span>
                <div
                    class="rounded-xl bg-blue-900 text-white text-2xs font-medium p-0.5 pl-2 pr-2 absolute right-10 top-20">
                    BETA
                </div>
            </a>
            <ul class="space-y-2 px-6 font-medium">
                <li>
                    <a [routerLink]="['home']"
                        class="cursor-pointer group flex items-center p-2 text-blue-900 rounded-lg hover:bg-blue-900 hover:text-white">
                        <svg class="shrink-0 w-5 h-5 text-blue-900 transition duration-75 group-hover:text-white"
                            aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                            viewBox="0 0 22 21">
                            <path
                                d="M16.975 11H10V4.025a1 1 0 0 0-1.066-.998 8.5 8.5 0 1 0 9.039 9.039.999.999 0 0 0-1-1.066h.002Z" />
                            <path
                                d="M12.5 0c-.157 0-.311.01-.565.027A1 1 0 0 0 11 1.02V10h8.975a1 1 0 0 0 1-.935c.013-.188.028-.374.028-.565A8.51 8.51 0 0 0 12.5 0Z" />
                        </svg>
                        <span class="ms-3">Inicio</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/dashboard/myAgents"
                        class="flex items-center p-2 text-gray-500 rounded-lg hover:bg-blue-900 hover:text-white group">
                        <svg class="no-selected shrink-0 w-5 h-5 transition duration-75 group-hover:text-white"
                            aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                            viewBox="0 0 18 18">
                            <path
                                d="M6.143 0H1.857A1.857 1.857 0 0 0 0 1.857v4.286C0 7.169.831 8 1.857 8h4.286A1.857 1.857 0 0 0 8 6.143V1.857A1.857 1.857 0 0 0 6.143 0Zm10 0h-4.286A1.857 1.857 0 0 0 10 1.857v4.286C10 7.169 10.831 8 11.857 8h4.286A1.857 1.857 0 0 0 18 6.143V1.857A1.857 1.857 0 0 0 16.143 0Zm-10 10H1.857A1.857 1.857 0 0 0 0 11.857v4.286C0 17.169.831 18 1.857 18h4.286A1.857 1.857 0 0 0 8 16.143v-4.286A1.857 1.857 0 0 0 6.143 10Zm10 0h-4.286A1.857 1.857 0 0 0 10 11.857v4.286c0 1.026.831 1.857 1.857 1.857h4.286A1.857 1.857 0 0 0 18 16.143v-4.286A1.857 1.857 0 0 0 16.143 10Z" />
                        </svg>
                        <span class="flex-1 ms-3 whitespace-nowrap">Mis Agentes</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/dashboard/agents"
                        class="flex items-center p-2 text-gray-500 rounded-lg hover:bg-blue-900 hover:text-white group">
                        <svg class="no-selected shrink-0 w-5 h-5 text-gray-500 transition duration-75 group-hover:text-white"
                            aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                            viewBox="0 0 20 18">
                            <path
                                d="M14 2a3.963 3.963 0 0 0-1.4.267 6.439 6.439 0 0 1-1.331 6.638A4 4 0 1 0 14 2Zm1 9h-1.264A6.957 6.957 0 0 1 15 15v2a2.97 2.97 0 0 1-.184 1H19a1 1 0 0 0 1-1v-1a5.006 5.006 0 0 0-5-5ZM6.5 9a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9ZM8 10H5a5.006 5.006 0 0 0-5 5v2a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-2a5.006 5.006 0 0 0-5-5Z" />
                        </svg>
                        <span class="flex-1 ms-3 whitespace-nowrap">Agentes</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="flex flex-col cursor-pointer" (click)="navigateToProfile()">
            <div id="dropdown-cta"
                class="flex flex-col justify-between h-72 p-6 ml-6 mr-6 rounded-lg bg-gradient-to-b from-blue-900 to-blue-950"
                role="alert">
                <div class="flex items-center justify-center mt-5">
                    <span
                        class="text-white text-xl text-center font-normal me-2 px-2.5 py-0.5 rounded-sm">Feedback</span>
                </div>
                <p class="mb-3 text-sm text-center leading-6 text-white">
                    Tu feedback nos ayuda a evolucionar y ofrecer una mejor experiencia. ¡Gracias por colaborar con
                    nosotros!
                </p>
                <button
                    class="rounded-xl hover:bg-gray-400 hover:bg-opacity-40 bg-gray-300 bg-opacity-40 text-md text-white pt-1.5 pb-1.5 w-full mb-3">Pulse
                    aquí</button>
            </div>

            <div id="dropdown-cta"
                class="flex items-center justify-between h-16 p-4 mt-14 ml-6 mr-6 rounded-full shadow-2xl" role="alert">
                <img src="assets/profile_img.jpg" class="h-8 sm:h-8 rounded-full" alt="Flowbite Logo" />
                <p class="text-sm font-medium text-center leading-6 text-black">
                    María Rodriguéz
                </p>
                <button
                    class="left-0 flex items-center py-1 px-1 bg-white text-black rounded-lg hover:bg-yellow-50 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3H5.25A2.25 2.25 0 0 0 3 5.25v13.5A2.25 2.25 0 0 0 5.25 21h8.25a2.25 2.25 0 0 0 2.25-2.25V15m4.5-3H9m6 3 3-3m0 0-3-3" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</aside>
