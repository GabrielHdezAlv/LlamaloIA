<div
  class="dashboard flex flex-col xl:flex-row xl:max-h-screen overflow-y-hidden"
>
  <!-- Sidebar Desktop (solo visible en xl) -->
  <div 
    [class]="'hidden xl:block w-full xl:overflow-visible p-0 h-screen bg-white transition-all duration-500 ease-in-out flex-shrink-0 dark:bg-slate-900 ' + (isNavCollapsed ? 'xl:w-12 3xl:w-16' : 'xl:w-[12rem] 2xl:w-[12rem] 3xl:w-[14rem]')"
  >
    <app-nav #navComponent></app-nav>
  </div>

  <!-- Sidebar Mobile/Tablet - MISMO DISEÑO QUE DESKTOP -->
  <div 
    *ngIf="showMobileSidebar"
    class="xl:hidden fixed inset-0 z-50 flex"
  >
    <!-- Overlay -->
    <div 
      class="fixed inset-0 bg-black/50 mobile-overlay-enter"
      (click)="closeMobileSidebar()"
    ></div>
    
    <!-- Sidebar móvil con estilo de escritorio -->
    <div class="relative w-80 bg-white shadow-xl flex flex-col h-full mobile-sidebar-enter dark:bg-slate-900 dark:border-slate-800 border-r border-gray-200">
      <div class="flex flex-col h-full w-full">
        <!-- Logo principal -->
        <div class="flex items-center h-16 px-6 pt-4 pb-2 flex-shrink-0 relative justify-between">
          <div class="flex items-center gap-2 relative w-full">
            <!-- Logo normal -->
            <div class="relative mt-2 ml-2">
              <img
                src="assets/logo_azul.webp"
                alt="Llamalo Logo"
                class="h-10 block dark:hidden relative z-0"
                style="width: auto; object-fit: contain;"
              />
              <!-- Logo blanco en modo oscuro -->
              <img
                src="assets/logo_blanco.webp"
                alt="Llamalo Logo"
                class="h-10 hidden dark:block relative z-0"
                style="width: auto; object-fit: contain;"
              />
            </div>
            <!-- Texto Llamalo beta -->
            <div class="flex flex-row items-baseline gap-0 leading-tight">
              <span class="brand-font text-4xl mt-2 font-bold  sidebar-logo-text">Llamalo</span>
              <span class="brand-font text-[10px] text-black font-bold  dark:text-slate-300">beta</span>
            </div>
          </div>
        </div>

        <!-- Navegación -->
        <nav class="flex-1 px-4 pt-4 pb-4 space-y-2 font-semibold text-xl overflow-y-auto">
          <a
            [routerLink]="['/dashboard/home']"
            (click)="closeMobileSidebar()"
            [class]="'nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg transition ' + (isRouteActive('/dashboard/home') ? 'nav-link-active text-blue-900' : 'text-gray-400 hover:bg-gray-100 hover:text-blue-900')"
          >
            <span class="nav-icon-wrapper">
              <svg width="24" height="25" viewBox="0 0 20 17" fill="currentColor" xmlns="http://www.w3.org/2000/svg" class="nav-icon">
                <path d="M8.0001 16V11H12.0001V16C12.0001 16.55 12.4501 17 13.0001 17H16.0001C16.5501 17 17.0001 16.55 17.0001 16V8.99997H18.7001C19.1601 8.99997 19.3801 8.42997 19.0301 8.12997L10.6701 0.599971C10.2901 0.259971 9.7101 0.259971 9.3301 0.599971L0.970098 8.12997C0.630098 8.42997 0.840098 8.99997 1.3001 8.99997H3.0001V16C3.0001 16.55 3.4501 17 4.0001 17H7.0001C7.5501 17 8.0001 16.55 8.0001 16Z" />
              </svg>
            </span>
            <span class="nav-text mt-1 block">{{ t.home }}</span>
          </a>

          <a
            [routerLink]="['/dashboard/agents']"
            (click)="closeMobileSidebar()"
            [class]="'nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg transition ' + (isRouteActive('/dashboard/agents') ? 'nav-link-active text-blue-900' : 'text-gray-400 hover:bg-gray-100 hover:text-blue-900')"
          >
            <span class="nav-icon-wrapper">
              <svg width="24" height="25" viewBox="0 0 24 25" fill="currentColor" xmlns="http://www.w3.org/2000/svg" class="nav-icon">
                <path d="M18.7425 7.86458C18.6616 7.86458 18.5928 7.84722 18.5361 7.8125C18.4795 7.77778 18.435 7.71701 18.4026 7.63021L17.6986 5.85938L15.9263 5.02604C15.8454 4.99132 15.7887 4.94358 15.7564 4.88281C15.724 4.82205 15.7078 4.74826 15.7078 4.66146C15.7078 4.57465 15.724 4.50087 15.7564 4.4401C15.7887 4.37934 15.8454 4.3316 15.9263 4.29688L17.6986 3.48958L18.4026 1.79688C18.435 1.71007 18.4795 1.64931 18.5361 1.61458C18.5928 1.57986 18.6616 1.5625 18.7425 1.5625C18.8234 1.5625 18.8922 1.57986 18.9489 1.61458C19.0055 1.64931 19.05 1.71007 19.0824 1.79688L19.7864 3.48958L21.5587 4.29688C21.6396 4.3316 21.6963 4.37934 21.7286 4.4401C21.761 4.50087 21.7772 4.57465 21.7772 4.66146C21.7772 4.74826 21.761 4.82205 21.7286 4.88281C21.6963 4.94358 21.6396 4.99132 21.5587 5.02604L19.7864 5.85938L19.0824 7.63021C19.05 7.71701 19.0055 7.77778 18.9489 7.8125C18.8922 7.84722 18.8234 7.86458 18.7425 7.86458ZM18.7425 23.3854C18.6778 23.3854 18.613 23.3681 18.5483 23.3333C18.4835 23.2986 18.435 23.2378 18.4026 23.151L17.6986 21.4583L15.9506 20.651C15.8697 20.6163 15.813 20.5686 15.7806 20.5078C15.7483 20.447 15.7321 20.3733 15.7321 20.2865C15.7321 20.1997 15.7483 20.1259 15.7806 20.0651C15.813 20.0043 15.8697 19.9566 15.9506 19.9219L17.6986 19.1146L18.4026 17.3177C18.435 17.2309 18.4795 17.1701 18.5361 17.1354C18.5928 17.1007 18.6616 17.0833 18.7425 17.0833C18.8234 17.0833 18.8922 17.1007 18.9489 17.1354C19.0055 17.1701 19.05 17.2309 19.0824 17.3177L19.7864 19.1146L21.5344 19.9219C21.6153 19.9566 21.672 20.0043 21.7044 20.0651C21.7367 20.1259 21.7529 20.1997 21.7529 20.2865C21.7529 20.3733 21.7367 20.447 21.7044 20.5078C21.672 20.5686 21.6153 20.6163 21.5344 20.651L19.7864 21.4583L19.0824 23.151C19.05 23.2378 19.0015 23.2986 18.9367 23.3333C18.872 23.3681 18.8072 23.3854 18.7425 23.3854ZM8.08466 18.8802C7.95518 18.8802 7.82975 18.8411 7.70836 18.763C7.58697 18.6849 7.49391 18.5764 7.42917 18.4375L5.85113 14.8177L2.45227 13.1771C2.32279 13.1076 2.22163 13.0078 2.1488 12.8776C2.07597 12.7474 2.03955 12.6128 2.03955 12.474C2.03955 12.3351 2.07597 12.2005 2.1488 12.0703C2.22163 11.9401 2.32279 11.8403 2.45227 11.7708L5.85113 10.1302L7.42917 6.53646C7.49391 6.38021 7.58697 6.26302 7.70836 6.1849C7.82975 6.10677 7.95518 6.06771 8.08466 6.06771C8.21414 6.06771 8.33957 6.10677 8.46096 6.1849C8.58235 6.26302 8.67541 6.37153 8.74015 6.51042L10.3425 10.1302L13.7171 11.7708C13.8627 11.8403 13.972 11.9401 14.0448 12.0703C14.1176 12.2005 14.154 12.3351 14.154 12.474C14.154 12.6128 14.1176 12.7474 14.0448 12.8776C13.972 13.0078 13.8627 13.1076 13.7171 13.1771L10.3425 14.8177L8.74015 18.4375C8.67541 18.5938 8.58235 18.7066 8.46096 18.776C8.33957 18.8455 8.21414 18.8802 8.08466 18.8802Z" />
              </svg>
            </span>
            <span class="nav-text">{{ t.agents }}</span>
          </a>

          <a
            [routerLink]="['/dashboard/numbers']"
            (click)="closeMobileSidebar()"
            [class]="'nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg transition ' + (isRouteActive('/dashboard/numbers') ? 'nav-link-active text-blue-900' : 'text-gray-400 hover:bg-gray-100 hover:text-blue-900')"
          >
            <span class="nav-icon-wrapper">
              <svg width="24" height="25" viewBox="0 0 22 23" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" class="nav-icon">
                <path d="M7.04674 4.69293C7.37976 4.69293 7.68657 4.88174 7.84818 5.1861L8.96949 7.29774C9.1163 7.57422 9.12317 7.90859 8.98792 8.19144L7.90772 10.4501C7.90772 10.4501 8.22076 12.1326 9.53086 13.5023C10.841 14.872 12.445 15.1936 12.445 15.1936L14.6051 14.0644C14.8758 13.9229 15.1959 13.9303 15.4605 14.084L17.486 15.2613C17.7768 15.4304 17.9572 15.751 17.9572 16.0989V18.53C17.9572 19.768 16.8573 20.6621 15.7352 20.2663C13.4308 19.4534 9.85362 17.9056 7.58633 15.5352C5.31901 13.1649 3.8385 9.42515 3.06092 7.0159C2.68232 5.8429 3.53762 4.69293 4.7218 4.69293H7.04674Z" />
              </svg>
            </span>
            <span class="nav-text mt-1 block">{{ t.numbers }}</span>
          </a>

          <a
            [routerLink]="['/dashboard/history']"
            (click)="closeMobileSidebar()"
            [class]="'nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg transition ' + (isRouteActive('/dashboard/history') ? 'nav-link-active text-blue-900' : 'text-gray-400 hover:bg-gray-100 hover:text-blue-900')"
          >
            <span class="nav-icon-wrapper">
              <svg width="24" height="18" viewBox="0 0 17 15" fill="currentColor" xmlns="http://www.w3.org/2000/svg" class="nav-icon">
                <path d="M8.99625 12.7224C8.6357 12.9516 8.12492 12.9516 7.76437 12.7224L1.60495 8.80905C1.2444 8.57982 0.743637 8.57982 0.383085 8.80905C-0.127695 9.13653 -0.127695 9.76692 0.383085 10.0944L7.15343 14.4007C7.87454 14.8591 8.88608 14.8591 9.6172 14.4007L16.3875 10.0944C16.8983 9.76692 16.8983 9.13653 16.3875 8.80905L16.3775 8.80087C16.017 8.57164 15.5162 8.57164 15.1557 8.80087L8.99625 12.7224ZM9.62721 10.2499L16.3976 5.94366C16.9083 4.97761 16.9083 4.97761 16.3976 4.65013L9.62721 0.343848C8.90611 -0.114616 7.89457 -0.114616 7.16345 0.343848L0.393101 4.65832C-0.11768 4.98579 -0.11768 5.62437 0.393101 5.95184L7.16345 10.2581C7.88455 10.7166 8.90611 10.7166 9.62721 10.2499Z" />
              </svg>
            </span>
            <span class="nav-text">{{ t.history }}</span>
            <span class="ml-auto text-xs text-blue-900 border border-gray-300 px-3 py-1 rounded-lg font-bold">{{ t.new }}</span>
          </a>

          <a
            [routerLink]="['/dashboard/metrics']"
            (click)="closeMobileSidebar()"
            [class]="'nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg transition ' + (isRouteActive('/dashboard/metrics') ? 'nav-link-active text-blue-900' : 'text-gray-400 hover:bg-gray-100 hover:text-blue-900')"
          >
            <span class="nav-icon-wrapper">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg" class="nav-icon">
                <path d="M15.5 2C15.1022 2 14.7206 2.15804 14.4393 2.43934C14.158 2.72064 14 3.10218 14 3.5V16.5C14 16.8978 14.158 17.2794 14.4393 17.5607C14.7206 17.842 15.1022 18 15.5 18H16.5C16.8978 18 17.2794 17.842 17.5607 17.5607C17.842 17.2794 18 16.8978 18 16.5V3.5C18 3.10218 17.842 2.72064 17.5607 2.43934C17.2794 2.15804 16.8978 2 16.5 2H15.5ZM9.5 6C9.10218 6 8.72064 6.15804 8.43934 6.43934C8.15804 6.72064 8 7.10218 8 7.5V16.5C8 16.8978 8.15804 17.2794 8.43934 17.5607C8.72064 17.842 9.10218 18 9.5 18H10.5C10.8978 18 11.2794 17.842 11.5607 17.5607C11.842 17.2794 12 16.8978 12 16.5V7.5C12 7.10218 11.842 6.72064 11.5607 6.43934C11.2794 6.15804 10.8978 6 10.5 6H9.5ZM3.5 10C3.10218 10 2.72064 10.158 2.43934 10.4393C2.15804 10.7206 2 11.1022 2 11.5V16.5C2 16.8978 2.15804 17.2794 2.43934 17.5607C2.72064 17.842 3.10218 18 3.5 18H4.5C4.89782 18 5.27936 17.842 5.56066 17.5607C5.84196 17.2794 6 16.8978 6 16.5V11.5C6 11.1022 5.84196 10.7206 5.56066 10.4393C5.27936 10.158 4.89782 10 4.5 10H3.5Z" />
              </svg>
            </span>
            <span class="nav-text">{{ t.metrics }}</span>
            <span class="ml-auto text-xs text-blue-900 border border-gray-300 px-3 py-1 rounded-lg font-bold">{{ t.new }}</span>
          </a>
        </nav>

        <!-- Sección inferior -->
        <div class="pb-2 mb-2 w-full flex flex-col mt-auto px-6 gap-1">
          <!-- Tarjeta estilo onboarding -->
          <div class="pb-1">
            <div
              class="sidebar-onboarding-card mx-auto rounded-2xl shadow-lg bg-white border border-gray-200 dark:bg-slate-900 dark:border-slate-700 flex flex-col gap-2 px-2.5 py-2 w-[84%] "
            >
              <div class="flex flex-col items-center text-center gap-2">
                <div class="sidebar-onboarding-icon w-11 h-11 rounded-2xl grid place-items-center text-[#0B2B6F]">
                  <svg width="24" height="24" viewBox="0 0 600 600" aria-hidden="true" fill="currentColor" class="text-[#0B2B6F]">
                    <path d="M447.70881 -12.781343A42.041451 42.041451 0 0 0 405.66786 29.260344v21.041377H27.434765A42.041302 42.041302 0 0 0-14.606185 92.341354 42.041302 42.041302 0 0 0 27.434765 134.38304H405.66786v21.06602a42.041451 42.041451 0 0 0 84.08301 0v-21.06602h84.02949a42.041302 42.041302 0 0 0 42.043-42.041686 42.041302 42.041302 0 0 0-42.043-42.039633h-84.02949V29.260344A42.041451 42.041451 0 0 0 447.70881-12.781343zm-304.70761 210.270033A42.041451 42.041451 0 0 0 100.9582 239.53038v21.03932H27.447078A42.041302 42.041302 0 0 0-14.593872 302.61139 42.041302 42.041302 0 0 0 27.447078 344.65308H100.9582v21.06602a42.041451 42.041451 0 0 0 84.08395 0v-21.06602H573.79472a42.041302 42.041302 0 0 0 42.04095-42.04169 42.041302 42.041302 0 0 0-42.04095-42.04169H185.04215v-21.03932a42.041451 42.041451 0 0 0-42.041-42.04204zm136.59307 210.27209a42.041451 42.041451 0 0 0-42.04095 42.03964v21.04032H27.447078A42.041302 42.041302 0 0 0-14.593872 512.88143 42.041302 42.041302 0 0 0 27.447078 554.92106H237.55332v21.06807a42.041451 42.041451 0 0 0 84.08195 0v-21.06807h252.15945a42.041302 42.041302 0 0 0 42.04095-42.04065 42.041302 42.041302 0 0 0-42.04095-42.04169H321.63527v-21.04032a42.041451 42.041451 0 0 0-42.04095-42.04064z"/>
                  </svg>
                </div>
                <div class="flex flex-col gap-1">
                  <p class="sidebar-onboarding-title text-[15px] font-semibold text-slate-900 dark:text-white">¡Casi estás listo!</p>
                  <p class="sidebar-onboarding-subtitle text-[13px] text-slate-500 dark:text-slate-300 leading-snug">Completa estos pasos y empieza a compartir tus enlaces de marca.</p>
                </div>
              </div>

              <div class="sidebar-onboarding-progress flex flex-nowrap items-center justify-center gap-[0.14rem] w-full mt-1" aria-hidden="true">
                <span
                  *ngFor="let bar of progressBars; let i = index"
                  class="block w-[4px] h-[16px] rounded-md flex-none transition-colors duration-300"
                  [ngStyle]="getBarStyle(i)"
                ></span>
              </div>

              <div class="flex flex-col border border-gray-200 rounded-xl overflow-hidden divide-y divide-gray-200 bg-white dark:bg-slate-900 dark:border-slate-700 dark:divide-slate-700 mt-1.5">
                <button type="button" class="sidebar-onboarding-step-button sidebar-onboarding-step flex items-center gap-2.5 px-3 py-2">
                  <span class="grid place-items-center w-4.5 h-4.5 rounded-full bg-white border border-gray-400 text-gray-500 dark:bg-slate-900 dark:border-gray-500">
                    <svg class="w-3 h-3 text-gray-500 dark:text-gray-300" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M5 10.5L8.5 14L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                  <span class="sidebar-onboarding-step-text text-[13px] font-normal text-slate-800 leading-5 dark:text-white">Configura tu dominio</span>
                  <span class="sidebar-onboarding-arrow ml-auto text-slate-900 text-xl font-normal leading-none dark:text-white">›</span>
                </button>
                <button type="button" class="sidebar-onboarding-step-button sidebar-onboarding-step flex items-center gap-2.5 px-3 py-2">
                  <span class="grid place-items-center w-4.5 h-4.5 rounded-full bg-white border border-gray-400 text-gray-500 dark:bg-slate-900 dark:border-gray-500">
                    <svg class="w-3 h-3 text-gray-500 dark:text-gray-300" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M5 10.5L8.5 14L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                  <span class="sidebar-onboarding-step-text text-[13px] font-normal text-slate-800 leading-5 dark:text-white">Invita a tu equipo</span>
                  <span class="sidebar-onboarding-arrow ml-auto text-slate-900 text-xl font-normal leading-none dark:text-white">›</span>
                </button>
                <button type="button" class="sidebar-onboarding-step-button sidebar-onboarding-step flex items-center gap-2.5 px-3 py-2">
                  <span class="grid place-items-center w-4.5 h-4.5 rounded-full bg-white border border-gray-400 text-gray-500 dark:bg-slate-900 dark:border-gray-500">
                    <svg class="w-3 h-3 text-gray-500 dark:text-gray-300" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M5 10.5L8.5 14L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                  <span class="sidebar-onboarding-step-text text-[13px] font-normal text-slate-800 leading-5 dark:text-white">Crea o importa tus links</span>
                  <span class="sidebar-onboarding-arrow ml-auto text-slate-900 text-xl font-normal leading-none dark:text-white">›</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Perfil con dropdown -->
          <div class="relative pt-2 pb-2 w-full flex items-center gap-3">
            <!-- Avatar y texto -->
            <div
              class="flex items-center gap-2 transition-all duration-500 ease-out cursor-pointer flex-1"
              (click)="toggleDropdown()"
            >
              <img
                [src]="getUserProfileImage()"
                class="h-8 w-8 rounded-full border-2 border-blue-900 history-border sidebar-avatar flex-shrink-0"
                alt="Perfil"
              />
            </div>

            <!-- Icono regalo -->
            <div>
              <button (click)="goToGifts()" class="inline-flex items-center justify-center text-gray-400 hover:text-gray-700 focus:outline-none">            
                <svg class="h-7 w-7 relative top-[4px]" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                  <path d="M11.2498 2C7.03145 2.00411 4.84888 2.07958 3.46423 3.46423C2.07958 4.84888 2.00411 7.03145 2 11.2498H6.91352C6.56255 10.8114 6.30031 10.2943 6.15731 9.72228C5.61906 7.56926 7.56926 5.61906 9.72228 6.15731C10.2943 6.30031 10.8114 6.56255 11.2498 6.91352V2Z"></path>
                  <path d="M2 12.7498C2.00411 16.9681 2.07958 19.1506 3.46423 20.5353C4.84888 21.9199 7.03145 21.9954 11.2498 21.9995V14.1234C10.4701 15.6807 8.8598 16.7498 6.99976 16.7498C6.58555 16.7498 6.24976 16.414 6.24976 15.9998C6.24976 15.5856 6.58555 15.2498 6.99976 15.2498C8.53655 15.2498 9.82422 14.1831 10.1628 12.7498H2Z"></path>
                  <path d="M12.7498 21.9995C16.9681 21.9954 19.1506 21.9199 20.5353 20.5353C21.9199 19.1506 21.9954 16.9681 21.9995 12.7498H13.8367C14.1753 14.1831 15.463 15.2498 16.9998 15.2498C17.414 15.2498 17.7498 15.5856 17.7498 15.9998C17.7498 16.414 17.414 16.7498 16.9998 16.7498C15.1397 16.7498 13.5294 15.6807 12.7498 14.1234V21.9995Z"></path>
                  <path d="M21.9995 11.2498C21.9954 7.03145 21.9199 4.84888 20.5353 3.46423C19.1506 2.07958 16.9681 2.00411 12.7498 2V6.91352C13.1882 6.56255 13.7053 6.30031 14.2772 6.15731C16.4303 5.61906 18.3805 7.56926 17.8422 9.72228C17.6992 10.2943 17.437 10.8114 17.086 11.2498H21.9995Z"></path>
                  <path d="M9.35847 7.61252C10.47 7.8904 11.2498 8.88911 11.2498 10.0348V11.2498H10.0348C8.88911 11.2498 7.8904 10.47 7.61252 9.35847C7.34891 8.30403 8.30403 7.34891 9.35847 7.61252Z"></path>
                  <path d="M12.7498 10.0348V11.2498H13.9647C15.1104 11.2498 16.1091 10.47 16.387 9.35847C16.6506 8.30403 15.6955 7.34891 14.6411 7.61252C13.5295 7.8904 12.7498 8.88911 12.7498 10.0348Z"></path>
                </svg>
              </button>
            </div>
             
            <div>

<!-- Modal de recordatorio para usuarios inactivos -->
<div
  *ngIf="showInactiveReminderModal"
  class="fixed inset-0 bg-black/40 backdrop-blur-md z-[9999] flex items-center justify-center px-3 sm:px-4 reminder-overlay"
  (click)="closeInactiveReminderModal()"
>
  <div 
    class="flex flex-col gap-0 w-full max-w-lg mx-auto px-4 select-none reminder-container reminder-modal-content" 
    (click)="$event.stopPropagation()"
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd($event)"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp($event)"
    (mouseleave)="isDragging = false"
    [class.slide-left]="slideDirection === 'left' && isTransitioning"
    [class.slide-right]="slideDirection === 'right' && isTransitioning"
    [class.cursor-grab]="reminders.length > 1 && !isDragging"
    [class.cursor-grabbing]="isDragging"
  >
    <!-- Sección superior: Rules Library (Imagen grande) -->
    <div class="bg-white rounded-t-2xl shadow-xl relative overflow-hidden border border-gray-200 dark:bg-slate-900 dark:border-slate-800 reminder-content">
      <!-- Botón cerrar -->
      <button
        (click)="closeInactiveReminderModal()"
        class="absolute top-3 right-3 p-2 hover:bg-gray-100 rounded-lg transition-colors dark:hover:bg-slate-800 z-10"
        aria-label="Cerrar"
      >
        <svg class="w-5 h-5 text-gray-600 dark:text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Imagen grande de Rules Library -->
      <div class="w-full min-h-[350px] bg-cover bg-center bg-no-repeat" [style.background-image]="'url(' + reminderData.imageUrl + ')'">
      </div>
    </div>

    <!-- Sección inferior: Mensaje promocional -->
    <div class="bg-white rounded-2xl shadow-xl p-6 relative -mt-4 border border-gray-200 dark:bg-slate-900 dark:border-slate-800 min-h-[220px] reminder-content">
      <!-- Tag NEW con icono de regalo -->
      <div *ngIf="reminderData.showNewTag" class="absolute top-3 left-6 bg-blue-500 text-white text-xs font-semibold px-3 py-1 rounded-full flex items-center gap-2">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M11.2498 2C7.03145 2.00411 4.84888 2.07958 3.46423 3.46423C2.07958 4.84888 2.00411 7.03145 2 11.2498H6.91352C6.56255 10.8114 6.30031 10.2943 6.15731 9.72228C5.61906 7.56926 7.56926 5.61906 9.72228 6.15731C10.2943 6.30031 10.8114 6.56255 11.2498 6.91352V2Z"></path>
          <path d="M2 12.7498C2.00411 16.9681 2.07958 19.1506 3.46423 20.5353C4.84888 21.9199 7.03145 21.9954 11.2498 21.9995V14.1234C10.4701 15.6807 8.8598 16.7498 6.99976 16.7498C6.58555 16.7498 6.24976 16.414 6.24976 15.9998C6.24976 15.5856 6.58555 15.2498 6.99976 15.2498C8.53655 15.2498 9.82422 14.1831 10.1628 12.7498H2Z"></path>
          <path d="M12.7498 21.9995C16.9681 21.9954 19.1506 21.9199 20.5353 20.5353C21.9199 19.1506 21.9954 16.9681 21.9995 12.7498H13.8367C14.1753 14.1831 15.463 15.2498 16.9998 15.2498C17.414 15.2498 17.7498 15.5856 17.7498 15.9998C17.7498 16.414 17.414 16.7498 16.9998 16.7498C15.1397 16.7498 13.5294 15.6807 12.7498 14.1234V21.9995Z"></path>
          <path d="M21.9995 11.2498C21.9954 7.03145 21.9199 4.84888 20.5353 3.46423C19.1506 2.07958 16.9681 2.00411 12.7498 2V6.91352C13.1882 6.56255 13.7053 6.30031 14.2772 6.15731C16.4303 5.61906 18.3805 7.56926 17.8422 9.72228C17.6992 10.2943 17.437 10.8114 17.086 11.2498H21.9995Z"></path>
          <path d="M9.35847 7.61252C10.47 7.8904 11.2498 8.88911 11.2498 10.0348V11.2498H10.0348C8.88911 11.2498 7.8904 10.47 7.61252 9.35847C7.34891 8.30403 8.30403 7.34891 9.35847 7.61252Z"></path>
          <path d="M12.7498 10.0348V11.2498H13.9647C15.1104 11.2498 16.1091 10.47 16.387 9.35847C16.6506 8.30403 15.6955 7.34891 14.6411 7.61252C13.5295 7.8904 12.7498 8.88911 12.7498 10.0348Z"></path>
        </svg>
        <span>NEW</span>
      </div>

      <div class="mt-4 flex flex-col justify-between h-full min-h-[160px]">
        <div>
          <h3 class="text-xl font-bold text-gray-900 mb-3 dark:text-slate-50">
            {{ reminderData.title }}
          </h3>
          <p class="text-sm text-gray-600 leading-relaxed mb-4 dark:text-slate-400">
            {{ reminderData.description }}
          </p>
        </div>

        <!-- Botones de acción -->
        <div class="flex items-center justify-end gap-3 mt-auto">
          <a
            *ngIf="reminderData.learnMoreUrl"
            [href]="reminderData.learnMoreUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="text-blue-600 font-semibold text-sm hover:text-blue-700 transition-colors dark:text-blue-400 dark:hover:text-blue-300"
          >
            Leer más
          </a>
          <button
            *ngIf="!reminderData.learnMoreUrl"
            type="button"
            class="text-blue-600 font-semibold text-sm hover:text-blue-700 transition-colors dark:text-blue-400 dark:hover:text-blue-300"
            disabled
          >
            Leer más
          </button>
          <button
            type="button"
            class="bg-blue-600 text-white font-semibold px-5 py-2 rounded-lg hover:bg-blue-700 transition-colors text-sm dark:bg-blue-500 dark:hover:bg-blue-600"
            (click)="closeInactiveReminderModal()"
          >
            Entendido
          </button>
        </div>
      </div>
    </div>

    <!-- Indicadores de recordatorios (puntos) -->
    <div *ngIf="reminders.length > 1" class="flex items-center justify-center gap-2 mt-6">
      <button
        *ngFor="let reminder of reminders; let i = index"
        (click)="selectReminder(i)"
        [class]="'transition-all rounded-full ' + (i === currentReminderIndex ? 'w-3 h-3 bg-blue-600 dark:bg-blue-500' : 'w-2 h-2 bg-gray-300 dark:bg-slate-600 hover:bg-gray-400 dark:hover:bg-slate-500')"
        [title]="'Recordatorio ' + (i + 1)"
        [attr.aria-label]="'Seleccionar recordatorio ' + (i + 1)"
      ></button>
    </div>
  </div>
</div>
