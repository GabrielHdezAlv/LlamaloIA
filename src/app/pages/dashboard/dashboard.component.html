<div class="dashboard flex flex-col xl:flex-row xl:max-h-screen overflow-y-hidden relative">
  @if (subscriptionPaywallActive()) {
    <div
      class="fixed inset-0 z-[998] bg-black/35 pointer-events-auto touch-none dark:bg-black/50"
      aria-hidden="true"
    ></div>
  }

  @if (showDashboardLoader) {
    <div
      class="fixed inset-0 z-[999] flex items-center justify-center bg-gray-100/90 backdrop-blur-sm dark:bg-[#111113]/92 pointer-events-auto"
      role="status"
      aria-live="polite"
      aria-busy="true">
      <div class="scale-125">
        <ds-spinner variant="auto" [inputTextSpinner]="''"></ds-spinner>
      </div>
    </div>
  }

  <!-- Sidebar Desktop (solo visible en xl) -->
  <div
    [class]="'hidden xl:block w-full xl:overflow-visible p-0 h-screen bg-white transition-all duration-500 ease-in-out flex-shrink-0 dark:bg-slate-900 ' + (isNavCollapsed ? 'xl:w-12 3xl:w-16' : 'xl:w-[12rem] 2xl:w-[12rem] 3xl:w-[14rem]')">
    <app-nav #navComponent></app-nav>
  </div>

  <!-- Sidebar Mobile/Tablet - FULLSCREEN, SIN ICONOS -->
  <div *ngIf="showMobileSidebar"
    [class]="'xl:hidden fixed inset-0 z-50 flex mobile-sidebar-container ' + (isMobileSidebarClosing ? 'closing' : '')">
    <!-- Overlay -->
    <div class="fixed inset-0 bg-black/50 mobile-overlay" (click)="closeMobileSidebar()"></div>

    <!-- Sidebar fullscreen desde arriba -->
    <div class="relative w-full h-full bg-white dark:bg-slate-900 shadow-xl flex flex-col mobile-sidebar">
      <!-- Header -->
      <div class="flex items-center justify-between px-6 pt-6 pb-4">
        <div class="flex items-center gap-2">
          <div class="relative">
            <img src="assets/logo_azul.webp" alt="Llamalo Logo" class="h-7 block dark:hidden"
              style="width: auto; object-fit: contain;" />
            <img src="assets/logo_blanco.webp" alt="Llamalo Logo" class="h-7 hidden dark:block"
              style="width: auto; object-fit: contain;" />
          </div>
          <div class="flex flex-row items-baseline gap-0.5 leading-tight">
            <span class="text-xl font-bold text-black dark:text-slate-50 sidebar-llamalo-wordmark-tight"
              style="font-family: 'Poppins', sans-serif;">Llamalo</span>
            <span class="text-[9px] text-black font-bold dark:text-slate-300"
              style="font-family: 'Poppins', sans-serif;">beta</span>
          </div>
        </div>

        <button (click)="closeMobileSidebar()"
          class="p-2 rounded-full text-gray-600 hover:bg-gray-100 dark:text-slate-300 dark:hover:bg-slate-800">
          <span class="text-sm font-medium">Cerrar</span>
        </button>
      </div>

      <!-- Navegación principal -->
      <nav class="flex-1 px-6 pt-6 pb-4 space-y-3 overflow-y-auto">
        <a [routerLink]="['/dashboard/home']" (click)="closeMobileSidebar()"
          [class]="'block text-lg font-semibold rounded-xl px-3 py-2 text-center transition ' + (isRouteActive('/dashboard/home') ? 'bg-[#1B2559] text-white dark:bg-white dark:text-[#000000]' : 'text-gray-500 hover:bg-gray-100 hover:text-blue-900 dark:text-slate-300 dark:hover:bg-slate-800')">
          {{ t.home }}
        </a>

        <a id="tour-nav-agents-mobile" [routerLink]="['/dashboard/agents']" (click)="closeMobileSidebar()"
          [class]="'block text-lg font-semibold rounded-xl px-3 py-2 text-center transition ' + (isRouteActive('/dashboard/agents') ? 'bg-[#1B2559] text-white dark:bg-white dark:text-[#000000]' : 'text-gray-500 hover:bg-gray-100 hover:text-blue-900 dark:text-slate-300 dark:hover:bg-slate-800')">
          {{ t.agents }}
        </a>

        <a [routerLink]="['/dashboard/numbers']" (click)="closeMobileSidebar()"
          [class]="'block text-lg font-semibold rounded-xl px-3 py-2 text-center transition ' + (isRouteActive('/dashboard/numbers') ? 'bg-[#1B2559] text-white dark:bg-white dark:text-[#000000]' : 'text-gray-500 hover:bg-gray-100 hover:text-blue-900 dark:text-slate-300 dark:hover:bg-slate-800')">
          {{ t.numbers }}
        </a>

        @if (showHistorialNav) {
        <a [routerLink]="['/dashboard/history']" (click)="closeMobileSidebar()"
          [class]="'block text-lg font-semibold rounded-xl px-3 py-2 text-center transition ' + (isRouteActive('/dashboard/history') ? 'bg-[#1B2559] text-white dark:bg-white dark:text-[#000000]' : 'text-gray-500 hover:bg-gray-100 hover:text-blue-900 dark:text-slate-300 dark:hover:bg-slate-800')">
          {{ t.history }}
        </a>
        }

        <a [routerLink]="['/dashboard/metrics']" (click)="closeMobileSidebar()"
          [class]="'block text-lg font-semibold rounded-xl px-3 py-2 text-center transition ' + (isRouteActive('/dashboard/metrics') ? 'bg-[#1B2559] text-white dark:bg-white dark:text-[#000000]' : 'text-gray-500 hover:bg-gray-100 hover:text-blue-900 dark:text-slate-300 dark:hover:bg-slate-800')">
          {{ t.metrics }}
        </a>

        <a [routerLink]="['/dashboard/knowledge-base']" (click)="closeMobileSidebar()"
          [class]="'block text-lg font-semibold rounded-xl px-3 py-2 text-center transition ' + (isRouteActive('/dashboard/knowledge-base') ? 'bg-[#1B2559] text-white dark:bg-white dark:text-[#000000]' : 'text-gray-500 hover:bg-gray-100 hover:text-blue-900 dark:text-slate-300 dark:hover:bg-slate-800')">
          {{ t.knowledgeBase }}
        </a>
      </nav>

      <!-- Sección inferior limpia con acciones -->
      <div class="px-6 pb-6 pt-2">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <img [src]="getUserProfileImage()" class="h-9 w-9 rounded-full border border-blue-900 history-border"
              alt="Perfil" />
            <div class="flex flex-col">
              <span class="text-sm font-semibold text-gray-900 dark:text-slate-50">
                {{ userName() }}
              </span>
            </div>
          </div>

          <button (click)="logout()"
            class="text-sm font-medium text-red-600 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300">
            {{ t.logout }}
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button (click)="navigateTo('/dashboard/account')"
            class="flex-1 text-sm font-medium rounded-lg px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-100">
            {{ t.settings }}
          </button>
          <button type="button" (click)="toggleDarkMode()"
            class="flex-1 inline-flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-800 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-100 text-sm font-medium text-center">
            <!-- Luna cuando estamos en modo claro (para pasar a oscuro) -->
            <svg *ngIf="!isDarkMode" class="w-4 h-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12 22C17.5228 22 22 17.5228 22 12C22 11.5373 21.3065 11.4608 21.0672 11.8568C19.9289 13.7406 17.8615 15 15.5 15C11.9101 15 9 12.0899 9 8.5C9 6.13845 10.2594 4.07105 12.1432 2.93276C12.5392 2.69347 12.4627 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"
                fill="currentColor"></path>
            </svg>

            <!-- Sol cuando estamos en modo oscuro (para pasar a claro) -->
            <svg *ngIf="isDarkMode" class="w-4 h-4" viewBox="0 0 64 64" fill="currentColor">
              <circle fill-rule="evenodd" clip-rule="evenodd" cx="32.003" cy="32.005" r="16.001"></circle>
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M12.001,31.997c0-2.211-1.789-4-4-4H4c-2.211,0-4,1.789-4,4 s1.789,4,4,4h4C10.212,35.997,12.001,34.208,12.001,31.997z">
              </path>
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M12.204,46.139l-2.832,2.833c-1.563,1.562-1.563,4.094,0,5.656 c1.562,1.562,4.094,1.562,5.657,0l2.833-2.832c1.562-1.562,1.562-4.095,0-5.657C16.298,44.576,13.767,44.576,12.204,46.139z">
              </path>
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M32.003,51.999c-2.211,0-4,1.789-4,4V60c0,2.211,1.789,4,4,4 s4-1.789,4-4l-0.004-4.001C36.003,53.788,34.21,51.999,32.003,51.999z">
              </path>
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M51.798,46.143c-1.559-1.566-4.091-1.566-5.653-0.004 s-1.562,4.095,0,5.657l2.829,2.828c1.562,1.57,4.094,1.562,5.656,0s1.566-4.09,0-5.656L51.798,46.143z">
              </path>
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M60.006,27.997l-4.009,0.008 c-2.203-0.008-3.992,1.781-3.992,3.992c-0.008,2.211,1.789,4,3.992,4h4.001c2.219,0.008,4-1.789,4-4 C64.002,29.79,62.217,27.997,60.006,27.997z">
              </path>
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M51.798,17.859l2.828-2.829c1.574-1.566,1.562-4.094,0-5.657 c-1.559-1.567-4.09-1.567-5.652-0.004l-2.829,2.836c-1.562,1.555-1.562,4.086,0,5.649C47.699,19.426,50.239,19.418,51.798,17.859z">
              </path>
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M32.003,11.995c2.207,0.016,4-1.789,4-3.992v-4 c0-2.219-1.789-4-4-4c-2.211-0.008-4,1.781-4,3.993l0.008,4.008C28.003,10.206,29.792,11.995,32.003,11.995z">
              </path>
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M12.212,17.855c1.555,1.562,4.079,1.562,5.646-0.004 c1.574-1.551,1.566-4.09,0.008-5.649l-2.829-2.828c-1.57-1.571-4.094-1.559-5.657,0c-1.575,1.559-1.575,4.09-0.012,5.653 L12.212,17.855z">
              </path>
            </svg>

            <span>{{ isDarkMode ? 'Modo claro' : 'Modo oscuro' }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div
    class="flex-1 px-2 py-4 overflow-x-auto bg-gray-100 transition-all duration-500 ease-in-out min-h-screen dark:bg-[#111113] ml-0">
    <topbar></topbar>
    <router-outlet></router-outlet>
  </div>

<!-- Modal de recordatorio para usuarios inactivos -->
<div *ngIf="showInactiveReminderModal"
  class="fixed inset-0 bg-black/40 backdrop-blur-md z-[9999] flex items-center justify-center px-3 sm:px-4 reminder-overlay"
  (click)="closeInactiveReminderModal()">
  <div class="flex flex-col gap-0 w-full max-w-lg mx-auto px-4 select-none reminder-container reminder-modal-content"
    (click)="$event.stopPropagation()" (touchstart)="onTouchStart($event)" (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd($event)" (mousedown)="onMouseDown($event)" (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp($event)" (mouseleave)="isDragging = false"
    [class.slide-left]="slideDirection === 'left' && isTransitioning"
    [class.slide-right]="slideDirection === 'right' && isTransitioning"
    [class.cursor-grab]="reminders.length > 1 && !isDragging" [class.cursor-grabbing]="isDragging">
    <!-- Sección superior: Rules Library (Imagen grande) -->
    <div class="bg-white rounded-t-2xl relative overflow-hidden dark:bg-slate-900 reminder-content">
      <!-- Botón cerrar -->
      <button (click)="closeInactiveReminderModal()"
        class="absolute top-3 right-3 p-2 hover:bg-gray-100 rounded-lg transition-colors dark:hover:bg-slate-800 z-10"
        aria-label="Cerrar">
        <svg class="w-5 h-5 text-gray-600 dark:text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Imagen grande de Rules Library -->
      <div class="w-full min-h-[350px] bg-cover bg-center bg-no-repeat"
        [style.background-image]="'url(' + reminderData.imageUrl + ')'">
      </div>
    </div>

    <!-- Sección inferior: Mensaje promocional -->
    <div class="bg-white rounded-2xl p-6 relative -mt-4 dark:bg-slate-900 min-h-[220px] reminder-content">
      <!-- Tag NEW con icono de regalo -->
      <div *ngIf="reminderData.showNewTag"
        class="absolute top-3 left-6 bg-blue-500 text-white text-xs font-semibold px-3 py-1 rounded-full flex items-center gap-2">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M11.2498 2C7.03145 2.00411 4.84888 2.07958 3.46423 3.46423C2.07958 4.84888 2.00411 7.03145 2 11.2498H6.91352C6.56255 10.8114 6.30031 10.2943 6.15731 9.72228C5.61906 7.56926 7.56926 5.61906 9.72228 6.15731C10.2943 6.30031 10.8114 6.56255 11.2498 6.91352V2Z">
          </path>
          <path
            d="M2 12.7498C2.00411 16.9681 2.07958 19.1506 3.46423 20.5353C4.84888 21.9199 7.03145 21.9954 11.2498 21.9995V14.1234C10.4701 15.6807 8.8598 16.7498 6.99976 16.7498C6.58555 16.7498 6.24976 16.414 6.24976 15.9998C6.24976 15.5856 6.58555 15.2498 6.99976 15.2498C8.53655 15.2498 9.82422 14.1831 10.1628 12.7498H2Z">
          </path>
          <path
            d="M12.7498 21.9995C16.9681 21.9954 19.1506 21.9199 20.5353 20.5353C21.9199 19.1506 21.9954 16.9681 21.9995 12.7498H13.8367C14.1753 14.1831 15.463 15.2498 16.9998 15.2498C17.414 15.2498 17.7498 15.5856 17.7498 15.9998C17.7498 16.414 17.414 16.7498 16.9998 16.7498C15.1397 16.7498 13.5294 15.6807 12.7498 14.1234V21.9995Z">
          </path>
          <path
            d="M21.9995 11.2498C21.9954 7.03145 21.9199 4.84888 20.5353 3.46423C19.1506 2.07958 16.9681 2.00411 12.7498 2V6.91352C13.1882 6.56255 13.7053 6.30031 14.2772 6.15731C16.4303 5.61906 18.3805 7.56926 17.8422 9.72228C17.6992 10.2943 17.437 10.8114 17.086 11.2498H21.9995Z">
          </path>
          <path
            d="M9.35847 7.61252C10.47 7.8904 11.2498 8.88911 11.2498 10.0348V11.2498H10.0348C8.88911 11.2498 7.8904 10.47 7.61252 9.35847C7.34891 8.30403 8.30403 7.34891 9.35847 7.61252Z">
          </path>
          <path
            d="M12.7498 10.0348V11.2498H13.9647C15.1104 11.2498 16.1091 10.47 16.387 9.35847C16.6506 8.30403 15.6955 7.34891 14.6411 7.61252C13.5295 7.8904 12.7498 8.88911 12.7498 10.0348Z">
          </path>
        </svg>
        <span>NEW</span>
      </div>

      <div class="mt-4 flex flex-col justify-between h-full min-h-[160px]">
        <div>
          <h3 class="text-xl font-bold text-gray-900 mb-3 dark:text-slate-50">
            {{ reminderData.title }}
          </h3>
          <p class="text-sm text-gray-600 leading-relaxed mb-4 dark:text-slate-400">
            {{ reminderData.description }}
          </p>
        </div>

        <!-- Botones de acción -->
        <div class="flex items-center justify-end gap-3 mt-auto">
          <a *ngIf="reminderData.learnMoreUrl" [href]="reminderData.learnMoreUrl" target="_blank"
            rel="noopener noreferrer"
            class="text-blue-600 font-semibold text-sm hover:text-blue-700 transition-colors dark:text-blue-400 dark:hover:text-blue-300">
            Leer más
          </a>
          <button *ngIf="!reminderData.learnMoreUrl" type="button"
            class="text-blue-600 font-semibold text-sm hover:text-blue-700 transition-colors dark:text-blue-400 dark:hover:text-blue-300"
            disabled>
            Leer más
          </button>
          <button type="button"
            class="bg-blue-600 text-white font-semibold px-5 py-2 rounded-lg hover:bg-blue-700 transition-colors text-sm dark:bg-blue-500 dark:hover:bg-blue-600"
            (click)="closeInactiveReminderModal()">
            Entendido
          </button>
        </div>
      </div>
    </div>

    <!-- Indicadores de recordatorios (puntos) -->
    <div *ngIf="reminders.length > 1" class="flex items-center justify-center gap-2 mt-6">
      <button *ngFor="let reminder of reminders; let i = index" (click)="selectReminder(i)"
        [class]="'transition-all rounded-full ' + (i === currentReminderIndex ? 'w-3 h-3 bg-blue-600 dark:bg-blue-500' : 'w-2 h-2 bg-gray-300 dark:bg-slate-600 hover:bg-gray-400 dark:hover:bg-slate-500')"
        [title]="'Recordatorio ' + (i + 1)" [attr.aria-label]="'Seleccionar recordatorio ' + (i + 1)"></button>
    </div>
  </div>
</div>
