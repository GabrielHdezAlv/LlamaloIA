<div
  class="dashboard flex flex-col xl:flex-row xl:max-h-screen overflow-y-hidden"
>
  <div class="w-full xl:w-80 overflow-auto p-4 xl:p-0 h-screen">
    <app-nav></app-nav>
  </div>

  <div class="flex-1 px-2 py-4 overflox-x-auto bg-gray-100">
    <topbar></topbar>
    <!-- Botón temporal para mostrar el setup de empresa -->
    <div class="fixed top-4 right-4 z-50 mt-20">
      <button 
        (click)="toggleCompanySetup()"
        class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded shadow-lg transition-all duration-200"
      >
        {{ showCompanySetup ? 'Ocultar' : 'Mostrar' }} Ajustes iniciales
      </button>
    </div>
    <router-outlet></router-outlet>
  </div>
</div>

<!-- Componente de configuración inicial de empresa -->
<app-company-setup></app-company-setup>
