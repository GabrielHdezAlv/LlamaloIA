<!-- Modal overlay -->
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-8 z-50" (click)="closeModal($event)">
  <!-- Modal content -->
  <div class="bg-white rounded-[2rem] shadow-2xl p-12 max-w-4xl w-full mx-auto max-h-[90vh] overflow-y-auto relative" (click)="$event.stopPropagation()">
    <!-- Botón de cerrar -->
    <button
      (click)="goBack()"
      class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors duration-200"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    
    <!-- Selector de minutos -->
    <div class="mb-8">
      <div class="flex items-center gap-4 mb-4">
        <h2 class="text-lg font-medium text-gray-800">
          ¿Cuántos minutos necesitarías al mes? Unos
        </h2>
        <div class="bg-blue-900 text-white px-6 py-3 rounded-xl font-bold text-xl">
          {{ selectedMinutes }}
        </div>
        <span class="text-gray-700 font-medium">Minutos</span>
      </div>
      
      <!-- Slider -->
      <div class="relative">
        <input
          type="range"
          min="100"
          max="2000"
          step="50"
          [value]="selectedMinutes"
          (input)="onMinutesChange($event)"
          class="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer slider"
        />
      </div>
    </div>

    <!-- Contenido principal -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-0 max-w-3xl mx-auto">
      <!-- Sección izquierda - Recuadro del plan (blanco) -->
      <div class="bg-white rounded-2xl lg:rounded-l-2xl lg:rounded-r-none p-6 border border-gray-200 lg:border-r-0">
        <div class="space-y-4">
          <div>
            <span class="text-sm text-gray-500">{{ selectedPlan?.targetAudience }}</span>
            <h3 class="text-2xl font-bold text-blue-900 mt-1">{{ selectedPlan?.name }}</h3>
            <p class="text-gray-600 mt-2 text-sm">{{ selectedPlan?.description }}</p>
          </div>
          
          <div class="flex items-baseline gap-2">
            <span class="text-4xl font-bold text-blue-900">${{ selectedPlan?.price }}</span>
            <span class="text-gray-500 text-sm">/monthly</span>
          </div>
          
          <button
            (click)="getStarted()"
            class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200"
          >
            Get started
          </button>
        </div>
      </div>

      <!-- Sección derecha - Características incluidas (gris claro) -->
      <div class="bg-gray-100 rounded-2xl lg:rounded-r-2xl lg:rounded-l-none p-6 border border-gray-200 lg:border-l-0">
        <h4 class="text-xl font-bold text-gray-800 mb-4">What's included</h4>
        
        <div class="space-y-3">
          <div *ngFor="let feature of selectedPlan?.features" class="flex items-center gap-3">
            <div class="flex-shrink-0 w-5 h-5 bg-blue-900 rounded-full flex items-center justify-center">
              <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
              </svg>
            </div>
            <span class="text-gray-700 text-sm">{{ feature }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Botón de regreso -->
    <div class="mt-8 flex justify-start">
      <button
        (click)="goBack()"
        class="text-gray-500 hover:text-gray-700 font-medium transition-colors duration-200 flex items-center gap-1"
      >
        <span>←</span> Volver
      </button>
    </div>
  </div>
</div>
