<div
  class="home-container w-full max-h-screen max-w-7xl mx-auto px-2 sm:px-4 py-4 flex flex-col gap-6 overflow-y-auto"
>
  <!-- Gráficas superiores -->
  <div
    class="charts-containert grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"
  >
    <app-home-chart
      [chartLabel]="'Total de Llamadas Realizadas'"
      [chartData]="chartsInfo.totalCalls"
      [chartIndex]="0"
    ></app-home-chart>
    <app-home-chart
      [chartLabel]="'Duración Media de Llamadas'"
      [chartData]="chartsInfo.callsDuration"
      [chartIndex]="1"
    ></app-home-chart>
    <app-home-chart
      [chartLabel]="'Tiempo ahorrado'"
      [chartData]="chartsInfo.timeSaved"
      [chartIndex]="2"
    ></app-home-chart>
  </div>

  <!-- Info agente y volumen de llamadas -->
  <div
    class="agent_and_total flex flex-col xl:flex-row gap-6 w-full flex-1 xl:max-h-screen"
  >
    <!-- Gráfica volumen de llamadas -->
    <div
      class="principal-chart-container flex-1 bg-white rounded-xl shadow p-4 flex flex-col items-center mb-4 xl:mb-0 max-h-[300px] xl:max-h-[65vh] overflow-y-auto"
    >
      <div class="volume-of-calls flex items-center gap-2 mb-2">
        <div class="svg">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="20px"
            viewBox="0 -960 960 960"
            width="10px"
            fill="#75FB4C"
          >
            <path
              d="M480.28-96Q401-96 331-126t-122.5-82.5Q156-261 126-330.96t-30-149.5Q96-560 126-629.5q30-69.5 82.5-122T330.96-834q69.96-30 149.5-30t149.04 30q69.5 30 122 82.5T834-629.28q30 69.73 30 149Q864-401 834-331t-82.5 122.5Q699-156 629.28-126q-69.73 30-149 30Zm-.28-72q130 0 221-91t91-221q0-130-91-221t-221-91q-130 0-221 91t-91 221q0 130 91 221t221 91Zm0 0q-130 0-221-91t-91-221q0-130 91-221t221-91q130 0 221 91t91 221q0 130-91 221t-221 91Z"
            />
          </svg>
        </div>
        <p class="font-semibold text-base">Volumen de Llamadas Realizadas</p>
      </div>
      <div class="chart-wrapper w-full max-w-xl" *ngIf="isChartReady">
        <apx-chart
          [series]="chartOptions.series!"
          [chart]="chartOptions.chart!"
          [xaxis]="chartOptions.xaxis!"
          [yaxis]="chartOptions.yaxis!"
          [dataLabels]="chartOptions.dataLabels!"
          [stroke]="chartOptions.stroke!"
          [grid]="chartOptions.grid!"
          [colors]="chartOptions.colors!"
        ></apx-chart>
      </div>
    </div>

    <!-- Info del agente -->
    <div
      class="agent flex-1 bg-white rounded-xl shadow p-4 flex flex-col items-center max-h-[600px] xl:max-h-[65vh] overflow-y-auto"
    >
      <div class="agent-description flex flex-col items-center mb-4">
        <img
          [src]="userStorage.user()?.agent?.photoUrl"
          alt=""
          class="w-20 h-20 rounded-full object-cover mb-2"
        />
        <p class="agent-name font-bold text-lg">
          {{ userStorage.user()?.agent?.name }}
        </p>
        <p class="agent-ia text-gray-500 text-sm">Tu agente telefónico IA</p>
      </div>

      <div class="agent-info w-full flex flex-col gap-2">
        <div class="agent-info-line flex items-center gap-3">
          <div class="logo">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="20px"
              viewBox="0 -960 960 960"
              width="20px"
              fill="#000000"
            >
              <path
                d="m476-80 182-480h84L924-80h-84l-43-122H603L560-80h-84ZM160-200l-56-56 202-202q-35-35-63.5-80T190-640h84q20 39 40 68t48 58q33-33 68.5-92.5T484-720H40v-80h280v-80h80v80h280v80H564q-21 72-63 148t-83 116l96 98-30 82-122-125-202 201Zm468-72h144l-72-204-72 204Z"
              />
            </svg>
          </div>
          <div>
            <p class="text-title font-semibold">Idioma</p>
            <p class="text-info text-gray-600">Español</p>
          </div>
        </div>
        <div class="agent-info-line flex items-center gap-3">
          <div class="logo">
            <ng-container *ngIf="isConnected(); else disconnected">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="20px"
                viewBox="0 -960 960 960"
                width="20px"
                fill="#75FB4C"
              >
                <path
                  d="M480-280q83 0 141.5-58.5T680-480q0-83-58.5-141.5T480-680q-83 0-141.5 58.5T280-480q0 83 58.5 141.5T480-280Zm0 200q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"
                />
              </svg>
            </ng-container>
            <ng-template #disconnected>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="20px"
                viewBox="0 -960 960 960"
                width="20px"
                fill="#EA3323"
              >
                <path
                  d="M480-280q83 0 141.5-58.5T680-480q0-83-58.5-141.5T480-680q-83 0-141.5 58.5T280-480q0 83 58.5 141.5T480-280Zm0 200q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"
                />
              </svg>
            </ng-template>
          </div>
          <div>
            <p class="text-title font-semibold">
              {{
                isConnected() ? "Conectado (Twilio)" : "Desconectado (Twilio)"
              }}
            </p>
            <p class="text-info text-gray-600">{{ phoneNumber() }}</p>
          </div>
        </div>
        <div class="agent-info-line flex items-center gap-3">
          <div class="logo">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="20px"
              fill="#000000"
            >
              <path
                d="M798-120q-125 0-247-54.5T329-329Q229-429 174.5-551T120-798q0-18 12-30t30-12h162q14 0 25 9.5t13 22.5l26 140q2 16-1 27t-11 19l-97 98q20 37 47.5 71.5T387-386q31 31 65 57.5t72 48.5l94-94q9-9 23.5-13.5T670-390l138 28q14 4 23 14.5t9 23.5v162q0 18-12 30t-30 12ZM241-600l66-66-17-94h-89q5 41 14 81t26 79Zm358 358q39 17 79.5 27t81.5 13v-88l-94-19-67 67ZM241-600Zm358 358Z"
              />
            </svg>
          </div>
          <div>
            <p class="text-title font-semibold">Tipo de Llamada</p>
            <p class="text-info text-gray-600">Outbound</p>
          </div>
        </div>
      </div>

      <button mat-flat-button class="custom-flat-button mt-6 w-full max-w-xs">
        Personalizar
      </button>
    </div>
  </div>
</div>
