<div class="shopify-onboarding min-h-screen flex relative overflow-hidden">
  <!-- Fondo: nubes azules oscuras grandes que se mueven por toda la pantalla -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="cloud cloud-5"></div>
    <div class="cloud cloud-6"></div>
  </div>

  <!-- Izquierda 50%: tamaño medio (ni muy grande ni muy pequeño) -->
  <div class="w-1/2 flex flex-col items-start p-24 relative z-10 min-h-screen">
    <div class="fade-in-up flex items-center gap-2 mb-5" style="animation-delay: 0.1s">
      <img src="assets/logo_azul.webp" alt="Llamalo" class="h-8 w-auto object-contain dark:hidden" />
      <img src="assets/logo_blanco.webp" alt="Llamalo" class="h-8 w-auto object-contain hidden dark:block" />
    </div>
    <div class="fade-in-up flex gap-2 mb-8 w-full max-w-sm" style="animation-delay: 0.2s">
      <span class="h-1 flex-1 rounded-full bg-gray-900 dark:bg-[#ffffff]"></span>
      <span class="h-1 flex-1 rounded-full bg-gray-300 dark:bg-gray-600"></span>
      <span class="h-1 flex-1 rounded-full bg-gray-300 dark:bg-gray-600"></span>
      <span class="h-1 flex-1 rounded-full bg-gray-300 dark:bg-gray-600"></span>
    </div>
    <h1 class="fade-in-up text-3xl md:text-4xl font-semibold text-gray-900 dark:text-white leading-tight max-w-lg mb-3" style="animation-delay: 0.3s">
      Conecta tu cuenta de Shopify
    </h1>
    <p class="fade-in-up text-gray-600 dark:text-gray-400 mb-6 max-w-lg text-sm" style="animation-delay: 0.4s">
      Introduce los datos de tu tienda para vincularla con Llamalo y empezar a configurar tu agente.
    </p>
    <div class="fade-in-up flex flex-col gap-4 w-full max-w-lg" style="animation-delay: 0.5s">
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-900 dark:text-white">Nombre de la tienda</label>
        <input type="text" placeholder="Ej. Mi Tienda" class="w-full px-4 py-5 rounded-xl border border-gray-300 dark:border-white bg-transparent outline-none transition text-base" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-900 dark:text-white">Dominio de Shopify</label>
        <input type="text" placeholder="Ej. mi-tienda.myshopify.com" class="w-full px-4 py-5 rounded-xl border border-gray-300 dark:border-white bg-transparent outline-none transition text-base" />
      </div>
    </div>

    <!-- Botones abajo del todo -->
    <div class="fade-in-up flex gap-3 mt-auto pt-8 w-full max-w-lg" style="animation-delay: 0.6s">
      <button type="button" (click)="goBack()" class="px-5 py-2.5 rounded-xl bg-[#414141] text-gray-700 dark:text-gray-300 font-medium text-sm hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
        Volver
      </button>
      <button type="button" (click)="goToConnectShopify()" class="btn-continuar-shopify px-5 py-2.5 rounded-xl bg-[#1B2559] dark:bg-white text-white dark:text-white font-medium text-sm hover:bg-[#0a1740]  transition-colors">
        Continuar
      </button>
    </div>
  </div>

  <!-- Derecha 50%: recuadro gris (animación fade-in desde abajo) -->
  <div class="w-1/2 flex flex-col min-h-screen box-border p-24 relative z-10">
    <div class="fade-in-up w-full h-[calc(100vh-12rem)] min-h-0 rounded-2xl bg-gray-200 dark:bg-gray-700 shadow-xl overflow-hidden" style="animation-delay: 0.25s">
      <img src="assets/foto_shopify.jpg" alt="Shopify" class="w-full h-full object-cover" />
    </div>
  </div>
</div>
