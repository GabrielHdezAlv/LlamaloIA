<div
  class="min-h-screen flex flex-col px-4 relative overflow-hidden bg-black text-slate-100 font-['Inter',system-ui,-apple-system,sans-serif]"
>
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_40%,rgba(0,0,0,0)_0,rgba(0,0,0,0)_32%,rgba(0,0,0,0.85)_48%,#000_70%,#000_100%),url('/assets/gauze-08.webp')] bg-center bg-cover"
  ></div>

  <div class="flex-1 flex items-center justify-center">
    <div
      class="relative z-10 max-w-3xl w-full text-center px-4 sm:px-8 py-10 sm:py-14"
    >
      <div class="flex justify-center mb-6">
        <img
          src="assets/logo_blanco.webp"
          alt="Llamalo"
          class="h-8 sm:h-9 w-auto drop-shadow-[0_0_18px_rgba(255,255,255,0.22)]"
        />
      </div>

      <div
        class="text-[100px] sm:text-[140px] leading-none font-bold tracking-tight text-transparent bg-gradient-to-b from-white via-white/95 to-white/80 bg-clip-text [filter:drop-shadow(0_0_28px_rgba(255,255,255,0.35))_drop-shadow(0_0_60px_rgba(255,255,255,0.15))]"
      >
        403
      </div>
      <h1
        class="text-2xl sm:text-3xl md:text-4xl font-bold mt-2 text-white/95"
      >
        {{ t.forbiddenTitle }}
      </h1>
      <p
        class="mt-4 text-sm sm:text-base text-white/75 max-w-md mx-auto leading-relaxed"
      >
        {{ t.forbiddenDescription }}
      </p>

      <div
        class="flex flex-col sm:flex-row items-center justify-center gap-3 mt-10"
      >
        <a
          routerLink="/dashboard/home"
          class="inline-flex items-center justify-center rounded-full px-8 py-3 text-sm font-semibold bg-white/95 text-slate-950 shadow-lg ring-1 ring-white/20 transition hover:-translate-y-px"
        >
          {{ t.forbiddenCtaHome }}
        </a>
        <a
          routerLink="/login"
          class="inline-flex items-center justify-center rounded-full px-8 py-3 text-sm font-semibold border border-white/30 text-white hover:bg-white/10 transition"
        >
          {{ t.forbiddenCtaLogin }}
        </a>
      </div>
    </div>
  </div>
</div>
