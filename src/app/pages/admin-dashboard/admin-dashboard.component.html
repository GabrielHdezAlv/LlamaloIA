<div
  class="dashboard admin-theme-transition flex flex-col xl:flex-row xl:max-h-screen overflow-y-hidden"
>
  <!-- Sidebar Desktop (solo visible en xl) -->
  <div 
    [class]="'hidden xl:block w-full xl:overflow-visible p-0 h-screen bg-white transition-all duration-500 ease-in-out flex-shrink-0 dark:bg-slate-900 ' + (isNavCollapsed ? 'xl:w-24' : 'xl:w-72')"
  >
    <app-admin-nav #navComponent></app-admin-nav>
  </div>

  <!-- Sidebar Mobile/Tablet -->
  <div 
    *ngIf="showMobileSidebar"
    class="xl:hidden fixed inset-0 z-50 flex"
  >
    <!-- Overlay -->
    <div 
      class="fixed inset-0 bg-black bg-opacity-50 mobile-overlay-enter"
      (click)="closeMobileSidebar()"
    ></div>
    
    <!-- Sidebar -->
    <div class="relative w-80 bg-white shadow-xl flex flex-col h-full overflow-hidden mobile-sidebar-enter dark:bg-slate-900">
      <!-- Logo -->
      <div class="flex items-center gap-2 px-6 pt-5 pb-5">
        <img src="assets/logo.webp" alt="Llamalo Logo" class="h-10 block dark:hidden" />
        <img src="assets/logo_blanco.webp" alt="Llamalo Logo" class="h-10 hidden dark:block" />
        <div class="flex flex-col leading-tight">
          <span class="brand-font text-3xl font-bold text-blue-950 tracking-[-2px] dark:text-white">Admin</span>
          <span class="brand-font text-[8px] text-end text-gray-500 font-bold -mt-0.5 block dark:text-slate-300">Panel</span>
        </div>
      </div>

      <!-- Botón cerrar -->
      <button 
        (click)="closeMobileSidebar()"
        class="absolute top-5 right-5 p-1.5 text-gray-400 hover:text-gray-700 hover:bg-white rounded-full transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Navigation -->
      <nav class="flex-1 px-6 py-4 space-y-3 font-semibold text-base overflow-hidden bg-white dark:bg-slate-900">
        <a 
          routerLink="/admin/home"
          (click)="closeMobileSidebar()"
          routerLinkActive="text-blue-950 font-bold"
          [routerLinkActiveOptions]="{exact: true}"
          class="flex items-center gap-3 px-0 py-2 rounded-lg transition text-gray-600 hover:text-blue-950 hover:bg-white"
        >
          <svg width="20" height="20" viewBox="0 0 20 17" fill="currentColor">
            <path d="M8.0001 16V11H12.0001V16C12.0001 16.55 12.4501 17 13.0001 17H16.0001C16.5501 17 17.0001 16.55 17.0001 16V8.99997H18.7001C19.1601 8.99997 19.3801 8.42997 19.0301 8.12997L10.6701 0.599971C10.2901 0.259971 9.7101 0.259971 9.3301 0.599971L0.970098 8.12997C0.630098 8.42997 0.840098 8.99997 1.3001 8.99997H3.0001V16C3.0001 16.55 3.4501 17 4.0001 17H7.0001C7.5501 17 8.0001 16.55 8.0001 16Z" />
          </svg>
          <span>Dashboard</span>
        </a>

        <a 
          routerLink="/admin/users"
          (click)="closeMobileSidebar()"
          routerLinkActive="text-blue-950 font-bold"
          class="flex items-center gap-3 px-0 py-2 rounded-lg transition text-gray-600 hover:text-blue-950 hover:bg-white"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" />
          </svg>
          <span>Usuarios</span>
        </a>

        <a 
          routerLink="/admin/analytics"
          (click)="closeMobileSidebar()"
          routerLinkActive="text-blue-950 font-bold"
          class="flex items-center gap-3 px-0 py-2 rounded-lg transition text-gray-600 hover:text-blue-950 hover:bg-white"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V5H19V19ZM7 10H9V17H7V10ZM11 7H13V17H11V7ZM15 13H17V17H15V13Z" />
          </svg>
          <span>Analíticas</span>
        </a>

        <a 
          routerLink="/admin/settings"
          (click)="closeMobileSidebar()"
          routerLinkActive="text-blue-950 font-bold"
          class="flex items-center gap-3 px-0 py-2 rounded-lg transition text-gray-600 hover:text-blue-950 hover:bg-white"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14 12.94C19.18 12.64 19.2 12.33 19.2 12C19.2 11.67 19.18 11.36 19.14 11.06L21.16 9.48C21.34 9.33 21.4 9.08 21.3 8.87L19.3 5.33C19.2 5.12 18.97 5.02 18.75 5.08L16.26 5.84C15.87 5.5 15.43 5.22 14.96 5.02L14.64 2.42C14.61 2.19 14.43 2 14.2 2H9.8C9.57 2 9.39 2.19 9.36 2.42L9.04 5.02C8.57 5.22 8.13 5.5 7.74 5.84L5.25 5.08C5.03 5.02 4.8 5.12 4.7 5.33L2.7 8.87C2.6 9.08 2.66 9.33 2.84 9.48L4.86 11.06C4.82 11.36 4.8 11.67 4.8 12C4.8 12.33 4.82 12.64 4.86 12.94L2.84 14.52C2.66 14.67 2.6 14.92 2.7 15.13L4.7 18.67C4.8 18.88 5.03 18.98 5.25 18.92L7.74 18.16C8.13 18.5 8.57 18.78 9.04 18.98L9.36 21.58C9.39 21.81 9.57 22 9.8 22H14.2C14.43 22 14.61 21.81 14.64 21.58L14.96 18.98C15.43 18.78 15.87 18.5 16.26 18.16L18.75 18.92C18.97 18.98 19.2 18.88 19.3 18.67L21.3 15.13C21.4 14.92 21.34 14.67 21.16 14.52L19.14 12.94ZM12 15.6C10.02 15.6 8.4 13.98 8.4 12C8.4 10.02 10.02 8.4 12 8.4C13.98 8.4 15.6 10.02 15.6 12C15.6 13.98 13.98 15.6 12 15.6Z" />
          </svg>
          <span>Configuración</span>
        </a>
      </nav>

      <!-- Sección inferior -->
      <div class="px-6 pb-5 space-y-4">
        <!-- Perfil -->
        <div class="pt-2">
          <div class="flex items-center gap-3">
            <img [src]="getUserProfileImage()" class="h-10 w-10 rounded-full object-cover" alt="Perfil" />
            <div class="flex-1">
              <p class="font-semibold text-sm text-gray-900 dark:text-slate-50">{{ userName() }}</p>
              <p class="text-xs text-gray-500 dark:text-slate-400">Administrador</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div 
    class="flex-1 px-2 py-4 overflow-x-auto bg-gray-100 transition-all duration-500 ease-in-out min-h-screen dark:bg-gray-800"
  >
    <topbar></topbar>
    <router-outlet></router-outlet>
  </div>
</div>
