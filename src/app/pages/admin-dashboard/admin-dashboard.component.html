<div class="dashboard admin-theme-transition flex flex-col xl:flex-row xl:max-h-screen overflow-y-hidden">
  <!-- Sidebar Desktop (solo visible en xl) -->
  <div
    [class]="'hidden xl:block w-full xl:overflow-visible p-0 h-screen bg-white transition-all duration-500 ease-in-out flex-shrink-0 dark:bg-slate-900 ' + (isNavCollapsed ? 'xl:w-24' : 'xl:w-72')">
    <app-admin-nav #navComponent></app-admin-nav>
  </div>

  <!-- Sidebar Mobile/Tablet -->
  <div *ngIf="showMobileSidebar" class="xl:hidden fixed inset-0 z-50 flex">
    <!-- Overlay -->
    <div class="fixed inset-0 bg-black bg-opacity-50 mobile-overlay-enter" (click)="closeMobileSidebar()"></div>

    <!-- Sidebar -->
    <div
      class="relative w-80 bg-white shadow-xl flex flex-col h-full overflow-hidden mobile-sidebar-enter dark:bg-slate-900">
      <!-- Logo -->
      <div class="flex items-center gap-2 px-6 pt-5 pb-5">
        <img src="assets/logo.webp" alt="Llamalo Logo" class="h-10 block dark:hidden" />
        <img src="assets/logo_blanco.webp" alt="Llamalo Logo" class="h-10 hidden dark:block" />
        <div class="flex flex-col leading-tight">
          <span class="brand-font text-3xl font-bold text-blue-950 tracking-[-2px] dark:text-white">Admin</span>
          <span
            class="brand-font text-[8px] text-end text-gray-500 font-bold -mt-0.5 block dark:text-slate-300">Panel</span>
        </div>
      </div>

      <!-- Botón cerrar -->
      <button (click)="closeMobileSidebar()"
        class="absolute top-5 right-5 p-1.5 text-gray-400 hover:text-gray-700 hover:bg-white rounded-full transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Navigation -->
      <nav class="flex-1 px-6 py-4 space-y-3 font-semibold text-base overflow-hidden bg-white dark:bg-slate-900">
        <a routerLink="/admin/home" (click)="closeMobileSidebar()" routerLinkActive="text-blue-950 font-bold"
          [routerLinkActiveOptions]="{exact: true}"
          class="flex items-center gap-3 px-0 py-2 rounded-lg transition text-gray-600 hover:text-blue-950 hover:bg-white">
          <svg width="20" height="20" viewBox="0 0 20 17" fill="currentColor">
            <path
              d="M8.0001 16V11H12.0001V16C12.0001 16.55 12.4501 17 13.0001 17H16.0001C16.5501 17 17.0001 16.55 17.0001 16V8.99997H18.7001C19.1601 8.99997 19.3801 8.42997 19.0301 8.12997L10.6701 0.599971C10.2901 0.259971 9.7101 0.259971 9.3301 0.599971L0.970098 8.12997C0.630098 8.42997 0.840098 8.99997 1.3001 8.99997H3.0001V16C3.0001 16.55 3.4501 17 4.0001 17H7.0001C7.5501 17 8.0001 16.55 8.0001 16Z" />
          </svg>
          <span>Dashboard</span>
        </a>

        <a routerLink="/admin/tokens" (click)="closeMobileSidebar()" routerLinkActive="text-blue-950 font-bold"
          class="flex items-center gap-3 px-0 py-2 rounded-lg transition text-gray-600 hover:text-blue-950 hover:bg-white">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM12 7C13.4 7 14.8 7.6 15.7 8.7L14.2 10.2C13.6 9.5 12.8 9 12 9C10.3 9 9 10.3 9 12C9 13.7 10.3 15 12 15C12.8 15 13.6 14.5 14.2 13.8L15.7 15.3C14.8 16.4 13.4 17 12 17C9.2 17 7 14.8 7 12C7 9.2 9.2 7 12 7Z" />
          </svg>
          <span>Servicios Externos</span>
        </a>

        <a routerLink="/admin/redes-sociales" (click)="closeMobileSidebar()" routerLinkActive="text-blue-950 font-bold"
          class="flex items-center gap-3 px-0 py-2 rounded-lg transition text-gray-600 hover:text-blue-950 hover:bg-white">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z" />
          </svg>
          <span>Redes Sociales</span>
        </a>

        <a routerLink="/admin/agents/edit/1" (click)="closeMobileSidebar()" routerLinkActive="text-blue-950 font-bold"
          class="flex items-center gap-3 px-0 py-2 rounded-lg transition text-gray-600 hover:text-blue-950 hover:bg-white">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM11 11.41V7H13V11L16 13L15.3 14.2L11 11.41Z" />
          </svg>
          <span>Editor Agente</span>
        </a>
      </nav>

      <!-- Sección inferior -->
      <div class="px-6 pb-5 space-y-4">
        <!-- Perfil -->
        <div class="pt-2">
          <div class="flex items-center gap-3">
            <img [src]="getUserProfileImage()" class="h-10 w-10 rounded-full object-cover" alt="Perfil" />
            <div class="flex-1">
              <p class="font-semibold text-sm text-gray-900 dark:text-slate-50">{{ userName() }}</p>
              <p class="text-xs text-gray-500 dark:text-slate-400">Administrador</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div
    class="flex-1 px-2 py-4 overflow-x-auto bg-gray-100 transition-all duration-500 ease-in-out min-h-screen dark:bg-gray-800">
    <topbar></topbar>
    <router-outlet></router-outlet>
  </div>
</div>
