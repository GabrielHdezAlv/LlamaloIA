<div
  class="min-h-screen p-5 sm:p-6 lg:p-8 xl:p-8 2xl:p-8 3xl:p-10 mt-3 2xl:mt-2 3xl:mt-5 max-lg:p-5 max-lg:mt-2 max-lg:mr-4 max-lg:ml-4 max-w-[76rem] 3xl:max-w-[85rem] mx-auto">

  <div class="flex flex-col sm:flex-row gap-4 sm:gap-6 items-start">
    <!-- Izquierda: 3 cuadrados uno debajo de otro -->
    <div class="flex flex-col gap-2 shrink-0">
      @for (item of items; track item.id) {
        <button
          type="button"
          class="flex flex-col items-center justify-center gap-1 w-[5rem] h-[5rem] sm:w-24 sm:h-24 aspect-square shrink-0 overflow-hidden rounded-lg bg-white dark:bg-black border border-gray-200 dark:border-gray-400 shadow-sm hover:shadow-md hover:border-gray-300 dark:hover:border-slate-700 transition-all cursor-pointer text-gray-700 dark:text-slate-200 p-2">
          <span class="flex items-center justify-center w-6 h-6 sm:w-7 sm:h-7 shrink-0">
            @switch (item.type) {
              @case ('pdf') {
                <svg class="w-5 h-5 sm:w-6 sm:h-6 shrink-0" viewBox="0 0 52 52" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                  <path d="m28.6 11.4h5.1a1.11 1.11 0 0 0 1.1-1.1 1.32 1.32 0 0 0 -.3-.8l-7.2-7.1a.89.89 0 0 0 -.7-.3 1.11 1.11 0 0 0 -1.1 1.1v5.1a3.12 3.12 0 0 0 3.1 3.1z"/>
                  <path d="m49.83 32.45a1.43 1.43 0 0 0 -1.39-1.45h-12a1.43 1.43 0 0 0 -1.44 1.44v1.44a1.43 1.43 0 0 0 1.4 1.44h6.14l-11 11a1.42 1.42 0 0 0 0 2l1 1a1.54 1.54 0 0 0 1.09.45 1.32 1.32 0 0 0 .94-.38l11-11v6a1.43 1.43 0 0 0 1.43 1.44h1.53a1.43 1.43 0 0 0 1.47-1.4z"/>
                  <path d="m18.35 20.68h-1.46v4.93h1.46a1.56 1.56 0 0 0 1.56-1.1 3.93 3.93 0 0 0 .24-1.44 3.61 3.61 0 0 0 -.36-1.77 1.53 1.53 0 0 0 -1.44-.62z"/>
                  <path d="m11.29 20.93a1.27 1.27 0 0 0 -.84-.25h-1.45v2.23h1.46a1.18 1.18 0 0 0 .84-.28 1.09 1.09 0 0 0 .3-.86 1 1 0 0 0 -.33-.84z"/>
                  <path d="m33.24 16h-7.84a4.67 4.67 0 0 1 -4.7-4.6v-7.8a1.42 1.42 0 0 0 -1.34-1.5h-12.56a4.67 4.67 0 0 0 -4.7 4.6v29.4a4.6 4.6 0 0 0 4.62 4.6h17.88v-.1a15.92 15.92 0 0 1 10.2-14.9v-8.1a1.58 1.58 0 0 0 -1.56-1.6zm-20.75 7.65a2.93 2.93 0 0 1 -1.89.56h-1.6v2.71h-1.51v-7.55h3.24a2.64 2.64 0 0 1 1.76.63 2.3 2.3 0 0 1 .66 1.8 2.35 2.35 0 0 1 -.66 1.85zm8.66 1.9a2.73 2.73 0 0 1 -2.53 1.45h-3.26v-7.63h3.26a3.85 3.85 0 0 1 1.17.17 2.49 2.49 0 0 1 1.28.95 3.43 3.43 0 0 1 .54 1.22 5.6 5.6 0 0 1 .14 1.29 5 5 0 0 1 -.6 2.55zm7.92-4.84h-3.81v1.74h3.34v1.31h-3.34v3.16h-1.57v-7.54h5.38z"/>
                </svg>
              }
              @case ('web') {
                <svg class="w-5 h-5 sm:w-6 sm:h-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
              }
              @case ('text') {
                <svg class="w-5 h-5 sm:w-6 sm:h-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                  <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                </svg>
              }
              @default {
                <svg class="w-5 h-5 sm:w-6 sm:h-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                  <path d="M14 2v6h6M12 18v-6M9 15h6"/>
                </svg>
              }
            }
          </span>
          <span class="text-[10px] sm:text-xs font-medium text-gray-700 dark:text-slate-200 text-center leading-tight whitespace-nowrap truncate max-w-full">
            {{ getAddLabel(item.type) }}
          </span>
        </button>
      }
    </div>

    <!-- Derecha: barra de búsqueda (sin borde compartido) + recuadro estado vacío -->
    <div class="flex-1 min-w-0 w-full sm:w-auto flex flex-col gap-3 sm:gap-4">
      <!-- Barra de búsqueda: misma posición que antes, sin recuadro ni borde compartido -->
      <div class="relative w-full">
        <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
          <svg class="w-4 h-4 text-gray-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10.5A6.5 6.5 0 104 10.5a6.5 6.5 0 0013 0z" />
          </svg>
        </span>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          [placeholder]="t.knowledgeBaseSearchPlaceholder"
          class="w-full pl-9 pr-3 py-2 text-sm border border-gray-300 dark:border-slate-800 rounded-lg bg-white dark:bg-[#111113] text-gray-900 dark:text-slate-50 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-gray-400 dark:focus:ring-slate-600 focus:border-gray-400 dark:focus:border-slate-600 transition-colors" />
      </div>
      <!-- Recuadro "no se encontraron documentos" (su propio borde) -->
      <div class="flex-1 min-w-0 rounded-xl bg-gray-100 dark:bg-[#111113] border border-gray-200 dark:border-gray-400 flex flex-col items-center justify-center py-12 sm:py-16 px-6">
        <div class="w-14 h-14 rounded-lg bg-white dark:bg-[#111113] dark:border dark:border-gray-200 flex items-center justify-center shadow-sm mb-4">
          <svg class="w-8 h-8 text-gray-600 dark:text-slate-300 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 3H8.2C7.0799 3 6.51984 3 6.09202 3.21799C5.71569 3.40973 5.40973 3.71569 5.21799 4.09202C5 4.51984 5 5.0799 5 6.2V17.8C5 18.9201 5 19.4802 5.21799 19.908C5.40973 20.2843 5.71569 20.5903 6.09202 20.782C6.51984 21 7.0799 21 8.2 21H12M13 3L19 9M13 3V7.4C13 7.96005 13 8.24008 13.109 8.45399C13.2049 8.64215 13.3578 8.79513 13.546 8.89101C13.7599 9 14.0399 9 14.6 9H19M19 9V11M9 17H11M9 13H13M9 9H10M19.2686 19.2686L21 21M20 17.5C20 18.8807 18.8807 20 17.5 20C16.1193 20 15 18.8807 15 17.5C15 16.1193 16.1193 15 17.5 15C18.8807 15 20 16.1193 20 17.5Z"/>
          </svg>
        </div>
        <p class="text-base font-semibold text-gray-900 dark:text-white text-center">
          {{ t.knowledgeBaseNoDocuments }}
        </p>
        <p class="mt-1 text-sm text-gray-500 dark:text-slate-400 text-center">
          {{ t.knowledgeBaseNoDocumentsYet }}
        </p>
      </div>
    </div>
  </div>
</div>
