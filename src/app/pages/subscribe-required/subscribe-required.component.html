<div
  class="subscribe-required min-h-[100dvh] flex flex-col bg-slate-50 dark:bg-[#0f172a] text-slate-900 dark:text-white">
  <header
    class="shrink-0 border-b border-slate-200/80 dark:border-slate-700/80 bg-white/90 dark:bg-[#0f172a]/95 backdrop-blur px-4 py-4 sm:py-5">
    <div class="max-w-5xl mx-auto text-center">
      @if (paymentFailedUi()) {
        <h1 class="text-lg sm:text-xl font-bold tracking-tight">
          {{ t.subscribeRequiredPaymentFailedTitle }}
        </h1>
        <p
          class="mt-1.5 text-xs sm:text-sm text-slate-600 dark:text-slate-400 max-w-xl mx-auto">
          {{ t.subscribeRequiredPaymentFailedSubtitle }}
        </p>
      } @else {
        <h1 class="text-lg sm:text-xl font-bold tracking-tight">
          {{ t.billingChurnPageTitle }}
        </h1>
        <p
          class="mt-1.5 text-xs sm:text-sm text-slate-600 dark:text-slate-400 max-w-xl mx-auto">
          {{ t.billingChurnPageSubtitle }}
        </p>
      }
    </div>
  </header>
  <main class="flex-1 flex flex-col min-h-0 overflow-y-auto px-3 py-6 sm:px-6 sm:py-8">
    <div class="w-full max-w-6xl mx-auto flex-1 flex flex-col min-h-0">
      <app-upgrade-plan-pricing-view mode="churn" />
    </div>
  </main>
</div>
