<div
  class="subscribe-required min-h-[100dvh] flex flex-col bg-slate-50 dark:bg-[#111113] text-slate-900 dark:text-white pt-[max(1.25rem,env(safe-area-inset-top))] sm:pt-6">
  <header class="shrink-0 px-4 pb-2 sm:pb-2.5">
    <div class="max-w-5xl mx-auto text-center">
      <h1 class="text-lg sm:text-xl font-bold tracking-tight">
        {{ t.billingChurnPageTitle }}
      </h1>
      <p
        class="mt-1 text-xs sm:text-sm text-slate-600 dark:text-slate-400 max-w-xl mx-auto">
        {{ t.billingChurnPageSubtitle }}
      </p>
    </div>
  </header>
  <main class="flex-1 flex flex-col min-h-0 overflow-y-auto px-3 pt-0 pb-6 sm:px-6 sm:pt-1 sm:pb-8">
    <div class="w-full max-w-6xl mx-auto flex-1 flex flex-col min-h-0">
      <app-upgrade-plan-pricing-view [mode]="pricingViewMode" />
    </div>
  </main>
</div>
