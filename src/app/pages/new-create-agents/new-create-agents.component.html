<!-- Contenedor principal del formulario de creación de agentes -->
<div
  class="w-full flex flex-col bg-gray-100 dark:bg-[#111113] text-black dark:text-slate-50 transition-colors duration-300 overflow-visible">
  <ng-container [ngSwitch]="displayedStep">
    <!-- Paso 1: Nombre del agente -->
    <div
      *ngSwitchCase="'agentName'"
      [ngClass]="isStepFadingOut ? 'step-fade-out' : 'step-fade-in'">
      <app-agent-name-step [agentName]="agentName" [currentStepNumber]="getCurrentStepNumber()"
        [totalSteps]="getTotalSteps()" (agentNameChange)="agentName = $event" (backClicked)="goBack()"
        (continueClicked)="onSubmitAgentName()">
      </app-agent-name-step>
    </div>

    <!-- Paso 2: Tipo de llamada (Inbound / Outbound) -->
    <div
      *ngSwitchCase="'language'"
      [ngClass]="isStepFadingOut ? 'step-fade-out' : 'step-fade-in'">
      <app-call-type-step [selectedCallType]="selectedCallType" [currentStepNumber]="getCurrentStepNumber()"
        [totalSteps]="getTotalSteps()" (callTypeChange)="selectedCallType = $event" (backClicked)="goBack()"
        (continueClicked)="onSkip()">
      </app-call-type-step>
    </div>

    <!-- Paso 3: País y voz -->
    <div
      *ngSwitchCase="'voices'"
      [ngClass]="isStepFadingOut ? 'step-fade-out' : 'step-fade-in'">
      <app-voices-step [selectedCountry]="selectedCountry" [countryOptions]="countryOptions" [voices]="voices"
        [selectedVoiceId]="selectedVoiceId" [currentPlayingVoice]="currentPlayingVoice"
        [voiceParameters]="voiceParameters" [currentStepNumber]="getCurrentStepNumber()" [totalSteps]="getTotalSteps()"
        (countrySelected)="selectCountry($event)" (voiceSelected)="selectVoice($event)"
        (playVoiceClicked)="playVoice($event)" (playVoicePreviewClicked)="playVoicePreview($event.voice, $event.event)"
        (voiceParametersChange)="voiceParameters = $event" (backClicked)="goBack()" (continueClicked)="onSkip()">
      </app-voices-step>
    </div>

    <!-- Paso 4: Conecta tu negocio -->
    <div
      *ngSwitchCase="'connectBusiness'"
      [ngClass]="isStepFadingOut ? 'step-fade-out' : 'step-fade-in'">
      <app-connect-business-step [shopifyConnectedDomain]="shopifyConnectedDomain"
        [currentStepNumber]="getCurrentStepNumber()" [totalSteps]="getTotalSteps()" (backClicked)="goBack()"
        (continueClicked)="onContinueFromConnectBusiness()" (connectShopifyClicked)="goToShopifyOnboarding()">
      </app-connect-business-step>
    </div>

    <!-- Paso 5: Instrucciones -->
    <div
      *ngSwitchCase="'instructions'"
      [ngClass]="isStepFadingOut ? 'step-fade-out' : 'step-fade-in'">
      <app-instructions-step [greeting]="greeting" [instructions]="instructions" [showMakeConfig]="showMakeConfig"
        [isMakeConfigClosing]="isMakeConfigClosing" [makeActionData]="makeActionData"
        [showGeneratePromptModal]="showGeneratePromptModal"
        [isGeneratePromptDropdownClosing]="isGeneratePromptDropdownClosing" [promptDescription]="promptDescription"
        [isGeneratingPrompt]="isGeneratingPrompt" [generatePromptError]="generatePromptError"
        [showExpandInstructionsModal]="showExpandInstructionsModal"
        [isInstructionsModalClosing]="isInstructionsModalClosing" [currentStepNumber]="getCurrentStepNumber()"
        [totalSteps]="getTotalSteps()" (greetingChange)="greeting = $event" (instructionsChange)="instructions = $event"
        (promptDescriptionChange)="promptDescription = $event" (makeActionDataChange)="makeActionData = $event"
        (backClicked)="goBack()" (continueClicked)="onSubmit()" (toggleMakeConfigClicked)="toggleMakeConfig()"
        (saveMakeActionClicked)="onSaveMakeAction()" (toggleGeneratePromptClicked)="toggleGeneratePromptDropdown()"
        (generatePromptClicked)="generatePrompt()" (closeGeneratePromptClicked)="closeGeneratePromptModal()"
        (openExpandInstructionsClicked)="openExpandInstructionsModal()"
        (closeExpandInstructionsClicked)="closeExpandInstructionsModal()">
      </app-instructions-step>
    </div>

    <!-- Paso 6: Base de conocimientos -->
    <div
      *ngSwitchCase="'knowledgeBase'"
      [ngClass]="isStepFadingOut ? 'step-fade-out' : 'step-fade-in'">
      <app-knowledge-base-step [currentStepNumber]="getCurrentStepNumber()" [totalSteps]="getTotalSteps()"
        (sourceSelected)="onSourceSelected($event)" (backClicked)="goBack()"
        (continueClicked)="onKnowledgeBaseContinue($event)"></app-knowledge-base-step>
    </div>

    <!-- Paso 7: Prueba de agente -->
    <div
      *ngSwitchCase="'summary'"
      [ngClass]="isStepFadingOut ? 'step-fade-out' : 'step-fade-in'">
      <app-test-agent-step [currentStepNumber]="getCurrentStepNumber()" [totalSteps]="getTotalSteps()"
        [agentInstruction]="instructions" [firstInteraction]="greeting" [language]="selectedCountry"
        [agentName]="agentName" [voiceId]="selectedVoiceId" [voiceParameters]="voiceParameters"
        [shopifyDomain]="shopifyConnectedDomain ?? undefined"
        (backClicked)="goBack()"
        (continueClicked)="onSubmitTestCall()">
      </app-test-agent-step>
    </div>

    <!-- Paso 8: Conecta tu número de teléfono (Twilio) -->
    <div
      *ngSwitchCase="'connectPhone'"
      [ngClass]="isStepFadingOut ? 'step-fade-out' : 'step-fade-in'">
      <app-connect-phone-step [currentStepNumber]="getCurrentStepNumber()" [totalSteps]="getTotalSteps()"
        [showTwilioConfig]="showTwilioConfig" [loadingTwilioAccounts]="loadingTwilioAccounts"
        [isTwilioValidated]="isTwilioValidated" [isValidatingTwilio]="isValidatingTwilio" [twilioSid]="twilioSid"
        [twilioToken]="twilioToken" [twilioSidValidationStatus]="twilioSidValidationStatus"
        [twilioTokenValidationStatus]="twilioTokenValidationStatus" [twilioErrorMessage]="twilioErrorMessage"
        [selectedTwilioAccount]="selectedTwilioAccount" [twilioAccounts]="twilioAccounts"
        [showNewTwilioAccountForm]="showNewTwilioAccountForm" [availablePhoneNumbers]="availablePhoneNumbers"
        [phoneNumber]="phoneNumber" [selectedCountryCode]="selectedCountryCode"
        [phoneValidationStatus]="phoneValidationStatus" [phoneErrorMessage]="phoneErrorMessage"
        [canContinueFromConnections]="canContinueFromConnections" (backClicked)="goBack()"
        (continueClicked)="onContinueFromConnections()" (toggleTwilioConfigClicked)="toggleTwilioConfig()"
        (twilioSidChange)="twilioSid = $event; onTwilioSidChange()"
        (twilioTokenChange)="twilioToken = $event; onTwilioTokenChange()"
        (validateTwilioConfigClicked)="validateTwilioConfig()"
        (useExistingTwilioAccountClicked)="useExistingTwilioAccount($event)"
        (showNewTwilioAccountClicked)="showNewTwilioAccount()"
        (backToAccountSelectionClicked)="backToAccountSelection()"
        (phoneNumberChange)="phoneNumber = $event; onPhoneNumberChange()"
        (selectedCountryCodeChange)="selectedCountryCode = $event; onPhoneNumberChange()"
        (phoneNumberSelected)="onPhoneNumberSelected($event)" (validatePhoneNumberClicked)="validatePhoneNumber()">
      </app-connect-phone-step>
    </div>

    <!-- Paso 9: Agente creado correctamente -->
    <div
      *ngSwitchCase="'success'"
      [ngClass]="isStepFadingOut ? 'step-fade-out' : 'step-fade-in'">
      <app-success-step (goToAgentsClicked)="goToAgents()">
      </app-success-step>
    </div>
  </ng-container>
</div>
