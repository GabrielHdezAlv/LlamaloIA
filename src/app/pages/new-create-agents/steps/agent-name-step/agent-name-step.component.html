<div
  class="w-full h-full bg-transparent flex items-center justify-center overflow-hidden mx-auto max-w-4xl 3xl:max-w-7xl pt-8 sm:pt-12 3xl:pt-14">
  <div
    class="w-full max-w-[500px] sm:max-w-[600px] md:max-w-[720px] xl:max-w-[700px] 3xl:max-w-[800px] flex flex-col px-5 sm:px-6 md:px-7 xl:px-6 3xl:px-8">
    <div class="flex items-center justify-between w-full">
      <h1 class="text-lg xl:text-sm 3xl:text-2xl font-bold text-[#0F172A] dark:text-white leading-tight">
        {{ t.completeAgent }}
      </h1>
      <span class="text-xs xl:text-[10px] 3xl:text-sm font-normal text-[#0F172A] dark:text-white leading-tight"
        *ngIf="getCurrentStepNumber() > 0">
        {{ getCurrentStepNumber() }}/{{ getTotalSteps() }}
      </span>
    </div>
    <p class="mt-1 3xl:mt-0.5 text-sm xl:text-xs 3xl:text-base text-[#6d747c] font-semibold">
      {{ t.chooseAgentNameDesc }}
    </p>

    <div class="w-full flex flex-col mt-4 xl:mt-3 3xl:mt-3">
      <label
        class="block text-sm xl:text-xs 3xl:text-base font-semibold text-[#0F172A] dark:text-white mb-2 xl:mb-1.5 3xl:mb-1.5">
        {{ t.agentNameLabel }}
      </label>
      <div class="relative">
        <input type="text" [ngModel]="agentName" (ngModelChange)="onAgentNameInput($event)" [maxlength]="50"
          [placeholder]="t.agentNamePlaceholder"
          class="w-full px-4 xl:px-3.5 3xl:px-4 py-3 xl:py-2 3xl:py-2.5 text-sm xl:text-xs 3xl:text-sm border border-gray-300 dark:border-slate-600 dark:bg-transparent rounded-lg xl:rounded-md 3xl:rounded-lg text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-[#6d747c] focus:ring-1 focus:ring-black focus:border-transparent dark:focus:ring-white dark:focus:border-transparent outline-none transition" />
        <span
          class="absolute right-3 xl:right-2 3xl:right-4 top-1/2 -translate-y-1/2 text-xs xl:text-[11px] 3xl:text-xs text-gray-400 dark:text-[#6d747c]">
          {{ agentName.length }}/50
        </span>
      </div>
    </div>

    <div class="w-full flex items-center justify-between mt-4 3xl:mt-4 nav-buttons-mobile">
      <button type="button"
        class="flex items-center gap-0.5 3xl:gap-1 text-slate-600 dark:text-slate-300 hover:text-slate-800 border border-gray-300 dark:border-slate-600 dark:hover:text-slate-100 transition-colors px-1.5 3xl:px-3 py-0.5 3xl:py-1.5 text-[9px] sm:text-[10px] 3xl:text-base rounded-[5px] 3xl:rounded-lg bg-transparent dark:bg-transparen"
        (click)="backClicked.emit()">
        <span class="text-xs 3xl:text-lg leading-none">‹</span>
        <span>{{ t.back }}</span>
      </button>
      <button type="button" [disabled]="!agentName.trim()" [class.opacity-50]="!agentName.trim()"
        [class.cursor-not-allowed]="!agentName.trim()"
        class="px-2.5 3xl:px-5 py-0.5 3xl:py-1.5 text-[9px] sm:text-[10px] 3xl:text-base rounded-[5px] 3xl:rounded-lg bg-[#1E3A8A] hover:bg-[#1E40AF] text-white font-medium transition-colors disabled:hover:bg-[#1E3A8A] dark:bg-white dark:text-[#000000] dark:hover:bg-white"
        (click)="continueClicked.emit()">
        {{ t.continue }}
      </button>
    </div>
  </div>
</div>
