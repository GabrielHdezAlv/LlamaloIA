<div
  class="w-full min-h-[calc(100dvh-7rem)] xl:min-h-[calc(100dvh-8rem)] bg-transparent flex flex-col items-center justify-center overflow-x-hidden mx-auto max-w-4xl 3xl:max-w-7xl py-8 sm:py-10">
  <div
    class="w-full max-w-[500px] sm:max-w-[600px] md:max-w-[720px] xl:max-w-[700px] 3xl:max-w-[800px] flex flex-col px-5 sm:px-6 md:px-7 xl:px-6 3xl:px-8 items-center text-center -translate-y-6 sm:-translate-y-8">
    <!-- Icono de éxito -->
    <div
      class="success-icon-circle w-16 h-16 sm:w-20 sm:h-20 3xl:w-24 3xl:h-24 rounded-full bg-[#1B2559] dark:bg-green-600 flex items-center justify-center mb-4 3xl:mb-6 shadow-md shadow-[#1B2559]/30 dark:shadow-green-900/25">
      <svg class="w-10 h-10 sm:w-12 sm:h-12 3xl:w-14 3xl:h-14 text-white" fill="none"
        stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h1 class="text-lg sm:text-xl 3xl:text-2xl font-bold text-[#0F172A] dark:text-white leading-tight mb-2 3xl:mb-3">
      {{ t.agentCreatedSuccessfully }}
    </h1>
    <p class="text-xs sm:text-sm 3xl:text-base text-[#6d747c] dark:text-slate-400 font-medium mb-6 3xl:mb-8">
      {{ t.agentReadyDescription }}
    </p>

    <button type="button"
      class="w-full px-4 3xl:px-6 py-2.5 3xl:py-3 text-sm 3xl:text-base font-semibold rounded-lg 3xl:rounded-xl bg-[#1B2559] hover:bg-[#131a3f] text-white transition-colors dark:bg-white dark:text-[#000000] dark:hover:bg-white"
      (click)="goToAgentsClicked.emit()">
      {{ t.backToAgents }}
    </button>
  </div>
</div>
