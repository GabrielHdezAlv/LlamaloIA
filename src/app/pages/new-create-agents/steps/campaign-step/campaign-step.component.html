<div
  class="w-full h-full bg-transparent flex items-center justify-center 4xl:items-start 4xl:justify-center overflow-hidden mx-auto max-w-4xl 3xl:max-w-7xl pt-8 sm:pt-12 3xl:pt-14 4xl:pt-56">
  <div
    class="w-full max-w-[500px] sm:max-w-[600px] md:max-w-[720px] xl:max-w-[700px] 3xl:max-w-[800px] flex flex-col px-5 sm:px-6 md:px-7 xl:px-6 3xl:px-8">
    <div class="flex items-center justify-between w-full">
      <h1 class="text-lg xl:text-sm 3xl:text-2xl font-bold text-[#0F172A] dark:text-white leading-tight">
        {{ t.outboundCampaignStepTitle }}
      </h1>
      <span class="text-xs xl:text-[10px] 3xl:text-sm font-normal text-[#0F172A] dark:text-white leading-tight"
        *ngIf="getCurrentStepNumber() > 0">
        {{ getCurrentStepNumber() }}/{{ getTotalSteps() }}
      </span>
    </div>
    <p class="mt-0.5 3xl:mt-0.5 text-sm xl:text-[10px] 3xl:text-base text-[#6d747c] font-semibold">
      {{ t.outboundCampaignStepSubtitle }}
    </p>

    <div class="grid grid-cols-2 gap-4 xl:gap-3 3xl:gap-5 mt-4 xl:mt-3 3xl:mt-4">
      @for (kind of campaignOrder; track kind) {
      <button type="button" (click)="onSelect(kind)" [ngClass]="{
          'ring-2 ring-blue-500 dark:ring-white border-blue-500 dark:border-white':
            selectedCampaign === kind,
        }"
        class="w-full min-h-[4.5rem] sm:min-h-[5rem] xl:min-h-[4.25rem] 3xl:min-h-[5.25rem] rounded-xl xl:rounded-lg 3xl:rounded-xl border border-gray-300 dark:border-white bg-transparent flex items-center justify-center cursor-pointer hover:border-gray-400 dark:hover:border-white transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-white px-3 py-3 3xl:px-4 3xl:py-4">
        <span
          class="text-center text-sm xl:text-[11px] 3xl:text-base font-medium text-gray-900 dark:text-white leading-snug"
          [class.text-blue-600]="selectedCampaign === kind"
          [class.dark:text-blue-400]="selectedCampaign === kind">
          {{ campaignLabel(kind) }}
        </span>
      </button>
      }
    </div>

    <div class="w-full flex items-center justify-between mt-5 3xl:mt-8 nav-buttons-mobile">
      <button type="button"
        class="flex items-center gap-0.5 3xl:gap-1 text-slate-600 dark:text-slate-300 hover:text-slate-800 dark:hover:text-slate-100 transition-colors px-2 3xl:px-3 py-1 3xl:py-1.5 text-[10px] sm:text-xs 3xl:text-base rounded-md 3xl:rounded-lg bg-transparent border border-gray-300 dark:border-slate-600"
        (click)="backClicked.emit()">
        <span class="text-xs 3xl:text-lg leading-none">‹</span>
        <span>{{ t.back }}</span>
      </button>
      <button type="button" [disabled]="!selectedCampaign" [class.opacity-50]="!selectedCampaign"
        [class.cursor-not-allowed]="!selectedCampaign"
        class="px-3 3xl:px-6 py-1 3xl:py-1.5 text-[10px] sm:text-xs 3xl:text-base rounded-md 3xl:rounded-lg bg-[#1B2559] hover:bg-[#131a3f] text-white font-medium transition-colors disabled:hover:bg-[#1B2559] dark:bg-white dark:text-[#000000] dark:hover:bg-white"
        (click)="continueClicked.emit()">
        {{ t.continue }}
      </button>
    </div>
  </div>
</div>
