<div [class]="compactEmbed ? compactRootClass : rootClass">
  <div [class]="compactEmbed ? compactInnerClass : innerClass">
    @if (!compactEmbed) {
    <div class="shrink-0">
      <div class="flex items-center justify-between w-full">
        <h1 class="text-lg xl:text-sm 3xl:text-2xl font-bold text-[#0F172A] dark:text-white leading-tight">
          {{ t.outboundCampaignStepTitle }}
        </h1>
        <span class="text-xs xl:text-[10px] 3xl:text-sm font-normal text-[#0F172A] dark:text-white leading-tight"
          *ngIf="getCurrentStepNumber() > 0">
          {{ getCurrentStepNumber() }}/{{ getTotalSteps() }}
        </span>
      </div>
      <p class="mt-0.5 3xl:mt-0.5 text-sm xl:text-[10px] 3xl:text-base text-[#6d747c] font-semibold">
        {{ t.outboundCampaignStepSubtitle }}
      </p>
    </div>
    }

    <div [class]="compactEmbed ? 'mt-2 flex w-full flex-col overflow-visible' : 'mt-4 xl:mt-3 3xl:mt-4 flex min-h-0 flex-1 flex-col overflow-hidden'">
      <div [class]="compactEmbed ? 'relative flex w-full flex-col overflow-visible' : 'outbound-instructions-scroll-wrap relative flex min-h-0 w-full flex-1 flex-col'">
        <div
          [class]="compactEmbed ? 'w-full overflow-visible' : 'outbound-instructions-scroll min-h-0 w-full overflow-y-auto overscroll-y-contain touch-pan-y max-xl:max-h-[calc(100dvh-14rem)] xl:max-h-[min(50svh,27.5rem)] 3xl:max-h-[min(52svh,30rem)]'">
          <div [class]="compactEmbed ? compactBodyClass : bodyClass">
            <div class="grid grid-cols-2 gap-4 xl:gap-3 3xl:gap-5">
              @for (kind of campaignOrder; track kind) {
              <button
                type="button"
                (click)="onSelect(kind)"
                class="campaign-card w-full min-h-[4.5rem] sm:min-h-[5rem] xl:min-h-[4.25rem] 3xl:min-h-[5.25rem] rounded-xl xl:rounded-lg 3xl:rounded-xl flex items-center justify-center cursor-pointer px-3 py-3 3xl:px-4 3xl:py-4 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/60 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-100 dark:focus-visible:ring-white/50 dark:focus-visible:ring-offset-[#111113] transition-[border-color,box-shadow,background-color] duration-150 ease-out"
                [class.campaign-card--selected]="selectedCampaign === kind">
                <span class="campaign-card__label">
                  {{ campaignLabel(kind) }}
                </span>
              </button>
              }
            </div>
          </div>
        </div>
      </div>
    </div>

    @if (!compactEmbed) {
    <div class="w-full flex items-center justify-between nav-buttons-mobile shrink-0 mt-4 xl:mt-3 3xl:mt-4">
      <button type="button"
        class="flex items-center gap-0.5 3xl:gap-1 text-zinc-600 dark:text-zinc-300 hover:text-zinc-800 dark:hover:text-zinc-100 transition-colors px-2 3xl:px-3 py-1 3xl:py-1.5 text-[10px] sm:text-xs 3xl:text-base rounded-md 3xl:rounded-lg bg-transparent border border-gray-300 dark:border-zinc-600"
        (click)="backClicked.emit()">
        <span class="text-xs 3xl:text-lg leading-none">‹</span>
        <span>{{ t.back }}</span>
      </button>
      <button type="button" [disabled]="!selectedCampaign" [class.opacity-50]="!selectedCampaign"
        [class.cursor-not-allowed]="!selectedCampaign"
        class="px-3 3xl:px-6 py-1 3xl:py-1.5 text-[10px] sm:text-xs 3xl:text-base rounded-md 3xl:rounded-lg bg-[#1B2559] hover:bg-[#131a3f] text-white font-medium transition-colors disabled:hover:bg-[#1B2559] dark:bg-white dark:text-[#000000] dark:hover:bg-white"
        (click)="continueClicked.emit()">
        {{ t.continue }}
      </button>
    </div>
    }
  </div>
</div>
