<div
  class="w-full h-full bg-transparent flex items-center justify-center overflow-hidden mx-auto max-w-4xl 3xl:max-w-7xl pt-8 sm:pt-12 3xl:pt-16">
  <div
    class="w-full max-w-[440px] sm:max-w-[520px] md:max-w-[620px] xl:max-w-[560px] 3xl:max-w-[600px] flex flex-col px-5 sm:px-6 md:px-7 xl:px-6 3xl:px-6">
    <div class="flex items-center justify-between w-full">
      <h1 class="text-lg xl:text-sm 3xl:text-3xl font-bold text-[#0F172A] dark:text-white leading-tight">
        Prueba de agente
      </h1>
      <span class="text-xs xl:text-[10px] 3xl:text-base font-normal text-[#0F172A] dark:text-white leading-tight"
        *ngIf="getCurrentStepNumber() > 0">
        {{ getCurrentStepNumber() }}/{{ getTotalSteps() }}
      </span>
    </div>
    <p class="mt-0.5 3xl:mt-1 text-sm xl:text-[10px] 3xl:text-lg text-[#6d747c] font-semibold">
      Habla con tu agente para verificar su voz, idioma e instrucciones antes de crear.
    </p>

    <!-- Esfera -->
    <div class="flex flex-col items-center shrink-0 overflow-hidden h-[240px] 3xl:h-[400px] mt-3 3xl:mt-6">
      <div class="scale-[0.7] 3xl:scale-100 origin-top -mt-2 3xl:-mt-0">
        <app-ai-sphere [audioLevel]="audioLevel"></app-ai-sphere>
      </div>
    </div>

    <!-- Botón de probar llamada y microfono -->
    <div class="w-full flex flex-col items-center gap-3 3xl:gap-6 -mt-3 3xl:-mt-6">
      <div class="flex items-center gap-3">
        <!-- Botón Probar llamada -->
        <button type="button" (click)="openVoiceTest()"
          class="flex items-center gap-2 px-4 3xl:px-6 py-2 3xl:py-3 text-xs 3xl:text-base font-medium rounded-full bg-[#1E3A8A] hover:bg-[#1E40AF] text-white transition-all duration-200 shadow-lg hover:shadow-xl dark:bg-white dark:text-black dark:hover:bg-gray-100">
          <svg class="w-4 h-4 3xl:w-5 3xl:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
          </svg>
          Probar llamada
        </button>

        <!-- Botón micrófono (toggle preview local) -->
        <button type="button" (click)="toggleMicrophoneClicked.emit()"
          class="rounded-full flex items-center justify-center shadow-lg hover:shadow-xl transition-all duration-200 border border-gray-200 dark:border-slate-600 hover:border-blue-300 dark:hover:border-blue-500 w-9 h-9 3xl:w-16 3xl:h-16 bg-white dark:bg-slate-800">
          @if (isMicrophoneActive) {
          <svg class="text-red-500 animate-pulse w-5 h-5 3xl:w-10 3xl:h-10" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
            <path
              d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
          </svg>
          } @else {
          <svg class="text-gray-500 dark:text-slate-400 w-5 h-5 3xl:w-10 3xl:h-10" viewBox="0 0 24 24"
            fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
            <path
              d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
            <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
          </svg>
          }
        </button>
      </div>

      <div class="w-full flex items-center justify-between nav-buttons-mobile">
        <button type="button"
          class="flex items-center gap-0.5 3xl:gap-1 text-slate-600 dark:text-slate-300 hover:text-slate-800 dark:hover:text-slate-100 transition-colors px-1.5 3xl:px-3 py-0.5 3xl:py-1.5 text-[9px] sm:text-[10px] 3xl:text-lg rounded-[5px] 3xl:rounded-lg bg-transparent border border-gray-300 dark:border-slate-600"
          (click)="backClicked.emit()">
          <span class="text-xs 3xl:text-xl leading-none">‹</span>
          <span>Atrás</span>
        </button>
        <button type="button"
          class="px-2.5 3xl:px-6 py-0.5 3xl:py-2 text-[9px] sm:text-[10px] 3xl:text-lg rounded-[5px] 3xl:rounded-lg bg-[#1E3A8A] hover:bg-[#1E40AF] text-white font-medium transition-colors dark:bg-white dark:text-[#000000] dark:hover:bg-white"
          (click)="continueClicked.emit()">
          Continuar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Voice Test Call Overlay -->
@if (showVoiceTest) {
  <app-voice-test-call
    [agentInstruction]="agentInstruction"
    [firstInteraction]="firstInteraction"
    [language]="language"
    [agentName]="agentName"
    [voiceId]="voiceId"
    [parameters]="voiceParameters"
    [shopifyDomain]="shopifyDomain"
    (closed)="closeVoiceTest()">
  </app-voice-test-call>
}
