<div
  class="seg-dd"
  [class.seg-dd--op]="variant === 'op'"
  [class.seg-dd--full]="variant === 'full'"
  cdkOverlayOrigin
  #menuOrigin="cdkOverlayOrigin"
>
  <button
    type="button"
    class="seg-dd__trigger"
    [class.seg-dd__trigger--open]="isOpen"
    (click)="toggle(menuOrigin)"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="listbox"
  >
    <span class="seg-dd__value">{{ selectedLabel }}</span>
    <svg
      class="seg-dd__chev"
      [class.seg-dd__chev--open]="isOpen"
      width="12"
      height="8"
      viewBox="0 0 12 8"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M1 1.5L6 6.5L11 1.5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOpen]="isOpen"
    [cdkConnectedOverlayOrigin]="menuOrigin"
    [cdkConnectedOverlayPositions]="positions"
    [cdkConnectedOverlayScrollStrategy]="scrollStrategy"
    [cdkConnectedOverlayHasBackdrop]="false"
    [cdkConnectedOverlayFlexibleDimensions]="true"
    [cdkConnectedOverlayWidth]="overlayWidthBinding"
    cdkConnectedOverlayPanelClass="seg-dd-overlay-pane"
    (overlayOutsideClick)="close()"
    (detach)="close()"
  >
    <div
      class="seg-dd__panel"
      role="listbox"
      (mousedown)="$event.stopPropagation()"
    >
      <button
        type="button"
        *ngFor="let opt of options; trackBy: trackByValue"
        class="seg-dd__option"
        [class.seg-dd__option--active]="opt.value === value"
        role="option"
        [attr.aria-selected]="opt.value === value"
        (mousedown)="$event.stopPropagation()"
        (click)="pick(opt)"
      >
        <span class="seg-dd__option-label">{{ opt.label }}</span>
        <span class="seg-dd__check" *ngIf="opt.value === value" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
            <path
              fill-rule="evenodd"
              d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
              clip-rule="evenodd"
            />
          </svg>
        </span>
      </button>
    </div>
  </ng-template>
</div>
