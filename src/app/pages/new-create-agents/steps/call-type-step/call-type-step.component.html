<div
  class="w-full h-full bg-transparent flex items-center justify-center overflow-hidden mx-auto max-w-4xl 3xl:max-w-7xl pt-8 sm:pt-12 3xl:pt-16">
  <div
    class="w-full max-w-[440px] sm:max-w-[520px] md:max-w-[620px] xl:max-w-[560px] 3xl:max-w-[600px] flex flex-col px-5 sm:px-6 md:px-7 xl:px-6 3xl:px-6">
    <div class="flex items-center justify-between w-full">
      <h1 class="text-lg xl:text-sm 3xl:text-3xl font-bold text-[#0F172A] dark:text-white leading-tight">
        Tipo de llamada
      </h1>
      <span class="text-xs xl:text-[10px] 3xl:text-base font-normal text-[#0F172A] dark:text-white leading-tight"
        *ngIf="getCurrentStepNumber() > 0">
        {{ getCurrentStepNumber() }}/{{ getTotalSteps() }}
      </span>
    </div>
    <p class="mt-0.5 3xl:mt-1 text-sm xl:text-[10px] 3xl:text-lg text-[#6d747c] font-semibold">
      ¿Qué tipo de llamadas atenderá tu agente?
    </p>

    <div class="grid grid-cols-2 gap-4 xl:gap-3 3xl:gap-6 mt-4 xl:mt-3 3xl:mt-5">
      <!-- Inbound -->
      <button type="button" (click)="onSelectCallType('inbound')" [ngClass]="{
          'ring-2 ring-blue-500 dark:ring-white border-blue-500 dark:border-white':
            selectedCallType === 'inbound',
        }"
        class="w-full aspect-square max-h-[130px] xl:max-h-[100px] 3xl:max-h-[180px] rounded-xl xl:rounded-lg 3xl:rounded-xl border border-gray-300 dark:border-white bg-transparent flex flex-col items-center justify-center cursor-pointer hover:border-gray-400 dark:hover:border-white transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-white">
        <div class="text-gray-900 dark:text-white mb-1.5 3xl:mb-3"
          [class.text-blue-600]="selectedCallType === 'inbound'"
          [class.dark:text-blue-400]="selectedCallType === 'inbound'">
          <svg class="w-9 h-9 sm:w-10 sm:h-10 xl:w-8 xl:h-8 3xl:w-16 3xl:h-16" viewBox="0 0 100 100" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M32.0306 20.4041C33.5444 20.4041 34.939 21.2249 35.6735 22.5483L40.7704 31.7293C41.4377 32.9314 41.469 34.3852 40.8542 35.6149L35.9442 45.4352C35.9442 45.4352 37.3671 52.7506 43.3221 58.7056C49.2771 64.6608 56.5681 66.0591 56.5681 66.0591L66.3867 61.1497C67.6173 60.5345 69.0723 60.5664 70.2748 61.2349L79.4817 66.3537C80.8038 67.0887 81.6238 68.4827 81.6238 69.9954V80.5652C81.6238 85.9477 76.624 89.8354 71.5238 88.1145C61.049 84.5799 44.7892 77.8504 34.4833 67.5445C24.1773 57.2385 17.4477 40.9789 13.9133 30.5039C12.1924 25.4039 16.0801 20.4041 21.4627 20.4041H32.0306Z"
              stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
            <path d="M60.4165 41.6665L87.4998 15.6249" stroke="currentColor" stroke-width="5" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M87.4998 41.6665H60.4165V14.5833" stroke="currentColor" stroke-width="5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <span class="text-sm xl:text-xs 3xl:text-xl font-medium text-gray-900 dark:text-white">Inbound</span>
      </button>

      <!-- Outbound -->
      <button type="button" (click)="onSelectCallType('outbound')" [ngClass]="{
          'ring-2 ring-blue-500 dark:ring-white border-blue-500 dark:border-white':
            selectedCallType === 'outbound',
        }"
        class="w-full aspect-square max-h-[130px] xl:max-h-[100px] 3xl:max-h-[180px] rounded-xl xl:rounded-lg 3xl:rounded-xl border border-gray-300 dark:border-white bg-transparent flex flex-col items-center justify-center cursor-pointer hover:border-gray-400 dark:hover:border-slate-400 transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-white">
        <div class="text-gray-900 dark:text-white mb-1.5 3xl:mb-3"
          [class.text-blue-600]="selectedCallType === 'outbound'"
          [class.dark:text-blue-400]="selectedCallType === 'outbound'">
          <svg class="w-9 h-9 sm:w-10 sm:h-10 xl:w-8 xl:h-8 3xl:w-16 3xl:h-16" viewBox="0 0 100 100" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M58.333 41.6667L85.4163 15.625" stroke="currentColor" stroke-width="5" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M58.333 14.5835H85.4163V41.6668" stroke="currentColor" stroke-width="5" stroke-linecap="round"
              stroke-linejoin="round" />
            <path
              d="M29.9476 20.4053C31.4614 20.4053 32.856 21.2263 33.5905 22.5496L38.6874 31.7304C39.3547 32.9325 39.386 34.3865 38.7712 35.6163L33.8612 45.4365C33.8612 45.4365 35.2841 52.7519 41.2391 58.7069C47.1941 64.6619 54.4851 66.0602 54.4851 66.0602L64.3037 61.151C65.5343 60.5356 66.9893 60.5675 68.1918 61.236L77.3987 66.3548C78.7208 67.09 79.5408 68.4837 79.5408 69.9965V80.5662C79.5408 85.949 74.541 89.8367 69.4408 88.1156C58.966 84.5812 42.7062 77.8517 32.4003 67.5456C22.0943 57.2398 15.3647 40.98 11.8303 30.5052C10.1094 25.405 13.9971 20.4053 19.3796 20.4053H29.9476Z"
              stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
          </svg>
        </div>
        <span class="text-sm xl:text-xs font-medium text-gray-900 dark:text-white">Outbound</span>
      </button>
    </div>

    <div class="w-full flex items-center justify-between mt-5 3xl:mt-10 nav-buttons-mobile">
      <button type="button"
        class="flex items-center gap-0.5 3xl:gap-1 text-slate-600 dark:text-slate-300 hover:text-slate-800 dark:hover:text-slate-100 transition-colors px-1.5 3xl:px-3 py-0.5 3xl:py-1.5 text-[9px] sm:text-[10px] 3xl:text-lg rounded-[5px] 3xl:rounded-lg bg-transparent border border-gray-300 dark:border-slate-600"
        (click)="backClicked.emit()">
        <span class="text-xs 3xl:text-xl leading-none">‹</span>
        <span>Atrás</span>
      </button>
      <button type="button" [disabled]="!selectedCallType" [class.opacity-50]="!selectedCallType"
        [class.cursor-not-allowed]="!selectedCallType"
        class="px-2.5 3xl:px-6 py-0.5 3xl:py-2 text-[9px] sm:text-[10px] 3xl:text-lg rounded-[5px] 3xl:rounded-lg bg-[#1E3A8A] hover:bg-[#1E40AF] text-white font-medium transition-colors disabled:hover:bg-[#1E3A8A] dark:bg-white dark:text-[#000000] dark:hover:bg-white"
        (click)="continueClicked.emit()">
        Continuar
      </button>
    </div>
  </div>
</div>
