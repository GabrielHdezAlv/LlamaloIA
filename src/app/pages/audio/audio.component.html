<div class="audio-page">
  <div class="audio-shell">
    <h1>Onda del Audio</h1>

    <div #waveArea class="wave-box">
      <svg
        class="wave-svg"
        [attr.viewBox]="'0 0 ' + svgWidth + ' ' + svgHeight"
        preserveAspectRatio="none"
      >
        <path class="wave-line" [attr.d]="wavePath"></path>
      </svg>
    </div>

    <button type="button" (click)="playPause()" [disabled]="!isReady">
      {{ isPlaying ? 'Pause' : 'Play' }}
    </button>

    <audio
      #audioPlayer
      preload="auto"
      src="/assets/ConversacionLlamalo.mp3"
      (ended)="onAudioEnded()"
    ></audio>
  </div>
</div>
